  var STORE_KEY = 'ledgerboard_progress_v2';
  var LIB_INDEX_KEY = 'ledgerboard_library_index_v1';
  var LIB_ITEM_PREFIX = 'ledgerboard_pgn_v1:';
  var storageOK = true;

  function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK = false; return null; } }
  function safeSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ storageOK = false; return false; } }
  function safeRemove(k){ try{ localStorage.removeItem(k); }catch(e){ storageOK = false; } }

  function freshProgress(keep){
    keep = keep || {};
    return { solved:{}, viewed:{}, opened:{}, rated:{}, last:{}, theme:keep.theme || null, flipOverride:!!keep.flipOverride, rating:1200, history:[] };
  }
  function loadProgress(){
    var raw = safeGet(STORE_KEY);
    if (!raw) return freshProgress();
    try{
      var p = JSON.parse(raw);
      p.solved = p.solved || {}; p.viewed = p.viewed || {}; p.opened = p.opened || {};
      p.last = p.last || {};
      if ('flipped' in p){ delete p.flipped; p.flipOverride = false; }
      p.rating = typeof p.rating === 'number' ? p.rating : 1200;
      p.history = Array.isArray(p.history) ? p.history : [];
      if (!p.rated){
        // Migration: anything already solved or revealed under the old
        // version has already moved the rating once.
        p.rated = {};
        Object.keys(p.solved).forEach(function(k){ p.rated[k] = true; });
        Object.keys(p.viewed).forEach(function(k){ p.rated[k] = true; });
      }
      return p;
    }catch(e){ return freshProgress(); }
  }
  var progress = loadProgress();
  function saveProgress(){ safeSet(STORE_KEY, JSON.stringify(progress)); }

  function loadLibraryIndex(){
    var raw = safeGet(LIB_INDEX_KEY);
    if (!raw) return [];
    try{ var idx = JSON.parse(raw); return Array.isArray(idx) ? idx : []; }catch(e){ return []; }
  }
  function saveLibraryIndex(idx){ return safeSet(LIB_INDEX_KEY, JSON.stringify(idx)); }
  function loadLibraryItems(id){
    var raw = safeGet(LIB_ITEM_PREFIX + id);
    if (!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }
  var library = loadLibraryIndex();

  // Drop progress records that belong to PGN files that no longer exist,
  // so "puzzles solved" only counts puzzles you can still open.
  function pruneOrphans(){
    var live = { endings:true, strategy:true };
    library.forEach(function(l){ live[l.id] = true; });
    var changed = false;
    ['solved','viewed','opened','rated'].forEach(function(bucket){
      Object.keys(progress[bucket]).forEach(function(k){
        var col = k.split('::')[0];
        if (!live[col]){ delete progress[bucket][k]; changed = true; }
      });
    });
    Object.keys(progress.last).forEach(function(col){ if (!live[col]){ delete progress.last[col]; changed = true; } });
    if (changed) saveProgress();
  }
  pruneOrphans();

  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  // ============================================================
  // Theme & flip
  // ============================================================
  function applyTheme(){
    if (progress.theme === 'light' || progress.theme === 'dark') document.documentElement.setAttribute('data-theme', progress.theme);
    else document.documentElement.removeAttribute('data-theme');
  }
  applyTheme();
  $('themeBtn').addEventListener('click', function(){
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var effective = progress.theme || sys;
    progress.theme = effective === 'dark' ? 'light' : 'dark';
    saveProgress(); applyTheme();
  });
  $('flipBtn').addEventListener('click', function(){
    progress.flipOverride = !progress.flipOverride;
    showToast(progress.flipOverride ? 'Board flipped \u2014 tap \u21c5 again to return to the mover\u2019s view' : 'Board follows the side to move');
    saveProgress(); renderBoard();
  });

  function updateRatingBadge(){ ratingBadge.textContent = progress.rating; }

  // ============================================================
  // PGN parser (for uploaded files)
  // ============================================================
  var HEADER_RE = /^\[(\w+)\s+"([\s\S]*?)"\]\s*$/gm;
  var MOVENUM_RE = /^\d+\.+$/;
  var NAG_RE = /^\$\d+$/;
  var COMMENT_PH_RE = /^\u0000(\d+)\u0000$/;
  var RESULT_TOKENS = { '1-0':1, '0-1':1, '1/2-1/2':1, '*':1 };
  var NULL_MOVES = { 'Z0':1, '--':1, '0000':1, '@@@@':1 };

  function extractComments(text){
    var comments = [], out = [], i = 0, n = text.length;
    while (i < n){
      var c = text[i];
      if (c === '{'){
        var j = text.indexOf('}', i + 1);
        if (j === -1) j = n;
        comments.push(text.slice(i + 1, j).trim());
        out.push(' \u0000' + (comments.length - 1) + '\u0000 ');
        i = j + 1;
      } else if (c === ';'){
        var e = text.indexOf('\n', i);
        if (e === -1) e = n;
        comments.push(text.slice(i + 1, e).trim());
        out.push(' \u0000' + (comments.length - 1) + '\u0000 ');
        i = e;
      } else { out.push(c); i++; }
    }
    return { stripped: out.join(''), comments: comments };
  }

  function parseMovetext(movetext){
    var ec = extractComments(movetext);
    var stripped = ec.stripped.replace(/\(/g, ' ( ').replace(/\)/g, ' ) ');
    var tokens = stripped.split(/\s+/).filter(Boolean);
    var depth = 0, mainline = [], moveComments = {}, moveNags = {}, intro = [], cur = -1, stopped = false;
    for (var t = 0; t < tokens.length; t++){
      var tok = tokens[t];
      if (tok === '('){ depth++; continue; }
      if (tok === ')'){ depth = Math.max(0, depth - 1); continue; }
      if (depth > 0) continue;
      if (RESULT_TOKENS[tok]) break;
      var cm = COMMENT_PH_RE.exec(tok);
      if (cm){
        var ctext = ec.comments[parseInt(cm[1], 10)];
        if (!ctext) continue;
        if (cur === -1) intro.push(ctext);
        else (moveComments[cur] = moveComments[cur] || []).push(ctext);
        continue;
      }
      if (stopped) continue;
      // "12.Nf3" glued to its number, or "12...Nf3"
      tok = tok.replace(/^\d+\.+/, '');
      if (!tok || MOVENUM_RE.test(tok)) continue;
      if (NAG_RE.test(tok)){ if (cur >= 0) (moveNags[cur] = moveNags[cur] || []).push(tok); continue; }
      // A null move ("pass") can't be played on a real board, so the
      // puzzle line ends there instead of becoming unplayable.
      if (NULL_MOVES[tok]){ stopped = true; continue; }
      mainline.push(tok);
      cur = mainline.length - 1;
    }
    return { mainline: mainline, moveComments: moveComments, moveNags: moveNags, intro: intro.join(' ').trim() };
  }

  function cleanComment(text){ return text.replace(/\[%\w+[^\]]*\]/g, '').replace(/\s+/g, ' ').trim(); }
  function splitGames(txt){
    return txt.trim().split(/\n\s*(?=\[Event )/).filter(function(p){ return p.trim().length; });
  }

  function parsePgnText(text, sourceId){
    text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    var items = [], pnum = 0;
    splitGames(text).forEach(function(block){
      HEADER_RE.lastIndex = 0;
      var headers = {}, lastEnd = 0, mm;
      while ((mm = HEADER_RE.exec(block)) !== null){ headers[mm[1]] = mm[2]; lastEnd = mm.index + mm[0].length; }
      var pr = parseMovetext(block.slice(lastEnd));
      var mc = {};
      Object.keys(pr.moveComments).forEach(function(k){ var j = cleanComment(pr.moveComments[k].join(' ')); if (j) mc[k] = j; });
      var chapter = (headers.White || '').trim(), title = (headers.Black || '').trim(), fen = (headers.FEN || '').trim();
      var intro = cleanComment(pr.intro);
      if (!fen || pr.mainline.length === 0){
        items.push({ type:'text', source:sourceId, chapter:chapter, title:title, intro:intro });
        return;
      }
      pnum++;
      var ev = (headers.Event || '').trim(), date = (headers.Date || '').trim();
      items.push({ type:'puzzle', source:sourceId, num:pnum, chapter:chapter, title:title, fen:fen,
                   moves:pr.mainline, moveComments:mc, moveNags:pr.moveNags, intro:intro,
                   game: (chapter && title && ev && ev !== '?') ? (chapter + ' \u2013 ' + title + ', ' + ev) : '' });
    });
    return items;
  }

  // ============================================================
  // Collections
  // ============================================================
  function buildChapters(items){
    var order = [], seen = {}, puzzleCount = 0;
    items.forEach(function(it){
      if (it.type === 'puzzle') puzzleCount++;
      var c = it.chapter || '—';
      if (!seen[c]){ seen[c] = true; order.push(c); }
    });
    // Per-puzzle labels ("No 1", "No 2", ...) are numbering, not chapters.
    return (order.length > 1 && order.length < puzzleCount) ? order : null;
  }
  function countPuzzles(items){ var n = 0; items.forEach(function(it){ if (it.type === 'puzzle') n++; }); return n; }

  var colCache = {};
  function collectionFor(key){
    if (colCache[key]) return colCache[key];
    var col = null;
    if (key === 'endings' || key === 'strategy'){
      var items = DATA[key];
      col = { key:key, kind:'builtin', label: key === 'endings' ? 'Practical Chess Endings' : 'Chess Strategy: Simplified',
              shortLabel: key === 'endings' ? 'Endings' : 'Strategy', items:items };
    } else {
      var entry = library.filter(function(l){ return l.id === key; })[0];
      if (!entry) return null;
      var its = loadLibraryItems(key);
      if (!its) return null;
      col = { key:key, kind:'custom', label:entry.filename, shortLabel:entry.filename.replace(/\.pgn$/i, ''), items:its };
    }
    col.chapters = buildChapters(col.items);
    col.puzzleCount = countPuzzles(col.items);
    colCache[key] = col;
    return col;
  }
  function allCollectionKeys(){ return ['endings','strategy'].concat(library.map(function(l){ return l.id; })); }

  // ============================================================
  // State
  // ============================================================
  var state = {
    collectionKey:'endings', collection:null, chapter:null, filtered:[], index:0,
    chess:null, solverColor:'w', moveIndex:0, selected:null, solved:false, revealed:false,
    wrongCount:0, hintsUsed:0, autoplaying:false, startTime:null, timerHandle:null,
    // Bumped every time a puzzle is (re)loaded. Delayed callbacks (the
    // opponent's auto-reply, the "reveal" playback) capture it and quit if
    // it changed, so they can never act on a different puzzle's board.
    token:0
  };

  // ============================================================
  // Library navigator: a collapsible tree of
  //   collection (built-in book or your PGN file)
  //     └ group (chapter / theme — omitted when a file has none)
  //         └ puzzle numbers
  // It is the left column in landscape, and opens from the
  // "Library" button in portrait (where the current group's numbers
  // also stay visible as a row under the breadcrumb).
  // ============================================================
  var navTree = $('navTree'), treeHome = $('treeHome'), drawer = $('drawer'), drawerBody = $('drawerBody'),
      crumbsEl = $('crumbs');
  progress.open = progress.open || {};

  function keyFor(colKey, item){ return colKey + '::' + item.source + ':' + item.num; }
  function recordKey(item){ return keyFor(state.collectionKey, item); }
  function groupOf(it){ return it.chapter || '—'; }

  function statusFor(colKey, item){
    var k = keyFor(colKey, item);
    if (progress.solved[k]) return 'solved';
    if (progress.viewed[k]) return 'wrong';
    if (progress.opened[k]) return 'opened';
    return 'unopened';
  }
  function puzzleStatus(item){ return statusFor(state.collectionKey, item); }
  var STATUS_TEXT = { solved:'solved', wrong:'answer revealed', opened:'opened, unanswered', unopened:'not opened yet' };

  function tally(colKey, items){
    var total = 0, solved = 0;
    items.forEach(function(it){ if (it.type === 'puzzle'){ total++; if (progress.solved[keyFor(colKey, it)]) solved++; } });
    return { total: total, solved: solved };
  }

  function firstUnsolvedIndex(list){
    for (var i = 0; i < list.length; i++){
      var it = list[i];
      if (it.type === 'puzzle' && !progress.solved[recordKey(it)]) return i;
    }
    return 0;
  }

  // Open a given collection / group at a position in that group's list.
  function openAt(key, chapter, index){
    var col = collectionFor(key);
    if (!col){ showToast('Could not open that file.'); return; }
    state.collectionKey = key;
    state.collection = col;
    collectionLabel.textContent = col.label;
    if (col.chapters){
      if (col.chapters.indexOf(chapter) === -1) chapter = col.chapters[0];
      state.chapter = chapter;
      state.filtered = col.items.filter(function(it){ return groupOf(it) === chapter; });
    } else {
      state.chapter = null;
      state.filtered = col.items;
    }
    if (index === 'unsolved') index = firstUnsolvedIndex(state.filtered);
    // Expand the path to what's on the board, and fold away the
    // collection / group you just left so the list stays short.
    var pathKey = key + '::' + (state.chapter || '');
    if (pathKey !== openAt._last){
      var prev = openAt._last ? openAt._last.split('::') : null;
      if (prev && prev[0] !== key) delete progress.open['c:' + prev[0]];
      if (prev && prev[1] && (prev[0] !== key || prev[1] !== state.chapter)) delete progress.open['g:' + prev[0] + '::' + prev[1]];
      openAt._last = pathKey;
    }
    progress.open['c:' + key] = true;
    if (state.chapter) progress.open['g:' + key + '::' + state.chapter] = true;
    goToIndex(index || 0);
  }
  function switchCollection(key){
    var col = collectionFor(key);
    if (!col){ showToast('Could not open that file.'); return; }
    var last = progress.last[key];
    if (last) openAt(key, last.chapter, last.index);
    else openAt(key, col.chapters ? col.chapters[0] : null, 'unsolved');
  }
  function setChapter(ch, index){ openAt(state.collectionKey, ch, index); }

  // Prev / Next run through the whole collection: at the end of a group
  // they continue into the neighbouring group.
  function neighbour(dir){
    if (state.index + dir >= 0 && state.index + dir < state.filtered.length) return { chapter: state.chapter, index: state.index + dir };
    var chs = state.collection && state.collection.chapters;
    if (!chs) return null;
    var ci = chs.indexOf(state.chapter) + dir;
    if (ci < 0 || ci >= chs.length) return null;
    var ch = chs[ci];
    if (dir > 0) return { chapter: ch, index: 0 };
    var n = state.collection.items.filter(function(it){ return groupOf(it) === ch; }).length;
    return { chapter: ch, index: n - 1 };
  }
  function step(dir){
    var t = neighbour(dir);
    if (!t) return;
    if (t.chapter === state.chapter) goToIndex(t.index);
    else openAt(state.collectionKey, t.chapter, t.index);
  }

  function toggleOpen(id){
    var opening = !progress.open[id];
    if (opening && id.indexOf('c:') === 0){
      Object.keys(progress.open).forEach(function(k){ if (k.indexOf('c:') === 0) delete progress.open[k]; });
    }
    progress.open[id] = opening;
    saveProgress();
    renderTree();
  }

  function chevron(open){
    var s = el('span', 'chev' + (open ? ' open' : ''), '▸');
    s.setAttribute('aria-hidden', 'true');
    return s;
  }

  function nodeRow(cls, label, count, open, onToggle, extra){
    var row = el('div', 'tree-row ' + cls);
    var b = el('button', 'tree-btn');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.appendChild(chevron(open));
    b.appendChild(el('span', 'tree-label', label));
    if (count) b.appendChild(el('span', 'tree-count', count));
    b.addEventListener('click', onToggle);
    row.appendChild(b);
    if (extra) row.appendChild(extra);
    return row;
  }

  function platesFor(colKey, chapter, list){
    var grid = el('div', 'tree-plates');
    list.forEach(function(it, idx){
      var isCurrent = colKey === state.collectionKey && chapter === state.chapter && idx === state.index;
      var b;
      if (it.type === 'puzzle'){
        var st = statusFor(colKey, it);
        b = el('button', 'plate' + (st !== 'unopened' ? ' ' + st : '') + (isCurrent ? ' current' : ''), it.num);
        b.title = 'No. ' + it.num + ' — ' + STATUS_TEXT[st];
      } else {
        b = el('button', 'plate lesson' + (isCurrent ? ' current' : ''), '¶');
        b.title = 'Lesson: ' + (it.title || 'text');
      }
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', function(){
        openAt(colKey, chapter, idx);
        closeDrawer();
      });
      grid.appendChild(b);
    });
    return grid;
  }

  function renderTree(){
    var oldKids = navTree.querySelector('.tree-node.col.open > .tree-kids');
    var keepKey = oldKids ? oldKids.getAttribute('data-col') : null, keep = oldKids ? oldKids.scrollTop : 0;
    navTree.innerHTML = '';
    allCollectionKeys().forEach(function(key){
      var col = collectionFor(key);
      if (!col) return;
      var cOpen = !!progress.open['c:' + key];
      var t = tally(key, col.items);
      var node = el('div', 'tree-node col' + (key === state.collectionKey ? ' active' : '') + (cOpen ? ' open' : ''));
      var del = col.kind === 'custom' ? trashButton('Delete ' + col.label, function(){ confirmDelete(key); }) : null;
      var label = (col.kind === 'custom' ? '' : '') + (col.kind === 'custom' ? col.shortLabel : col.label);
      node.appendChild(nodeRow('col-row', label, t.solved + '/' + t.total, cOpen, function(){ toggleOpen('c:' + key); }, del));
      if (cOpen){
        var kids = el('div', 'tree-kids');
        kids.setAttribute('data-col', key);
        if (col.chapters){
          col.chapters.forEach(function(ch){
            var items = col.items.filter(function(it){ return groupOf(it) === ch; });
            var gid = 'g:' + key + '::' + ch, gOpen = !!progress.open[gid];
            var gt = tally(key, items);
            var g = el('div', 'tree-node grp' + (key === state.collectionKey && ch === state.chapter ? ' active' : ''));
            g.appendChild(nodeRow('grp-row', ch, gt.total ? gt.solved + '/' + gt.total : '', gOpen, function(){ toggleOpen(gid); }));
            if (gOpen) g.appendChild(platesFor(key, ch, items));
            kids.appendChild(g);
          });
        } else {
          kids.appendChild(platesFor(key, null, col.items));
        }
        node.appendChild(kids);
      }
      navTree.appendChild(node);
    });
    var add = el('button', 'tree-add', '+ Add PGN file');
    add.addEventListener('click', function(){ closeDrawer(); fileInput.click(); });
    navTree.appendChild(add);
    var newKids = navTree.querySelector('.tree-node.col.open > .tree-kids');
    if (newKids && keepKey && newKids.getAttribute('data-col') === keepKey) newKids.scrollTop = keep;
  }

  function scrollCurrentIntoView(){
    var cur = navTree.querySelector('.plate.current');
    if (cur && cur.scrollIntoView && (isThreeCol() || drawer.classList.contains('open'))) cur.scrollIntoView({ block:'nearest' });
    var cur2 = puzzleNumStripEl.querySelector('.plate.current');
    if (cur2 && cur2.scrollIntoView && !isThreeCol()) cur2.scrollIntoView({ inline:'center', block:'nearest' });
  }

  // Portrait: breadcrumb + the current group's numbers in one row.
  function renderPuzzleNumberStrip(){
    var col = state.collection;
    crumbsEl.innerHTML = '';
    if (col){
      crumbsEl.appendChild(el('span', 'crumb-col', col.kind === 'custom' ? col.shortLabel : col.label));
      if (state.chapter){
        crumbsEl.appendChild(el('span', 'crumb-sep', '›'));
        crumbsEl.appendChild(el('span', 'crumb-grp', state.chapter));
      }
    }
    puzzleNumStripEl.innerHTML = '';
    if (state.filtered.length > 1){
      puzzleNumStripEl.style.display = '';
      puzzleNumStripEl.appendChild(platesFor(state.collectionKey, state.chapter, state.filtered));
    } else {
      puzzleNumStripEl.style.display = 'none';
    }
    renderTree();
    scrollCurrentIntoView();
  }
  function renderCollectionStrip(){ renderTree(); }

  function placeNav(){
    if (isThreeCol()){ if (navTree.parentNode !== treeHome) treeHome.appendChild(navTree); closeDrawer(); }
    else if (navTree.parentNode !== drawerBody) drawerBody.appendChild(navTree);
  }
  function openDrawer(){
    placeNav();
    renderTree();
    drawer.classList.add('open');
    setTimeout(scrollCurrentIntoView, 30);
  }
  function closeDrawer(){ drawer.classList.remove('open'); }
  $('libraryBtn').addEventListener('click', openDrawer);
  crumbsEl.addEventListener('click', openDrawer);
  $('drawerClose').addEventListener('click', closeDrawer);
  drawer.addEventListener('click', function(e){ if (e.target === drawer) closeDrawer(); });


  function goToIndex(i){
    if (i >= state.filtered.length) i = state.filtered.length - 1;
    if (i < 0) i = 0;
    state.index = i;
    progress.last[state.collectionKey] = { chapter: state.chapter, index: i };
    progress.lastCollection = state.collectionKey;
    saveProgress();
    loadCurrentItem();
  }
  function currentItem(){ return state.filtered[state.index]; }

  // ============================================================
  // Feedback: toast, tone, vibration
  // ============================================================
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
  }
  var audioCtx = null;
  function playTone(freq, dur){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), now = audioCtx.currentTime;
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    }catch(e){}
  }
  function vibrate(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function notifyWrongMove(msg){ showToast(msg); vibrate(120); playTone(220, 0.16); }

  // ============================================================
  // Loading an item
  // ============================================================
  function stopTimer(){ if (state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle = null; } }

  function makeChess(fen){
    try{
      var c = new Chess();
      return c.load(fen) ? c : null;   // chess.js 0.10 doesn't throw on bad FENs
    }catch(e){ return null; }
  }

  function loadCurrentItem(){
    stopTimer();
    state.token++;
    state.autoplaying = false;
    state.selected = null;
    var item = currentItem();
    if (!item){
      mainEl.innerHTML = '';
      mainEl.appendChild(el('div', 'loading', 'Nothing here yet.'));
      resetSidebarRight(); renderPuzzleNumberStrip(); renderFooter(); return;
    }
    renderPuzzleNumberStrip();
    if (item.type === 'text'){ state.chess = null; renderLesson(item); return; }

    state.chess = makeChess(item.fen);
    if (!state.chess){
      mainEl.innerHTML = '';
      mainEl.appendChild(el('div', 'err', 'This position could not be loaded — its FEN looks invalid. Try the next puzzle.'));
      resetSidebarRight(); renderFooter(); return;
    }

    var key = recordKey(item);
    if (!progress.opened[key]){ progress.opened[key] = true; saveProgress(); }

    state.solverColor = state.chess.turn();
    state.moveIndex = 0;
    state.solved = !!progress.solved[key];
    state.revealed = false;
    state.wrongCount = 0;
    state.hintsUsed = 0;
    state.startTime = Date.now();
    renderPuzzle(item);
    renderPuzzleNumberStrip();
    state.timerHandle = setInterval(updateTimerDisplay, 1000);
  }

  function formatTime(ms){
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function updateTimerDisplay(){
    var t = $('liveTimer');
    if (t && state.startTime) t.textContent = formatTime(Date.now() - state.startTime);
  }

  // ============================================================
  // Lesson page
  // ============================================================
  function renderLesson(item){
    mainEl.innerHTML = '';
    resetSidebarRight();
    var wrap = el('article', 'lesson');
    wrap.appendChild(el('div', 'kicker', (state.collection.shortLabel + ' · ' + (item.chapter || 'Lesson'))));

  // ============================================================
  // Puzzle page
  // ============================================================
  var NAG_MAP = {
    '$1':'good move', '$2':'weak move', '$3':'excellent move', '$4':'blunder', '$5':'interesting move',
    '$6':'dubious move', '$7':'forced move', '$10':'drawish', '$11':'equal position', '$13':'unclear',
    '$14':'slight edge, White', '$15':'slight edge, Black', '$16':'clear advantage, White', '$17':'clear advantage, Black',
    '$18':'winning for White', '$19':'winning for Black'
  };

  var controlsDock = $('controlsDock'), ledgerBox = $('ledgerBox');
  function isThreeCol(){ return window.matchMedia(THREE_COL).matches; }

  // Hint / Reset / feedback sit under the board in portrait, and at the
  // top of the right-hand column in landscape so the board can use the
  // full height of the screen.
  function placeControls(){
    var c = $('controls'), ph = $('plateHead'), dg = $('diagram');

      if (c && c.parentNode !== mainEl) mainEl.appendChild(c);
    }
  }

  function resetSidebarRight(){
    controlsDock.innerHTML = '';
    ledgerBox.innerHTML = '';
    var head = el('div', 'ledger-head');
    head.appendChild(el('span', 'kicker', 'The ledger'));
    ledgerBox.appendChild(head);
    var ledger = el('div', 'ledger'); ledger.id = 'ledger';
    ledgerBox.appendChild(ledger);
    var note = el('div', 'empty-note', 'Moves you play — or the answer, once revealed — are written here.');
    note.id = 'ledgerEmpty';
    ledgerBox.appendChild(note);
  }

  function pad3(n){ n = String(n); return n.length >= 3 ? n : ('00' + n).slice(-3); }

  function renderPuzzle(item){
    mainEl.innerHTML = '';
    resetSidebarRight();
    var key = recordKey(item);

    if (item.game) left.appendChild(el('p', 'plate-title', item.game));
    else if (showTitle) left.appendChild(el('p', 'plate-title', item.title));
    else if (col.chapters && item.chapter) left.appendChild(el('p', 'plate-title', kind));
    head.appendChild(left);

    var meters = el('div', 'meters');
    var stampClass = state.solved ? ' solved' : (progress.viewed[key] ? ' revealed' : '');
    var stamp = el('span', 'stamp' + stampClass, state.solved ? 'Solved ✓' : (progress.viewed[key] ? 'Revealed' : 'Unsolved'));

    mainEl.appendChild(cap);

    var fb = el('div', 'feedback', item.intro ? 'Study the position, then play the main line.' : 'Find the best move for ' + (state.solverColor === 'w' ? 'White' : 'Black') + '.');
    fb.id = 'feedback';
    fb.setAttribute('aria-live', 'polite');
    var controls = el('div'); controls.id = 'controls';

    actions.appendChild(hintBtn); actions.appendChild(resetBtn);

    if (item.intro){

  function squareEl(name){ return document.querySelector('.sq[data-sq="' + name + '"]'); }

  // Square size is a whole number of pixels so all 64 squares are equal;
  // it's derived from the space the diagram actually has.
  var THREE_COL = '(orientation: landscape) and (min-width: 700px)';
  // Makes the board as large as the screen allows: full column width, but
  // never taller than the space left between the plate heading and the
  // footer, so the whole board is visible without scrolling.
  function sizeBoard(){
    var diagram = $('diagram');
    if (!diagram) return;
    var cs = getComputedStyle(mainEl);
    var GUTTER = 14 + 10 + 2;   // rank letters, frame borders + padding
    var availW = mainEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - GUTTER + 7;
    var head = mainEl.querySelector('.plate-head');
    var headH = head ? head.offsetHeight + parseFloat(cs.rowGap || cs.gap || 12) : 0;
    var captionH = 30, filesH = 14 + 10;
    var availH;
    if (isThreeCol()){
      availH = mainEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - headH - captionH - filesH;
    } else {
      var footer = $('footer');
      var top = head ? head.getBoundingClientRect().top + window.scrollY : 0;
      availH = window.innerHeight - (footer ? footer.offsetHeight : 0) - top - headH - captionH - filesH;
      // On short screens prefer a readable board and let the page scroll.
      availH = Math.max(availH, Math.min(availW, window.innerHeight * 0.62));
    }
    var w = Math.min(availW, availH);
    var sq = Math.max(24, Math.floor(w / 8));
    diagram.style.setProperty('--sq', sq + 'px');
  }
  window.matchMedia(THREE_COL).addEventListener('change', function(){
    placeControls(); placeNav(); sizeBoard(); scrollCurrentIntoView();
  });
  window.addEventListener('resize', function(){
    clearTimeout(sizeBoard._t);
    sizeBoard._t = setTimeout(sizeBoard, 100);
  });

  var GLYPHS = {
    w:{ k:'♔︎', q:'♕︎', r:'♖︎', b:'♗︎', n:'♘︎', p:'♙︎' },
    b:{ k:'♚︎', q:'♛︎', r:'♜︎', b:'♝︎', n:'♞︎', p:'♟︎' }
  };
  var PIECE_NAMES = { k:'king', q:'queen', r:'rook', b:'bishop', n:'knight', p:'pawn' };

  function findKingSquare(chess, color){
    var f = 'abcdefgh';
    for (var r = 1; r <= 8; r++) for (var i = 0; i < 8; i++){
      var s = f[i] + r, p = chess.get(s);
      if (p && p.type === 'k' && p.color === color) return s;
    }
    return null;
  }

  function renderBoard(){
    var board = $('board');
    if (!board || !state.chess) return;
    board.innerHTML = '';
    var files = ['a','b','c','d','e','f','g','h'];
    // The side to move always sits at the bottom (Black to move = viewed
    // from Black). The flip button inverts that, for every puzzle.
    var flipped = (state.solverColor === 'b') !== !!progress.flipOverride;
    var rankOrder = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
    var fileOrder = flipped ? files.slice().reverse() : files;

    var ranksEl = $('ranks'), filesEl = $('files');
    if (ranksEl){ ranksEl.innerHTML = ''; rankOrder.forEach(function(r){ ranksEl.appendChild(el('span', null, r)); }); }
    if (filesEl){ filesEl.innerHTML = ''; fileOrder.forEach(function(f){ filesEl.appendChild(el('span', null, f)); }); }

    var hist = state.chess.history({ verbose:true });
    var lastMove = hist[hist.length - 1];
    var inCheckSq = state.chess.in_check() ? findKingSquare(state.chess, state.chess.turn()) : null;
    var frag = document.createDocumentFragment();

    for (var r = 0; r < 8; r++){
      for (var f = 0; f < 8; f++){
        var file = fileOrder[f], rank = rankOrder[r], name = file + rank;
        var isLight = (files.indexOf(file) + rank) % 2 === 1;
        var sq = el('div', 'sq ' + (isLight ? 'light' : 'dark'));
        sq.setAttribute('data-sq', name);
        sq.setAttribute('role', 'gridcell');
        var piece = state.chess.get(name);
        sq.setAttribute('aria-label', name + (piece ? ', ' + (piece.color === 'w' ? 'white ' : 'black ') + PIECE_NAMES[piece.type] : ''));
        if (piece) sq.appendChild(el('span', 'glyph ' + piece.color, GLYPHS[piece.color][piece.type]));
        if (lastMove && lastMove.from === name) sq.classList.add('from');
        if (lastMove && lastMove.to === name) sq.classList.add('to');
        if (inCheckSq === name) sq.classList.add('check');
        if (state.selected === name) sq.classList.add('sel');
        sq.addEventListener('click', onSquareClick);
        frag.appendChild(sq);
      }
    }
    board.appendChild(frag);
    if (state.selected) highlightMoves(state.selected);
  }

  function highlightMoves(from){
    var seen = {};
    state.chess.moves({ square:from, verbose:true }).forEach(function(m){
      if (seen[m.to]) return;
      seen[m.to] = true;
      var s = squareEl(m.to);
      if (s) s.appendChild(el('span', state.chess.get(m.to) ? 'ring' : 'dot'));
    });
  }

  function onSquareClick(e){
    if (state.autoplaying || state.revealed) return;
    var item = currentItem();
    if (!item || item.type !== 'puzzle' || !state.chess) return;
    if (state.chess.turn() !== state.solverColor) return;
    if (state.moveIndex >= item.moves.length) return;

    var name = e.currentTarget.getAttribute('data-sq');
    var piece = state.chess.get(name);
    if (state.selected){
      if (state.selected === name){ state.selected = null; renderBoard(); return; }
      var legal = state.chess.moves({ square:state.selected, verbose:true }).some(function(m){ return m.to === name; });
      if (!legal){
        state.selected = (piece && piece.color === state.solverColor) ? name : null;
        renderBoard(); return;
      }
      attemptMove(name);
    } else if (piece && piece.color === state.solverColor){
      state.selected = name; renderBoard();
    }
  }

  function normSan(s){ return (s || '').replace(/[+#!?]+$/, '').replace(/=/, ''); }

  // Works out which legal move the book's next move refers to. An exact
  // SAN match comes first; if the book writes it differently (e.g. an
  // unnecessary disambiguation like "Rcg8" for "Rg8"), chess.js's lenient
  // parser resolves it on a scratch copy of the position.
  function resolveMove(chess, san){
    if (san === undefined) return null;
    var target = normSan(san), verbose = chess.moves({ verbose:true });
    for (var i = 0; i < verbose.length; i++) if (normSan(verbose[i].san) === target) return verbose[i];
    try{
      var scratch = new Chess(chess.fen());
      var m = scratch.move(san, { sloppy:true });
      if (m) return m;
    }catch(e){}
    return null;
  }
  function expectedMove(item){ return resolveMove(state.chess, item.moves[state.moveIndex]); }
  function playBookMove(item){
    var m = resolveMove(state.chess, item.moves[state.moveIndex]);
    return m ? state.chess.move({ from:m.from, to:m.to, promotion:m.promotion }) : null;
  }

  function setFeedback(cls, text){
    var fb = $('feedback');
    if (!fb) return;
    fb.className = 'feedback' + (cls ? ' ' + cls : '');
    void fb.offsetWidth;  // restart the shake animation on repeated misses
    fb.textContent = text;
  }

  function attemptMove(to){
    var item = currentItem();
    var exp = expectedMove(item);
    var correct = exp && exp.from === state.selected && exp.to === to;
    if (correct){
      var res = state.chess.move({ from:exp.from, to:exp.to, promotion:exp.promotion });
      state.selected = null;
      appendLedgerLine(item, state.moveIndex, res.san);
      state.moveIndex++;
      setFeedback('good', 'Correct — ' + res.san);
      renderBoard();
      if (state.moveIndex >= item.moves.length) onSolved(item);
      else maybeAutoReply(item);
    } else {
      state.wrongCount++;
      state.selected = null;
      var msg = state.wrongCount >= 3 ? 'Not quite. Tap Hint if you’d like a nudge.' : 'Not quite — try again.';
      setFeedback('bad', msg);
      var wc = $('wrongCount');
      if (wc){ wc.textContent = '✗ ' + state.wrongCount; wc.style.display = ''; }
      notifyWrongMove(msg);
      renderBoard();
    }
  }

  function maybeAutoReply(item){
    if (state.chess.turn() === state.solverColor) return;
    state.autoplaying = true;
    var token = state.token;
    setTimeout(function(){
      if (token !== state.token) return;   // puzzle changed meanwhile
      if (state.moveIndex >= item.moves.length){ state.autoplaying = false; return; }
      var res = playBookMove(item);
      if (res) appendLedgerLine(item, state.moveIndex, res.san);
      state.moveIndex++;
      state.autoplaying = false;
      renderBoard();
      if (!res && state.moveIndex < item.moves.length){
        // Unplayable data: stop cleanly rather than drifting out of sync.
        state.moveIndex = item.moves.length;
      }
      if (state.moveIndex >= item.moves.length) onSolved(item);
      else {
        setFeedback('', 'Your move.');
        if (state.chess.turn() !== state.solverColor) maybeAutoReply(item);
      }
    }, 550);
  }

  function showLedger(){ var e = $('ledgerEmpty'); if (e) e.style.display = 'none'; }

  function appendLedgerLine(item, idx, san){
    var ledger = $('ledger');
    if (!ledger) return;
    showLedger();
    var startedWhite = item.fen.split(' ')[1] === 'w';
    var fullmove = parseInt(item.fen.split(' ')[5], 10) || 1;
    var ply = startedWhite ? idx : idx + 1;
    var moveNo = fullmove + Math.floor(ply / 2);
    var whiteMove = ply % 2 === 0;
    var line = el('div', 'line');
    line.appendChild(el('span', 'mn', moveNo + (whiteMove ? '.' : '…')));
    var body = el('span');
    body.appendChild(el('span', 'san', san || item.moves[idx]));
    var nag = item.moveNags && item.moveNags[String(idx)];
    if (nag && nag.length) body.appendChild(el('span', 'nag', nag.map(function(n){ return NAG_MAP[n] || n; }).join(', ')));
    line.appendChild(body);
    var comment = item.moveComments && item.moveComments[String(idx)];
    if (comment) line.appendChild(el('p', 'cm', comment));
    ledger.appendChild(line);
    if (line.scrollIntoView && sidebarRightEl.scrollHeight > sidebarRightEl.clientHeight) line.scrollIntoView({ block:'nearest' });
  }

  // ---- rating: Elo-style estimate of solving strength ----
  function puzzleDifficulty(item){
    // Position within the whole collection (books get harder as they go)
    // plus the length of the line you have to find.
    var total = (state.collection && state.collection.puzzleCount) || 1;
    var posRatio = Math.min(1, (item.num || 1) / total);
    var yourMoves = Math.ceil(Math.min(item.moves.length, 40) / 2);
    return Math.round(950 + posRatio * 650 + yourMoves * 12);
  }

  // Each puzzle moves the rating once, on its first outcome: a clean solve
  // scores 1, hints and wrong tries reduce that, and revealing the answer
  // scores 0. Replaying a puzzle (or resetting it after a reveal) can't
  // farm points.
  function applyRatingUpdate(item, score, elapsed){
    var key = recordKey(item);
    if (progress.rated[key]) return 0;
    progress.rated[key] = true;
    var diff = puzzleDifficulty(item);
    var expected = 1 / (1 + Math.pow(10, (diff - progress.rating) / 400));
    var before = progress.rating;
    var after = Math.max(400, Math.min(2800, Math.round(before + 22 * (score - expected))));
    progress.rating = after;
    progress.history.push({ t:Date.now(), rating:after, delta:after - before, key:key, score:score, ms:elapsed });
    if (progress.history.length > 300) progress.history = progress.history.slice(-300);
    updateRatingBadge();
    return after - before;
  }

  function solveScore(){
    var s = 1 - 0.25 * state.hintsUsed - 0.1 * state.wrongCount;
    return Math.max(0.5, Math.round(s * 100) / 100);
  }

  function onSolved(item){
    stopTimer();
    var elapsed = Date.now() - state.startTime;
    var key = recordKey(item);
    var wasRevealed = state.revealed;
    state.solved = true;
    progress.solved[key] = true;
    var delta = wasRevealed ? 0 : applyRatingUpdate(item, solveScore(), elapsed);
    saveProgress();
    var deltaTxt = delta ? ('  ·  Rating ' + progress.rating + ' (' + (delta > 0 ? '+' : '') + delta + ')') : '';
    setFeedback('good', 'Solved in ' + formatTime(elapsed) + '.' + deltaTxt);
    var t = $('liveTimer');
    if (t){ t.textContent = formatTime(elapsed); t.classList.add('done'); }
    var stamp = $('stamp');
    if (stamp){ stamp.className = 'stamp solved'; stamp.textContent = 'Solved ✓'; }
    showLedger();
    renderFooter();
    renderPuzzleNumberStrip();
    showToast('Puzzle solved ✓');
    playTone(660, 0.12);
  }

  function onHint(){
    var item = currentItem();
    if (!item || item.type !== 'puzzle' || !state.chess || state.revealed) return;
    if (state.autoplaying || state.chess.turn() !== state.solverColor || state.moveIndex >= item.moves.length){
      showToast('No hint needed right now.'); return;
    }
    var exp = expectedMove(item);
    if (!exp){ showToast('No hint available.'); return; }
    state.hintsUsed++;
    var s = squareEl(exp.from);
    if (s){
      var mark = el('span', 'hintmark');
      s.appendChild(mark);
      setTimeout(function(){ if (mark.parentNode) mark.parentNode.removeChild(mark); }, 2300);
    }
    showToast('Hint: move the piece on ' + exp.from);
  }

  function onReveal(){
    var item = currentItem();
    if (!item || item.type !== 'puzzle' || !state.chess || state.revealed) return;
    var key = recordKey(item);
    state.revealed = true;
    state.selected = null;
    if (!state.solved){
      progress.viewed[key] = true;
      applyRatingUpdate(item, 0, Date.now() - state.startTime);
      var stamp = $('stamp');
      if (stamp){ stamp.className = 'stamp revealed'; stamp.textContent = 'Revealed'; }
    }
    saveProgress();
    stopTimer();
    renderPuzzleNumberStrip();
    showLedger();
    state.autoplaying = true;
    setFeedback('', state.moveIndex ? 'Playing out the rest of the line…' : 'Playing through the solution…');
    renderBoard();
    var token = state.token;
    (function step(){
      if (token !== state.token) return;   // navigated away / reset
      if (state.moveIndex >= item.moves.length){
        state.autoplaying = false;
        setFeedback('', 'Solution complete. Tap Reset to try it yourself.');
        renderFooter();
        return;
      }
      var res = playBookMove(item);
      if (res) appendLedgerLine(item, state.moveIndex, res.san);
      state.moveIndex = res ? state.moveIndex + 1 : item.moves.length;
      renderBoard();
      setTimeout(step, 520);
    })();
    renderFooter();
  }

  // ============================================================
  // Footer / navigation
  // ============================================================
  function renderFooter(){
    var item = currentItem();
    prevBtn.disabled = !neighbour(-1);
    nextBtn.disabled = !neighbour(1);
    counterEl.innerHTML = '';
    counterEl.appendChild(document.createTextNode((state.filtered.length ? state.index + 1 : 0) + ' / ' + state.filtered.length));
    counterEl.appendChild(document.createElement('br'));
    counterEl.appendChild(el('b', null, item ? (item.type === 'puzzle' ? 'No. ' + item.num : (item.title || 'Lesson')) : ''));
    var isPuzzle = !!(item && item.type === 'puzzle' && state.chess);
    revealBtn.style.visibility = isPuzzle ? 'visible' : 'hidden';
    revealBtn.className = 'reveal' + (state.revealed ? ' done' : '');
    revealBtn.textContent = state.revealed ? 'Revealed' : (state.solved ? 'Replay line' : 'Reveal →');
    revealBtn.disabled = !isPuzzle || state.revealed;
  }
  prevBtn.addEventListener('click', function(){ step(-1); });
  nextBtn.addEventListener('click', function(){ step(1); });
  revealBtn.addEventListener('click', onReveal);

  document.addEventListener('keydown', function(e){
    if (modalBackdrop.classList.contains('open')){ if (e.key === 'Escape') closeModal(); return; }
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  // ============================================================
  // Upload / library
  // ============================================================
  fileInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';
    files.forEach(function(file){
      var reader = new FileReader();
      reader.onload = function(){ handleUploadedPgn(file.name, String(reader.result || '')); };
      reader.onerror = function(){ showToast('Could not read ' + file.name); };
      reader.readAsText(file);
    });
  });

  function handleUploadedPgn(filename, text){
    var items;
    try{ items = parsePgnText(text, 'lib'); }
    catch(e){ showToast('Could not parse ' + filename + '.'); return; }
    var puzCount = countPuzzles(items);
    if (!puzCount){ showToast('No puzzle positions found in ' + filename + ' (it needs [FEN] setup tags).'); return; }
    var id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    if (!safeSet(LIB_ITEM_PREFIX + id, JSON.stringify(items))){ showToast('Storage is full — remove an old file first.'); return; }
    library.push({ id:id, filename:filename, count:puzCount, addedAt:Date.now() });
    if (!saveLibraryIndex(library)){
      library.pop(); safeRemove(LIB_ITEM_PREFIX + id);
      showToast('Storage is full — remove an old file first.'); return;
    }
    showToast('Added ' + filename + ' (' + puzCount + ' puzzles)');
    switchCollection(id);
  }

  function removeLibraryFile(id){
    library = library.filter(function(l){ return l.id !== id; });
    saveLibraryIndex(library);
    safeRemove(LIB_ITEM_PREFIX + id);
    delete colCache[id];
    pruneOrphans();
    if (state.collectionKey === id) switchCollection('endings');
    else renderCollectionStrip();
    if (modalBackdrop.classList.contains('open')) renderStatsModal();
  }

  // ============================================================
  // Stats & library sheet
  // ============================================================
  function computeStats(){
    var hist = progress.history || [];
    var solves = hist.filter(function(h){ return h.score > 0; });
    var timed = solves.filter(function(h){ return typeof h.ms === 'number'; });
    var avgMs = timed.length ? timed.reduce(function(a, h){ return a + h.ms; }, 0) / timed.length : null;
    return {
      rating: progress.rating,
      solvedCount: Object.keys(progress.solved).length,
      attempts: hist.length,
      accuracy: hist.length ? Math.round(100 * solves.length / hist.length) : 0,
      avg: avgMs === null ? '—' : formatTime(avgMs),
      hist: hist
    };
  }

  function sparklineSVG(hist){
    var pts = hist.slice(-30).map(function(h){ return h.rating; });
    if (pts.length < 2) return null;
    var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    if (min === max){ min -= 10; max += 10; }
    var w = 300, h = 48, p = 4, step = (w - p * 2) / (pts.length - 1);
    var coords = pts.map(function(v, i){ return (p + i * step).toFixed(1) + ',' + (h - p - ((v - min) / (max - min)) * (h - p * 2)).toFixed(1); });
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'sparkline'); svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Rating over your last ' + pts.length + ' puzzles');
    var line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', coords.join(' ')); line.setAttribute('fill', 'none'); line.setAttribute('stroke', 'var(--accent)');
    line.setAttribute('stroke-width', '2'); line.setAttribute('vector-effect', 'non-scaling-stroke');
    line.setAttribute('stroke-linejoin', 'round'); line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
    var last = coords[coords.length - 1].split(',');
    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', last[0]); dot.setAttribute('cy', last[1]); dot.setAttribute('r', '3'); dot.setAttribute('fill', 'var(--accent)');
    svg.appendChild(dot);
    return svg;
  }

  function renderStatsModal(){
    var s = computeStats();
    modalEl.innerHTML = '';
    var head = el('div', 'modal-head');
    var ht = el('div');
    ht.appendChild(el('div', 'kicker', 'Vigaasan’s Chess Board'));
    ht.appendChild(el('h2', null, 'Stats & library'));
    var close = el('button', 'modal-close', '✕');
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', closeModal);
    head.appendChild(ht); head.appendChild(close);
    modalEl.appendChild(head);

    var sec = el('div', 'section');
    var grid = el('div', 'stat-grid');
    [['Rating', s.rating, true], ['Puzzles solved', s.solvedCount], ['Accuracy', s.accuracy + '%'], ['Avg. solve time', s.avg]]
      .forEach(function(r){
        var box = el('div', 'stat');
        box.appendChild(el('div', 'v' + (r[2] ? ' accent' : ''), r[1]));
        box.appendChild(el('div', 'l kicker', r[0]));
        grid.appendChild(box);
      });
    sec.appendChild(grid);
    var spark = sparklineSVG(s.hist);
    if (spark){ sec.appendChild(el('div', 'kicker', 'Rating trend · last ' + Math.min(30, s.hist.length))); sec.appendChild(spark); }
    var reset = el('button', 'btn danger', 'Reset stats & progress');
    reset.style.width = '100%';
    reset.addEventListener('click', function(){
      if (!confirm('This clears your rating, solved history and puzzle progress on this device. Continue?')) return;
      progress = freshProgress(progress);
      saveProgress(); updateRatingBadge();
      renderStatsModal(); loadCurrentItem();
      showToast('Progress reset.');
    });
    sec.appendChild(reset);
    modalEl.appendChild(sec);

    var lib = el('div', 'section');
    lib.appendChild(el('h3', 'kicker', 'Your PGN files'));
    if (!library.length){
      lib.appendChild(el('div', 'empty-note', 'No files yet. Add a .pgn file with [FEN] puzzle positions to practise it here.'));
    } else {
      library.forEach(function(l){
        var row = el('div', 'lib-item'), meta = el('div', 'meta');
        meta.appendChild(el('div', 'fname', l.filename));
        meta.appendChild(el('div', 'fsub kicker', l.count + ' puzzles · added ' + new Date(l.addedAt).toLocaleDateString()));
        row.appendChild(meta);
        row.appendChild(trashButton('Delete ' + l.filename, function(){ confirmDelete(l.id); }));
        lib.appendChild(row);
      });
    }
    var add = el('button', 'btn primary', 'Upload PGN file(s)');
    add.style.width = '100%'; add.style.marginTop = '12px';
    add.addEventListener('click', function(){ closeModal(); fileInput.click(); });
    lib.appendChild(add);
    if (!storageOK) lib.appendChild(el('div', 'warn', 'Local storage isn’t available here (private browsing?) — progress and uploads won’t be saved.'));
    modalEl.appendChild(lib);

    var bk = el('div', 'section');
    bk.appendChild(el('h3', 'kicker', 'Backup & restore'));
    bk.appendChild(el('p', 'hint-text', 'Move your rating, progress and PGN files to another device or app: export here, then restore there.'));
    var brow = el('div', 'actions');
    var exp = el('button', 'btn', 'Export backup');
    exp.addEventListener('click', exportBackup);
    var imp = el('button', 'btn', 'Restore backup');
    imp.addEventListener('click', function(){ showRestoreBox(bk); });
    brow.appendChild(exp); brow.appendChild(imp);
    bk.appendChild(brow);
    modalEl.appendChild(bk);
  }

  // ---- backup / restore ----
  function buildBackup(){
    var files = library.map(function(l){ return { meta:l, items: loadLibraryItems(l.id) || [] }; });
    return JSON.stringify({ app:'vigaasans-chess-board', version:1, exportedAt:new Date().toISOString(), progress:progress, files:files });
  }
  function copyText(text){
    var done = false;
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ done = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if (!done && navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); done = true; }
    return done;
  }
  var IN_APP = /VigaasanApp/.test(navigator.userAgent);
  function exportBackup(){
    var text = buildBackup();
    var stamp = new Date().toISOString().slice(0, 10);
    if (IN_APP && window.VigaasanBridge && window.VigaasanBridge.saveBackup){
      // Native app: saved straight to the phone's Downloads folder.
      try{ window.VigaasanBridge.saveBackup('vigaasan-backup-' + stamp + '.json', text); return; }catch(e){}
    }
    try{
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type:'application/json' }));
      a.download = 'vigaasan-backup-' + stamp + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }catch(e){}
    copyText(text);
    showToast('Backup downloaded (and copied to the clipboard).');
  }
  function showRestoreBox(container){
    if (container.querySelector('.restore')) return;
    var box = el('div', 'restore');
    var ta = document.createElement('textarea');
    ta.className = 'restore-text';
    ta.placeholder = 'Choose your backup file, or paste the backup text here\u2026';
    var row = el('div', 'actions');
    var pick = el('button', 'btn quiet', 'Choose file');
    var go = el('button', 'btn primary', 'Restore');
    var fi = document.createElement('input');
    fi.type = 'file'; fi.accept = '.json,application/json,text/plain';
    fi.addEventListener('change', function(){
      var f = fi.files && fi.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function(){ ta.value = String(r.result || ''); showToast('Backup loaded \u2014 tap Restore.'); };
      r.readAsText(f);
    });
    pick.addEventListener('click', function(){ fi.click(); });
    go.addEventListener('click', function(){ restoreBackup(ta.value); });
    row.appendChild(pick); row.appendChild(go);
    box.appendChild(ta); box.appendChild(row); box.appendChild(fi);
    container.appendChild(box);
  }
  function restoreBackup(text){
    var data;
    try{ data = JSON.parse(String(text || '').trim()); }catch(e){ showToast('That doesn\u2019t look like a backup.'); return; }
    if (!data || data.app !== 'vigaasans-chess-board' || !data.progress){ showToast('That doesn\u2019t look like a backup.'); return; }
    if (!confirm('Replace the progress on this device with the backup from ' + String(data.exportedAt || 'earlier').slice(0, 10) + '?')) return;
    library.forEach(function(l){ safeRemove(LIB_ITEM_PREFIX + l.id); });
    library = [];
    (data.files || []).forEach(function(f){
      if (!f || !f.meta || !f.meta.id || !Array.isArray(f.items)) return;
      if (safeSet(LIB_ITEM_PREFIX + f.meta.id, JSON.stringify(f.items))) library.push(f.meta);
    });
    saveLibraryIndex(library);
    colCache = {};
    var keepTheme = progress.theme;
    progress = data.progress;
    ['solved','viewed','opened','rated','last'].forEach(function(k){ progress[k] = progress[k] || {}; });
    progress.history = Array.isArray(progress.history) ? progress.history : [];
    if (typeof progress.rating !== 'number') progress.rating = 1200;
    if (!progress.theme) progress.theme = keepTheme;
    saveProgress();
    pruneOrphans();
    applyTheme(); updateRatingBadge();
    closeModal();
    renderCollectionStrip();
    switchCollection('endings');
    showToast('Backup restored \u2713');
  }

  function openModal(){ renderStatsModal(); modalBackdrop.classList.add('open'); var c = modalEl.querySelector('.modal-close'); if (c) c.focus(); }
  function closeModal(){ modalBackdrop.classList.remove('open'); }
  $('statsBtn').addEventListener('click', openModal);
  modalBackdrop.addEventListener('click', function(e){ if (e.target === modalBackdrop) closeModal(); });

  // ============================================================
  // Boot
  // ============================================================
  function boot(){
    updateRatingBadge();
    if (typeof Chess === 'undefined'){
      mainEl.innerHTML = '';
      mainEl.appendChild(el('div', 'err', 'The chess engine couldn’t load (no internet connection on first launch). Reconnect and reload.'));
      return;
    }
    placeNav();
    var lastKey = progress.lastCollection && collectionFor(progress.lastCollection) ? progress.lastCollection : 'endings';
    switchCollection(lastKey);
  }
  boot();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
  }
})();
</script>
<script>
// ==================================================================
// Vasthu Days tab — upcoming Vasthu Naal with the traditional time
// window, and a Chandrashtamam check against the house owner's
// Chandra Rasi and Surya Rasi. Everything is computed on the device.
// ==================================================================
(function(){
  "use strict";
  var LIB = 'https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js';
  var STORE = 'vigaasan_vasthu_v1';
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(cfg)); }catch(e){} }
  var cfg = load();   // { name, chandra, surya, mode, showMore }

  // ---------- Vasthu calculation core (needs astronomy-engine as A) ----------
  function makeVasthuCore(A){
    var IST = 5.5 * 3600 * 1000;
    var CHENNAI = new A.Observer(13.0827, 80.2707, 6);

    // The eight Vasthu days: Tamil month (index from Chithirai = 0),
    // day of that month, and the traditional window (IST).
    var VASTHU = [
      { m:0,  d:10, from:'08:54', to:'09:30' },  // Chithirai 10
      { m:1,  d:21, from:'09:58', to:'10:34' },  // Vaikasi 21
      { m:3,  d:11, from:'07:44', to:'08:20' },  // Aadi 11
      { m:4,  d:6,  from:'07:23', to:'07:59' },  // Avani 6
      { m:6,  d:11, from:'07:44', to:'08:20' },  // Aippasi 11
      { m:7,  d:8,  from:'11:29', to:'12:05' },  // Karthigai 8
      { m:9,  d:12, from:'10:41', to:'11:17' },  // Thai 12
      { m:10, d:22, from:'10:32', to:'11:08' }   // Masi 22
    ];

    // Lahiri (Chitrapaksha) ayanamsa, degrees.
    function ayanamsa(date){
      var T = (A.MakeTime(date).tt) / 36525;            // centuries from J2000 (TT)
      return 23.85282 + 1.396971 * T + 0.000308 * T * T;
    }
    function norm(x){ x %= 360; return x < 0 ? x + 360 : x; }
    function sunSid(date){ return norm(A.SunPosition(date).elon - ayanamsa(date)); }
    function moonSid(date){ return norm(A.EclipticGeoMoon(date).lon - ayanamsa(date)); }

    // Tamil calendars (and the published Vasthu lists) start their months
    // from the traditional Surya Siddhanta / Vakya Sun, which runs a few
    // hours off the modern one. Standard Surya Siddhanta constants:
    // sidereal year 365.258756484 days, Kali-yuga epoch at Ujjain midnight,
    // solar apogee 77°17', manda epicycle 13°50'. Checked against all 16
    // published Vasthu dates for 2026-2027.
    function ssSun(date){
      var jd = date.getTime() / 86400000 + 2440587.5;
      var days = jd - (588465.5 - 75.77 / 360);
      var mean = norm(360 * (days / 365.258756484));
      var M = (mean - 77.2833) * Math.PI / 180;
      var eq = Math.asin(13.8333 / 360 * Math.sin(M)) * 180 / Math.PI;
      return norm(mean - eq);
    }
    // Moment the (Surya Siddhanta) Sun reaches `target` degrees, from `after`.
    function sankranti(target, after){
      var t = new Date(after.getTime());
      for (var i = 0; i < 30; i++){                      // Newton steps (~1°/day)
        var diff = norm(target - ssSun(t) + 180) - 180;
        t = new Date(t.getTime() + diff / 0.9856 * 86400000);
        if (Math.abs(diff) < 1e-6) break;
      }
      return t;
    }
    function istParts(date){
      var d = new Date(date.getTime() + IST);
      return { y:d.getUTCFullYear(), mo:d.getUTCMonth(), d:d.getUTCDate() };
    }
    function istMidnight(p){ return new Date(Date.UTC(p.y, p.mo, p.d) - IST); }

    // Tamil rule: the month begins on the day of the Sankranti if it falls
    // before sunset (Chennai); otherwise on the next day.
    function monthStart(monthIndex, approxDate){
      var s = sankranti(monthIndex * 30, approxDate);
      monthStart.lastSankranti = s;
      var p = istParts(s), mid = istMidnight(p);
      var set = A.SearchRiseSet(A.Body.Sun, CHENNAI, -1, mid, 1);
      var start = (set && s.getTime() < set.date.getTime()) ? mid : new Date(mid.getTime() + 86400000);
      return start;   // IST midnight of day 1
    }

    var RASI = [
      ['Mesham','மேஷம்','Aries'], ['Rishabam','ரிஷபம்','Taurus'], ['Mithunam','மிதுனம்','Gemini'],
      ['Kadagam','கடகம்','Cancer'], ['Simmam','சிம்மம்','Leo'], ['Kanni','கன்னி','Virgo'],
      ['Thulam','துலாம்','Libra'], ['Viruchigam','விருச்சிகம்','Scorpio'], ['Dhanusu','தனுசு','Sagittarius'],
      ['Magaram','மகரம்','Capricorn'], ['Kumbam','கும்பம்','Aquarius'], ['Meenam','மீனம்','Pisces']
    ];
    var MONTHS = [
      ['Chithirai','சித்திரை'], ['Vaikasi','வைகாசி'], ['Aani','ஆனி'], ['Aadi','ஆடி'], ['Avani','ஆவணி'], ['Purattasi','புரட்டாசி'],
      ['Aippasi','ஐப்பசி'], ['Karthigai','கார்த்திகை'], ['Margazhi','மார்கழி'], ['Thai','தை'], ['Masi','மாசி'], ['Panguni','பங்குனி']
    ];
    var NAKSHATRA = ['Ashwini','Bharani','Krittikai','Rohini','Mirugasirisham','Thiruvathirai','Punarpoosam','Poosam','Ayilyam',
      'Magam','Pooram','Uthiram','Hastham','Chithirai','Swathi','Visakam','Anusham','Kettai','Moolam','Pooradam','Uthiradam',
      'Thiruvonam','Avittam','Sadhayam','Poorattathi','Uthirattathi','Revathi'];

    function atIST(dayStart, hhmm){
      var p = hhmm.split(':');
      return new Date(dayStart.getTime() + (parseInt(p[0], 10) * 60 + parseInt(p[1], 10)) * 60000);
    }
    function moonInfo(date){
      var lon = moonSid(date);
      return { lon: lon, rasi: Math.floor(lon / 30), nak: Math.floor(lon / (360 / 27)) };
    }

    // All Vasthu days whose window ends after `from`, for `count` entries.
    function upcoming(from, count){
      var out = [];
      var y = istParts(from).y - 1;
      while (out.length < count && y < istParts(from).y + 4){
        VASTHU.forEach(function(v){
          // the Sun enters month m around 14 April + 30.4*m days (Chithirai = mid-April)
          var approx = new Date(Date.UTC(y, 3, 14) + v.m * 30.44 * 86400000);
          var day1 = monthStart(v.m, approx);
          var day = new Date(day1.getTime() + (v.d - 1) * 86400000);
          var start = atIST(day, v.from), end = atIST(day, v.to);
          if (end.getTime() <= from.getTime()) return;
          var mid = new Date((start.getTime() + end.getTime()) / 2);
          var span = moonSignSpan(mid);
          var ms = moonInfo(start), me = moonInfo(end), mm = moonInfo(mid);
          out.push({ month: v.m, day: v.d, date: day, start: start, end: end, from: v.from, to: v.to,
                     moonStart: ms, moonEnd: me, moon: mm, moonSpan: span,
                     sunRasi: Math.floor(sunSid(mid) / 30) });
        });
        y++;
      }
      out.sort(function(a, b){ return a.start - b.start; });
      return out.slice(0, count);
    }

    // Chandrashtamam: the Moon transits the 8th sign counted from the rasi.
    function eighthFrom(rasi){ return (rasi + 7) % 12; }
    function chandrashtamamFor(entry, rasi){
      var r8 = eighthFrom(rasi);
      return entry.moonStart.rasi === r8 || entry.moonEnd.rasi === r8;
    }
    // Whose Chandrashtamam is it at this moment (the rasi 8 signs behind the Moon)?
    function chandrashtamamRasiOf(moonRasi){ return (moonRasi + 5) % 12; }

    // When the Moon enters / leaves a sign, near a date (for the detail line).
    function moonSignSpan(date){
      var r = Math.floor(moonSid(date) / 30);
      function edge(dir){
        var t = date.getTime(), step = dir * 3600000;
        while (Math.floor(moonSid(new Date(t + step)) / 30) === r) t += step;
        var lo = t, hi = t + step;
        for (var i = 0; i < 20; i++){
          var m = (lo + hi) / 2;
          if (Math.floor(moonSid(new Date(m)) / 30) === r) lo = m; else hi = m;
        }
        return new Date(dir > 0 ? hi : lo);
      }
      return { rasi: r, from: edge(-1), to: edge(1) };
    }

    return { sankranti: sankranti, upcoming: upcoming, chandrashtamamFor: chandrashtamamFor, chandrashtamamRasiOf: chandrashtamamRasiOf,
             eighthFrom: eighthFrom, moonSignSpan: moonSignSpan, monthStart: monthStart,
             RASI: RASI, MONTHS: MONTHS, NAKSHATRA: NAKSHATRA, IST: IST };
  }


  var view = $('vasthuView'), body = $('vasthuBody');
  var core = null, loading = false;
  var modeBtns = document.querySelectorAll('.mode');
  var label = $('collectionLabel'), chessLabel = null;

  function setMode(mode){
    cfg.mode = mode; save();
    document.body.classList.toggle('mode-vasthu', mode === 'vasthu');
    Array.prototype.forEach.call(modeBtns, function(b){
      var on = b.getAttribute('data-mode') === mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (mode === 'vasthu'){
      if (chessLabel === null) chessLabel = label.textContent;
      label.textContent = 'Vasthu Days';
      ensureCore(render);
      window.scrollTo(0, 0);
    } else {
      if (chessLabel !== null){ label.textContent = chessLabel; chessLabel = null; }
      window.dispatchEvent(new Event('resize'));   // let the board re-measure
    }
  }
  Array.prototype.forEach.call(modeBtns, function(b){
    b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); });
  });

  function ensureCore(cb){
    if (core) return cb();
    if (window.Astronomy){ core = makeVasthuCore(window.Astronomy); return cb(); }
    body.innerHTML = '';
    body.appendChild(el('div', 'loading', 'Working out the Vasthu days…'));
    if (loading) return;
    loading = true;
    var s = document.createElement('script');
    s.src = LIB; s.async = true;
    s.onload = function(){ loading = false; core = makeVasthuCore(window.Astronomy); cb(); };
    s.onerror = function(){
      loading = false;
      body.innerHTML = '';
      body.appendChild(el('div', 'err', 'The astronomy data couldn’t load. Connect to the internet once and open this tab again — after that it works offline.'));
    };
    document.head.appendChild(s);
  }

  // ---------- formatting (always Indian Standard Time) ----------
  var TZ = 'Asia/Kolkata';
  function fmtDate(d, opts){ return d.toLocaleDateString('en-IN', Object.assign({ timeZone: TZ }, opts)); }
  function fmtTime(d){ return d.toLocaleTimeString('en-IN', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }).replace(/\s?(am|pm)/i, function(m){ return ' ' + m.trim().toUpperCase(); }); }
  function fmtWhen(d){ return fmtDate(d, { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + fmtTime(d); }
  function hm(s){ var p = s.split(':'), h = +p[0], m = p[1]; return (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM'); }
  function dayDiff(d){
    var today = new Date(Date.now() + core.IST); today = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());
    var that = new Date(d.getTime() + core.IST); that = Date.UTC(that.getUTCFullYear(), that.getUTCMonth(), that.getUTCDate());
    return Math.round((that - today) / 86400000);
  }
  function countdown(e){
    var now = Date.now();
    if (now >= e.start.getTime() && now < e.end.getTime()) return 'Happening now';
    var n = dayDiff(e.date);
    return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days';
  }
  function rasiName(i){ var r = core.RASI[i]; return r[0] + ' (' + r[1] + ')'; }

  // ---------- verdict ----------
  function verdict(e){
    var hasC = cfg.chandra !== undefined && cfg.chandra !== '', hasS = cfg.surya !== undefined && cfg.surya !== '';
    if (!hasC && !hasS) return { cls: 'na', text: 'Enter rasi to check' };
    var c = hasC && core.chandrashtamamFor(e, +cfg.chandra);
    var s = hasS && core.chandrashtamamFor(e, +cfg.surya);
    if (c) return { cls: 'bad', text: 'Avoid — Chandrashtamam', c: c, s: s };
    if (s) return { cls: 'warn', text: 'Caution — 8th from Surya Rasi', c: c, s: s };
    return { cls: 'ok', text: 'Safe for ' + (cfg.name ? cfg.name : 'the owner'), c: c, s: s };
  }

  function checkLine(kind, idx, e){
    var row = el('div', 'vx-check');
    if (idx === undefined || idx === ''){ row.appendChild(el('span', 'vx-mark na', '–')); row.appendChild(el('span', null, kind + ' not entered')); return row; }
    idx = +idx;
    var eighth = core.eighthFrom(idx), hit = core.chandrashtamamFor(e, idx);
    row.appendChild(el('span', 'vx-mark ' + (hit ? 'bad' : 'ok'), hit ? '✗' : '✓'));
    var t = el('span');
    t.appendChild(el('b', null, kind + ' ' + core.RASI[idx][0]));
    t.appendChild(document.createTextNode(' — its 8th rasi is ' + core.RASI[eighth][0] + '. '));
    t.appendChild(document.createTextNode(hit ? 'The Moon is there during the muhurtham: Chandrashtamam.' : 'The Moon is not there: no Chandrashtamam.'));
    row.appendChild(t);
    return row;
  }

  function moonLines(e, wrap){
    var m = e.moon, span = e.moonSpan;
    var a = el('p', 'vx-detail');
    a.appendChild(el('b', null, 'Moon during the muhurtham: '));
    a.appendChild(document.createTextNode(rasiName(m.rasi) + ' · ' + core.NAKSHATRA[m.nak] + ' nakshatra'));
    if (e.moonStart.rasi !== e.moonEnd.rasi) a.appendChild(document.createTextNode(' (moves into ' + core.RASI[e.moonEnd.rasi][0] + ' during the window)'));
    wrap.appendChild(a);
    var b = el('p', 'vx-detail');
    b.appendChild(el('b', null, 'Moon in ' + core.RASI[span.rasi][0] + ': '));
    b.appendChild(document.createTextNode(fmtWhen(span.from) + ' → ' + fmtWhen(span.to)));
    wrap.appendChild(b);
    var c = el('p', 'vx-detail');
    c.appendChild(el('b', null, 'Chandrashtamam at this time for: '));
    c.appendChild(document.createTextNode(rasiName(core.chandrashtamamRasiOf(m.rasi)) + ' rasi'));
    wrap.appendChild(c);
    var near = Math.min(Math.abs(span.from - e.start), Math.abs(span.to - e.end)) < 6 * 3600000;
    if (near) wrap.appendChild(el('p', 'vx-note', 'The Moon changes rasi within a few hours of this muhurtham. Panchangams can differ by a few hours here — confirm with your family panchangam.'));
  }

  // ---------- rendering ----------
  function ownerCard(){
    var card = el('section', 'vx-owner');
    card.appendChild(el('div', 'kicker', 'House owner'));
    var grid = el('div', 'vx-fields');
    function field(lbl, input){
      var f = el('label', 'vx-field'), k = el('span', 'kicker');
      var parts = lbl.split(' · ');
      k.appendChild(document.createTextNode(parts[0]));
      if (parts[1]){ k.appendChild(document.createTextNode(' · ')); k.appendChild(el('span', 'ta', parts[1])); }
      f.appendChild(k); f.appendChild(input); return f;
    }
    var name = el('input'); name.type = 'text'; name.placeholder = 'Name (optional)'; name.value = cfg.name || '';
    name.addEventListener('change', function(){ cfg.name = name.value.trim(); save(); render(); });
    function rasiSelect(key){
      var s = el('select');
      var o = el('option', null, 'Choose rasi…'); o.value = ''; s.appendChild(o);
      core.RASI.forEach(function(r, i){ var op = el('option', null, r[0] + ' · ' + r[1] + ' · ' + r[2]); op.value = String(i); s.appendChild(op); });
      s.value = (cfg[key] === undefined) ? '' : String(cfg[key]);
      s.addEventListener('change', function(){ cfg[key] = s.value; save(); render(); });
      return s;
    }
    grid.appendChild(field('Name', name));
    grid.appendChild(field('Chandra Rasi · சந்திர ராசி', rasiSelect('chandra')));
    grid.appendChild(field('Surya Rasi · சூரிய ராசி', rasiSelect('surya')));
    card.appendChild(grid);
    card.appendChild(el('p', 'vx-hint', 'Chandrashtamam is when the Moon passes through the 8th rasi counted from your rasi (about 2¼ days each month). Traditionally it is counted from the Chandra Rasi; the Surya Rasi check is shown as an extra caution.'));
    return card;
  }

  function entryCard(e, hero){
    var v = verdict(e);
    var card = el('article', 'vx-day' + (hero ? ' hero' : ''));
    var top = el('div', 'vx-top');
    var when = el('div', 'vx-when');
    when.appendChild(el('div', 'kicker', (hero ? 'Next Vasthu day · ' : '') + countdown(e)));
    when.appendChild(el('h3', 'vx-date', fmtDate(e.date, { weekday: hero ? 'long' : 'short', day: 'numeric', month: hero ? 'long' : 'short', year: 'numeric' })));
    var tm = core.MONTHS[e.month];
    when.appendChild(el('div', 'vx-tamil', tm[1] + ' ' + e.day + ' · ' + tm[0] + ' ' + e.day));
    top.appendChild(when);
    top.appendChild(el('span', 'verdict ' + v.cls, v.text));
    card.appendChild(top);
    var time = el('div', 'vx-time');
    time.appendChild(el('span', 'kicker', 'Muhurtham'));
    time.appendChild(el('span', 'vx-window', hm(e.from) + ' – ' + hm(e.to)));
    time.appendChild(el('span', 'kicker', 'IST'));
    card.appendChild(time);
    var more = el('div', 'vx-more');
    more.appendChild(checkLine('Chandra Rasi', cfg.chandra, e));
    more.appendChild(checkLine('Surya Rasi', cfg.surya, e));
    moonLines(e, more);
    if (hero) card.appendChild(more);
    else {
      var det = el('details', 'vx-details');
      det.appendChild(el('summary', null, 'Moon & Chandrashtamam details'));
      det.appendChild(more);
      card.appendChild(det);
    }
    return card;
  }

  function render(){
    if (!core) return;
    var list = core.upcoming(new Date(), cfg.showMore ? 16 : 8);
    body.innerHTML = '';
    var head = el('div', 'vx-head');
    var hk = el('div', 'kicker', 'Vasthu Naal · ');
    hk.appendChild(el('span', 'ta', 'வாஸ்து நாள்'));
    head.appendChild(hk);
    head.appendChild(el('h2', null, 'Upcoming Vasthu Days'));
    head.appendChild(el('p', 'vx-sub', 'The eight days a year when Vasthu Purusha wakes — good for bhoomi pooja, foundation and griha pravesam during the muhurtham shown.'));
    body.appendChild(head);
    body.appendChild(ownerCard());
    if (!list.length){ body.appendChild(el('div', 'err', 'No dates found.')); return; }
    body.appendChild(entryCard(list[0], true));
    var rest = el('div', 'vx-list');
    rest.appendChild(el('div', 'kicker vx-list-head', 'After that'));
    list.slice(1).forEach(function(e){ rest.appendChild(entryCard(e, false)); });
    body.appendChild(rest);
    var toggle = el('button', 'btn quiet', cfg.showMore ? 'Show fewer' : 'Show the next two years');
    toggle.addEventListener('click', function(){ cfg.showMore = !cfg.showMore; save(); render(); });
    body.appendChild(toggle);
    var how = el('details', 'vx-how');
    how.appendChild(el('summary', null, 'How these are worked out'));
    [
      'Vasthu days fall on fixed Tamil-calendar dates: Chithirai 10, Vaikasi 21, Aadi 11, Avani 6, Aippasi 11, Karthigai 8, Thai 12 and Masi 22, each with its traditional muhurtham (IST).',
      'Tamil month starts are calculated the way Tamil (Vakya) calendars do, from the Surya Siddhanta Sun and the before-sunset rule. They reproduce every published Vasthu date for 2026 and 2027.',
      'The Moon’s rasi and nakshatra use a modern astronomical model with the Lahiri ayanamsa, checked against published panchangams.',
      'Chandrashtamam = the Moon in the 8th rasi from the owner’s rasi at the muhurtham. Near a rasi change, confirm with your family panchangam or astrologer.'
    ].forEach(function(t){ how.appendChild(el('p', null, t)); });
    body.appendChild(how);
  }

  // refresh the countdown once a minute while the tab is open
  var lastKey = '';
  setInterval(function(){
    if (!core || !document.body.classList.contains('mode-vasthu')) return;
    var key = core.upcoming(new Date(), 2).map(countdown).join('|');
    if (key !== lastKey && !body.contains(document.activeElement)){ lastKey = key; render(); }
  }, 60000);

  setMode(cfg.mode === 'vasthu' ? 'vasthu' : 'chess');
})();
</script>
</body>
</html>
