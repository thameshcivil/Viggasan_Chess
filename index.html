<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigaasan’s Chess Board</title>
<meta name="description" content="Vigaasan’s Chess Board — solve endgame and strategy puzzles from your own study collection.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1d0b12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f2e6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vigaasan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     Vigaasan's Chess Board — "Folio" design.
     Plum-and-brass at night, cream-and-crimson by day. The board is set
     the way chess books print their diagrams: double-ruled frame,
     hatched dark squares, coordinates in the margin, a plate number.
     ------------------------------------------------------------------ */
  :root{
    --bg:#1d0b12; --bg-2:#2a1019; --panel:#2a1019; --panel-2:#35151f; --rule:#4f2a35; --rule-soft:#3a1c26;
    --ink:#f3e6d3; --ink-dim:#cdb59c; --ink-faint:#977c6e; --accent:#d4a25a; --accent-ink:#1d0b12;
    --good:#93b57d; --good-ink:#13200e; --bad:#e2674f; --bad-ink:#1d0b12; --amber:#d99a3c; --amber-ink:#1d0b12;
    --board-light:#efe2c8; --board-dark:#b98b63; --hatch:rgba(84,45,24,.38); --frame:#f3e6d3;
    --mark:rgba(212,162,90,.55); --dot:rgba(29,11,18,.42);
    --shadow:0 18px 40px rgba(0,0,0,.45);
    --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
    --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f8f2e6; --bg-2:#f1e8d6; --panel:#fffaf0; --panel-2:#f3ead8; --rule:#d9c8aa; --rule-soft:#e8dcc5;
      --ink:#1e1412; --ink-dim:#56443a; --ink-faint:#8a7464; --accent:#8c1d2c; --accent-ink:#fff8ee;
      --good:#3f6e35; --good-ink:#fff8ee; --bad:#b23a26; --bad-ink:#fff8ee; --amber:#a8681b; --amber-ink:#fff8ee;
      --board-light:#f6ecd8; --board-dark:#c9a27c; --hatch:rgba(110,70,40,.32); --frame:#1e1412;
      --mark:rgba(140,29,44,.32); --dot:rgba(30,20,18,.32);
      --shadow:0 16px 34px rgba(80,50,25,.16);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#f8f2e6; --bg-2:#f1e8d6; --panel:#fffaf0; --panel-2:#f3ead8; --rule:#d9c8aa; --rule-soft:#e8dcc5;
    --ink:#1e1412; --ink-dim:#56443a; --ink-faint:#8a7464; --accent:#8c1d2c; --accent-ink:#fff8ee;
    --good:#3f6e35; --good-ink:#fff8ee; --bad:#b23a26; --bad-ink:#fff8ee; --amber:#a8681b; --amber-ink:#fff8ee;
    --board-light:#f6ecd8; --board-dark:#c9a27c; --hatch:rgba(110,70,40,.32); --frame:#1e1412;
    --mark:rgba(140,29,44,.32); --dot:rgba(30,20,18,.32);
    --shadow:0 16px 34px rgba(80,50,25,.16);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#1d0b12; --bg-2:#2a1019; --panel:#2a1019; --panel-2:#35151f; --rule:#4f2a35; --rule-soft:#3a1c26;
    --ink:#f3e6d3; --ink-dim:#cdb59c; --ink-faint:#977c6e; --accent:#d4a25a; --accent-ink:#1d0b12;
    --good:#93b57d; --good-ink:#13200e; --bad:#e2674f; --bad-ink:#1d0b12; --amber:#d99a3c; --amber-ink:#1d0b12;
    --board-light:#efe2c8; --board-dark:#b98b63; --hatch:rgba(84,45,24,.38); --frame:#f3e6d3;
    --mark:rgba(212,162,90,.55); --dot:rgba(29,11,18,.42);
    --shadow:0 18px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  html{ background:var(--bg); }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif);
    font-optical-sizing:auto; display:flex; justify-content:center; min-height:100vh; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .app{
    width:100%; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px);
  }

  /* ---------- masthead ---------- */
  header.top{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px 12px; background:var(--bg); border-bottom:1px solid var(--rule); flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand .seal{
    width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; border:1px solid var(--accent);
    outline:1px solid var(--accent); outline-offset:2px; color:var(--accent); font-size:19px; line-height:1;
  }
  .brand h1{ margin:0; font-size:19px; line-height:1.05; font-weight:500; letter-spacing:-.005em; white-space:nowrap; }
  .brand h1 em{ font-style:italic; font-weight:400; color:var(--accent); }
  .brand small{
    display:block; margin-top:3px; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw;
  }
  .tools{ display:flex; gap:6px; align-items:center; flex:0 0 auto; }
  .tool{
    height:34px; min-width:34px; padding:0 9px; border:1px solid var(--rule); background:transparent; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:15px; color:var(--ink);
  }
  .tool:active{ transform:translateY(1px); }
  .tool.rating{ font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; border-color:var(--accent); color:var(--accent); }
  .tool.rating b{ font-weight:700; }

  /* ---------- collection tabs / chapters / plate index ---------- */
  .strip{
    display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; padding:10px 16px; scrollbar-width:none; flex-shrink:0; align-items:center;
  }
  .strip::-webkit-scrollbar{ display:none; }
  .tabs{ gap:18px; padding-top:12px; padding-bottom:0; border-bottom:1px solid var(--rule-soft); }
  .tab{
    flex:0 0 auto; border:none; background:none; cursor:pointer; padding:6px 0 10px; position:relative;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); white-space:nowrap;
  }
  .tab .n{ color:var(--ink-faint); opacity:.75; margin-left:6px; letter-spacing:.04em; }
  .tab.active{ color:var(--ink); }
  .tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--accent); }
  .tab.add{ color:var(--accent); }

  .chapters{ padding-top:12px; padding-bottom:4px; }
  .chap{
    flex:0 0 auto; border:1px solid var(--rule); background:transparent; cursor:pointer; padding:6px 11px;
    font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink-dim); white-space:nowrap;
  }
  .chap.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); font-style:normal; }

  .plates{ gap:4px; padding-top:10px; padding-bottom:10px; }
  .plate{
    flex:0 0 auto; width:32px; height:32px; display:grid; place-items:center; cursor:pointer;
    font-family:var(--mono); font-size:11px; font-weight:500; border:1px solid var(--rule); background:transparent; color:var(--ink-faint);
  }
  .plate.opened{ background:transparent; color:var(--amber); border-color:var(--amber); }
  .plate.wrong{ background:var(--bad); color:var(--bad-ink); border-color:var(--bad); }
  .plate.solved{ background:var(--good); color:var(--good-ink); border-color:var(--good); }
  .plate.current{ outline:2px solid var(--ink); outline-offset:1px; }

  /* ---------- layout ---------- */
  .layout{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .sidebar-left{ display:flex; flex-direction:column; flex-shrink:0; }
  main{ flex:1; padding:12px 10px 12px; display:flex; flex-direction:column; gap:12px; min-width:0; }
  main > :not(.diagram), #controls{ width:100%; max-width:760px; margin-left:auto; margin-right:auto; }
  #controls{ display:flex; flex-direction:column; gap:12px; }
  .sidebar-right #controls{ margin-bottom:22px; }
  .sidebar-right .plate-head{ margin-bottom:14px; flex-wrap:wrap; }
  .sidebar-right .plate-no{ font-size:40px; }
  .sidebar-right .meters{ flex-direction:row; align-items:center; gap:10px; width:100%; }
  #ledgerBox{ max-width:760px; margin:0 auto; }
  .sidebar-right #ledgerBox{ max-width:none; }
  .sidebar-right{ flex-shrink:0; padding:0 16px 16px; }

  /* ---------- plate head ---------- */
  .kicker{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
  }
  .plate-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; border-top:1px solid var(--ink); padding-top:8px; }
  .plate-head .left{ min-width:0; }
  .plate-no{ margin:2px 0 0; font-size:34px; line-height:.95; font-weight:500; letter-spacing:-.02em; }
  .plate-no .no{ font-style:italic; font-weight:400; font-size:.55em; color:var(--accent); margin-right:.12em; letter-spacing:0; }
  .plate-title{ margin:6px 0 0; font-style:italic; font-size:16px; line-height:1.3; color:var(--ink-dim); }
  .meters{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto; }
  .meter{ font-family:var(--mono); font-size:12px; color:var(--ink-dim); letter-spacing:.04em; white-space:nowrap; }
  .meter.done{ color:var(--good); }
  .meter.bad{ color:var(--bad); }
  .stamp{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; padding:3px 7px;
    border:1px solid var(--rule); color:var(--ink-faint);
  }
  .stamp.solved{ border-color:var(--good); color:var(--good); }
  .stamp.revealed{ border-color:var(--bad); color:var(--bad); }

  /* ---------- the diagram ---------- */
  .diagram{ display:grid; grid-template-columns:14px auto; grid-template-rows:auto 14px; justify-content:center; --sq:40px; margin-left:-7px; }
  .frame{
    grid-column:2; grid-row:1; border:2px solid var(--frame); padding:2px; box-shadow:var(--shadow); background:var(--bg);
  }
  .frame-in{ border:1px solid var(--frame); }
  .board{ display:grid; grid-template-columns:repeat(8, var(--sq)); grid-template-rows:repeat(8, var(--sq)); touch-action:manipulation; }
  .ranks{ grid-column:1; grid-row:1; display:grid; grid-template-rows:repeat(8, var(--sq)); padding:5px 0; }
  .files{ grid-column:2; grid-row:2; display:grid; grid-template-columns:repeat(8, var(--sq)); padding:0 5px; }
  .ranks span, .files span{ display:grid; place-items:center; font-family:var(--mono); font-size:10px; color:var(--ink-faint); }
  .ranks span{ justify-items:start; }
  .sq{ position:relative; display:grid; place-items:center; user-select:none; -webkit-user-select:none; cursor:pointer; }
  .sq.light{ background:var(--board-light); }
  .sq.dark{ background-color:var(--board-dark); background-image:repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 4px); }
  .sq::after{ content:""; position:absolute; inset:0; pointer-events:none; }
  .sq.from::after, .sq.to::after{ background:var(--mark); }
  .sq.check::after{ background:radial-gradient(circle, rgba(226,72,52,.85) 0%, rgba(226,72,52,.35) 45%, transparent 72%); }
  .sq.sel::after{ box-shadow:inset 0 0 0 3px var(--accent); background:var(--mark); }
  .glyph{
    position:relative; z-index:1; line-height:1; pointer-events:none; font-size:calc(var(--sq) * .76);
    font-family:"DejaVu Sans","Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",Arial,sans-serif;
  }
  .glyph.w{ color:#fffaf0; -webkit-text-stroke:1.3px #1a1210; paint-order:stroke fill; filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
  .glyph.b{ color:#1a1210; -webkit-text-stroke:.5px #1a1210; filter:drop-shadow(0 1px 0 rgba(255,250,240,.25)); }
  .sq .dot{ position:absolute; z-index:2; width:26%; height:26%; border-radius:50%; background:var(--dot); pointer-events:none; }
  .sq .ring{ position:absolute; z-index:2; inset:6%; border-radius:50%; box-shadow:inset 0 0 0 3px var(--dot); pointer-events:none; }
  .sq .hintmark{ position:absolute; z-index:2; inset:3px; box-shadow:0 0 0 3px var(--accent); animation:pulse 1.1s ease-in-out 2; pointer-events:none; }
  @keyframes pulse{ 0%,100%{ opacity:.2; } 50%{ opacity:1; } }

  .caption{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:-6px; font-style:italic; font-size:15px; color:var(--ink-dim); }
  .caption .side{ width:11px; height:11px; border:1.5px solid var(--ink); display:inline-block; }
  .caption .side.b{ background:var(--ink); }

  /* ---------- feedback, notes, actions ---------- */
  .feedback{
    border-left:3px solid var(--rule); padding:4px 0 4px 12px; font-size:16px; line-height:1.4; color:var(--ink-dim); min-height:30px;
  }
  .feedback.good{ border-color:var(--good); color:var(--ink); }
  .feedback.bad{ border-color:var(--bad); color:var(--ink); animation:shake .32s ease; }
  @keyframes shake{ 20%,80%{ transform:translateX(2px); } 40%,60%{ transform:translateX(-4px); } 50%{ transform:translateX(4px); } }

  .note{ border-top:1px solid var(--rule); padding-top:10px; }
  .note p{ margin:6px 0 0; font-size:16px; line-height:1.6; color:var(--ink); }

  .actions{ display:flex; gap:8px; }
  .btn{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    border:1px solid var(--ink); background:transparent; color:var(--ink); padding:11px 10px;
    font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.quiet{ border-color:var(--rule); color:var(--ink-dim); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.danger{ border-color:var(--bad); color:var(--bad); }
  .btn:disabled{ opacity:.4; cursor:default; }

  /* ---------- lesson page ---------- */
  .lesson{ border-top:1px solid var(--ink); padding-top:12px; }
  .lesson h2{ margin:6px 0 12px; font-size:30px; line-height:1.1; font-weight:500; letter-spacing:-.01em; }
  .lesson p{ margin:0; font-size:17px; line-height:1.65; color:var(--ink); }
  .lesson p::first-letter{ float:left; font-size:3.3em; line-height:.82; padding:6px 8px 0 0; color:var(--accent); font-weight:500; }

  /* ---------- solution ledger ---------- */
  .ledger-head{ display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--ink); padding-top:10px; margin-bottom:4px; }
  .ledger{ display:flex; flex-direction:column; }
  .line{ display:grid; grid-template-columns:44px 1fr; column-gap:8px; padding:9px 0; border-bottom:1px solid var(--rule-soft); align-items:baseline; }
  .line:last-child{ border-bottom:none; }
  .line .mn{ font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); text-align:right; }
  .line .san{ font-family:var(--mono); font-size:14.5px; font-weight:700; color:var(--ink); }
  .line .nag{ font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--accent); margin-left:6px; }
  .line .cm{ grid-column:2; margin:3px 0 0; font-style:italic; font-size:14.5px; line-height:1.5; color:var(--ink-dim); }
  .empty-note{ font-style:italic; font-size:14.5px; color:var(--ink-faint); padding:8px 0; }

  /* ---------- footer ---------- */
  footer.bottom{
    position:sticky; bottom:0; z-index:20; display:flex; align-items:center; gap:8px; flex-shrink:0;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background:var(--bg); border-top:1px solid var(--rule);
  }
  .nav{
    flex:0 0 auto; height:44px; padding:0 12px; border:1px solid var(--rule); background:transparent; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink);
  }
  .nav:disabled{ opacity:.3; cursor:default; }
  .counter{ flex:1; text-align:center; font-family:var(--mono); font-size:11px; color:var(--ink-faint); letter-spacing:.06em; line-height:1.35; }
  .counter b{ color:var(--ink); font-weight:500; }
  .reveal{
    flex:0 0 auto; height:44px; padding:0 14px; cursor:pointer; border:1px solid var(--accent); background:transparent; color:var(--accent);
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  }
  .reveal.done{ background:var(--accent); color:var(--accent-ink); }
  .reveal:disabled{ cursor:default; }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--bg); padding:9px 14px; font-size:14.5px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:60; max-width:86%; text-align:center; box-shadow:var(--shadow);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading, .err{ padding:60px 20px; text-align:center; font-style:italic; color:var(--ink-dim); font-size:16px; }
  .err{ color:var(--bad); }

  /* ---------- stats sheet ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(12,4,8,.6); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  .modal-backdrop.open{ display:flex; }
  .modal{
    width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background:var(--bg); border-top:2px solid var(--ink);
    padding:18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow:0 -14px 34px rgba(0,0,0,.4);
  }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
  .modal-head h2{ margin:4px 0 0; font-size:28px; font-weight:500; letter-spacing:-.01em; }
  .modal-close{ border:1px solid var(--rule); background:transparent; width:34px; height:34px; cursor:pointer; font-size:14px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--rule); border-left:1px solid var(--rule); margin-bottom:14px; }
  .stat{ border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:12px 12px 10px; }
  .stat .v{ font-size:34px; line-height:1; font-weight:500; letter-spacing:-.02em; }
  .stat .v.accent{ color:var(--accent); }
  .stat .l{ margin-top:6px; }
  .sparkline{ display:block; width:100%; height:48px; margin:2px 0 16px; }
  .section{ margin-bottom:22px; }
  .section h3{ margin:0 0 8px; }
  .lib-item{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--rule-soft); }
  .lib-item .meta{ flex:1; min-width:0; }
  .lib-item .fname{ font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-item .fsub{ margin-top:2px; }
  .lib-item button{ flex:0 0 auto; border:1px solid var(--bad); color:var(--bad); background:transparent; padding:6px 10px; cursor:pointer;
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
  .warn{ color:var(--bad); font-style:italic; font-size:14px; margin-top:10px; }
  .tab-wrap{ flex:0 0 auto; display:inline-flex; align-items:center; gap:2px; }
  .trash{
    flex:0 0 auto; display:inline-grid; place-items:center; width:30px; height:30px; padding:0; cursor:pointer;
    border:1px solid transparent; background:transparent; color:var(--ink-faint);
  }
  .trash:hover, .trash:focus-visible{ color:var(--bad); border-color:var(--bad); }
  .tab-wrap .trash{ width:26px; height:26px; margin-bottom:4px; }
  .lib-item .trash{ width:36px; height:36px; border-color:var(--bad); color:var(--bad); }
  .hint-text{ margin:0 0 10px; font-style:italic; font-size:14.5px; color:var(--ink-dim); }
  .restore{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .restore-text{ width:100%; min-height:90px; resize:vertical; background:var(--panel); color:var(--ink); border:1px solid var(--rule);
    font-family:var(--mono); font-size:11px; padding:8px; }
  .restore input[type=file]{ display:none; }


  /* ---------- library tree ---------- */
  .crumbbar{ display:flex; align-items:center; gap:10px; padding:10px 10px 0; min-width:0; }

  .tree-node.col{ border-bottom:1px solid var(--rule-soft); }
  .tree-row{ display:flex; align-items:center; gap:4px; }
  .tree-btn{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:11px 4px; border:none; background:none; cursor:pointer; text-align:left; color:var(--ink); }
  .chev{ flex:0 0 14px; font-size:11px; color:var(--ink-faint); transition:transform .15s ease; }

  .tree-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .tree-node.grp.active > .grp-row .tree-label{ color:var(--ink); }
  .tree-count{ flex:0 0 auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.04em; }
  .tree-kids{ padding:0 0 10px 6px; border-left:2px solid var(--accent); margin-left:6px; }
  .tree-plates{ display:flex; flex-wrap:wrap; gap:4px; padding:4px 0 8px 16px; }
  .tree-kids > .tree-plates{ padding-left:10px; }
  .plate.lesson{ font-family:var(--serif); font-size:15px; color:var(--accent); border-style:dashed; }
  .tree-add{ margin-top:10px; padding:12px 4px; border:none; background:none; text-align:left; cursor:pointer; color:var(--accent);

  .drawer{ position:fixed; inset:0; z-index:55; background:rgba(12,4,8,.6); display:none; }

  .drawer-body{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; padding:6px 14px calc(12px + env(safe-area-inset-bottom, 0px)); }


  /* ---------- section switcher + Vasthu Days ---------- */

  .vasthu-view{ display:none; flex:1; min-height:0; }
  .kicker .ta{ letter-spacing:0; text-transform:none; font-family:var(--serif); font-size:1.25em; }
  body.mode-vasthu .vasthu-view{ display:block; }
  body.mode-vasthu .layout, body.mode-vasthu footer.bottom, body.mode-vasthu #statsBtn, body.mode-vasthu #flipBtn{ display:none !important; }
  .vx-wrap{ max-width:760px; margin:0 auto; padding:16px 16px calc(28px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:16px; }
  .vx-head h2{ margin:4px 0 6px; font-size:32px; line-height:1.05; font-weight:500; letter-spacing:-.01em; }
  .vx-sub{ margin:0; font-style:italic; color:var(--ink-dim); font-size:15.5px; line-height:1.5; }
  .vx-owner{ border-top:1px solid var(--ink); padding-top:10px; }

  .vx-fields .vx-field:first-child{ grid-column:1 / -1; }

    font-family:var(--serif); font-size:16px; border-radius:0; }
  .vx-field select{ appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position:calc(100% - 16px) 18px, calc(100% - 11px) 18px; background-size:5px 5px; background-repeat:no-repeat; padding-right:28px; }
  .vx-hint{ margin:10px 0 0; font-size:13.5px; line-height:1.5; font-style:italic; color:var(--ink-faint); }

  .vx-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .vx-when{ min-width:0; }
  .vx-date{ margin:4px 0 2px; font-size:21px; font-weight:500; line-height:1.15; }
  .vx-day.hero .vx-date{ font-size:28px; }
  .vx-tamil{ font-style:italic; color:var(--accent); font-size:15px; }
  .vx-time{ display:flex; align-items:baseline; gap:10px; border-top:1px solid var(--rule-soft); padding-top:9px; }
  .vx-window{ font-family:var(--mono); font-weight:700; font-size:17px; color:var(--ink); }
  .vx-day.hero .vx-window{ font-size:22px; }

  .verdict.bad{ background:var(--bad); color:var(--bad-ink); border-color:var(--bad); }

  .vx-more{ display:flex; flex-direction:column; gap:7px; }
  .vx-check{ display:flex; gap:9px; align-items:baseline; font-size:15px; line-height:1.45; }
  .vx-mark{ flex:0 0 20px; height:20px; display:inline-grid; place-items:center; font-family:var(--mono); font-size:12px; font-weight:700; border:1px solid; }

  .vx-mark.na{ color:var(--ink-faint); border-color:var(--rule); }
  .vx-detail{ margin:0; font-size:14.5px; line-height:1.5; color:var(--ink-dim); }
  .vx-detail b{ color:var(--ink); font-weight:500; }
  .vx-note{ margin:0; padding-left:10px; border-left:3px solid var(--amber); font-style:italic; font-size:14px; color:var(--ink-dim); }

  .vx-details[open] summary{ margin-bottom:8px; }
  .vx-list{ display:flex; flex-direction:column; gap:10px; }

  .vx-how{ border-top:1px solid var(--rule); padding-top:10px; }

  input[type=file]{ display:none; }

    *{ animation:none !important; transition:none !important; }
  }

<div class="app" id="app">

  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">♞</span>
      <div style="min-width:0">
        <h1><em>Vigaasan’s</em> Chess Board</h1>
        <small id="collectionLabel">Practical Chess Endings</small>
      </div>
    </div>
    <div class="tools">
      <button class="tool rating" id="statsBtn" title="Rating, stats &amp; library" aria-label="Rating, stats and library">ELO <b id="ratingBadge">1200</b></button>

    </div>
  </header>

  <nav class="modes" role="tablist" aria-label="Sections">
    <button class="mode active" data-mode="chess" role="tab" aria-selected="true">♞ Chess Puzzles</button>
    <button class="mode" data-mode="vasthu" role="tab" aria-selected="false">⌂ Vasthu Days</button>
  </nav>

  <section class="vasthu-view" id="vasthuView" aria-label="Vasthu days">
    <div class="vx-wrap" id="vasthuBody"></div>
  </section>

  <div class="layout" id="layout">
    <aside class="sidebar-left" id="sidebarLeft">
      <div class="crumbbar" id="crumbBar">
        <button class="libbtn" id="libraryBtn" aria-label="Open library">☰ Library</button>
        <button class="crumbs" id="crumbs" aria-label="Open library"></button>
      </div>
      <div class="strip plates" id="puzzleNumStrip" aria-label="Puzzles in this group"></div>
      <div class="tree-home" id="treeHome"><nav class="tree" id="navTree" aria-label="Library"></nav></div>
    </aside>

    <main id="main">

    </main>

    <aside class="sidebar-right" id="sidebarRight"><div id="controlsDock"></div><div id="ledgerBox"></div></aside>
  </div>

  <footer class="bottom" id="footer">
    <button class="nav" id="prevBtn" aria-label="Previous">← Prev</button>
    <div class="counter" id="counter"></div>
    <button class="reveal" id="revealBtn">Reveal →</button>
    <button class="nav" id="nextBtn" aria-label="Next">Next →</button>
  </footer>

  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Library">
    <div class="drawer-panel">
      <div class="drawer-head">
        <div><div class="kicker">Vigaasan’s Chess Board</div><h2>Library</h2></div>
        <button class="modal-close" id="drawerClose" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".pgn,text/plain,application/x-chess-pgn" multiple>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Stats and library"></div>
  </div>
</div>

't much! I'm not a grandmaster, and I don’t claim to know every complicated concept out there—but what I do know has been enough to help me reach master level. In this course, I’ll share the practical, straightforward principles that actually work. No fluff, just real ideas you can apply in your games right away. Some chapters in this course are naturally connected and may overlap a bit. That’s by design—chess concepts often reinforce each other. Don’t feel frustrated if ideas repeat or build on one another; that’s how real learning happens."}, {"type": "puzzle", "source": "strategy", "num": 1, "chapter": "1) Maximize Your Pawns", "title": "What is a Passed Pawn?", "fen": "1k6/1pp2p2/p2p4/8/8/8/PPP3PP/1K6 w - - 0 1", "moves": ["h4", "Kc8", "h5", "Kd8", "h6", "Ke8", "h7", "Kf8", "h8=Q+"], "moveComments": {"1": "According to the square rule, the Black king is outside the promotion square and cannot catch the passed pawn.", "8": "Now that the passed pawn promoted into a queen, White should win easily. Right? Chess terms: passed pawn, square rule."}, "moveNags": {}, "intro": "A passed pawn is a pawn that cannot be blocked or captured by an enemy pawn as it moves towards promotion. In this position, the [h2]-pawn is the only one that can make it to the other side of the board without being intercepted by any of its enemy pawns. For example, if we push the g-pawn instead, it can be captured by the [f7]-pawn as soon as it reaches [g6]."}, {"type": "puzzle", "source": "strategy", "num": 2, "chapter": "1) Maximize Your Pawns", "title": "The Outside Passed Pawn", "fen": "8/7k/p7/Pp6/1P6/8/7P/7K w - - 0 1", "moves": ["Kg2", "Kg6", "Kf3", "Kf5", "Ke3", "Ke5", "h4", "Kd5", "h5", "Ke5", "h6", "Kf6", "Kd4", "Kg6", "Kc5", "Kxh6", "Kb6", "Kg6", "Kxa6", "Kf6", "Kxb5", "Ke6", "a6", "Kd7", "a7", "Kc7", "a8=Q"], "moveComments": {"2": "The white king is on its way to capture the black pawns.", "3": "The black king is trying to stop the white king from getting into its territory.", "6": "Now we can see why the h-pawn is considered to be passed even though the black king can stop it. The black king has to choose between blocking the white king and stopping the h-pawn. The trainable can stop here. The key point of this variation is to show the power of the outside passed pawn: 🔹 if the enemy king ignores it, the h-pawn will promote; 🔹 if the king goes after it, our own king will capture the opponent’s pawns on the opposite side of the board and support the advance of our remaining pawns. Please, however, take a look at how to convert this position:", "7": "Black doesn't want to accept it.", "11": "The black king finally gives in.", "12": "Now that the h-pawn distracted the black king, it's time to continue our way to the queenside. By the way, since our passed pawn is far from the rest of the pawns, we call it an outside passed pawn. Outside passed pawns are often used as distraction.", "15": "By the time the outside passed pawn is captured, our king is too close to the rest of the pawns.", "18": "The moment we collected the [a6]-pawn, our a-pawn became a passed pawn.", "20": "Yes, the b-pawn is now a passed pawn too.", "22": "Passed pawns are meant to be pushed!", "26": "Mission completed. Well done!"}, "moveNags": {}, "intro": "An outside passed pawn is a passed pawn on the edge of the board, and not in the path of threats from the opponent's pawns. In the endgame, it can be used as a decoy: because it threatens to promote, by advancing or even sacrificing it, you draw the opponent’s king away. This gives your own king time to march to the other side and capture pawns there. In this position, the [h2]-pawn cannot be blocked or captured by an enemy pawn. However, the black king is in its way. So, is the [h2]-pawn a passed pawn or not really? Yes! It only has to do with enemy pawns. If instead of the black king, we had an enemy queen, bishop, knight, or rook on [h7], the [h2]-pawn would still be considered a passed pawn."}, {"type": "puzzle", "source": "strategy", "num": 3, "chapter": "1) Maximize Your Pawns", "title": "The Protected Passed Pawn", "fen": "8/8/1k6/pP4p1/P7/6K1/8/8 w - - 0 1", "moves": ["Kg4", "Kc5", "Kxg5", "Kb6", "Kf6", "Kc5", "Ke6", "Kb6", "Kd6", "Kb7", "Kc5", "Kc7", "b6+", "Kb7", "Kb5", "Kb8", "Kxa5", "Kb7", "Kb5", "Kb8", "Kc6", "Kc8", "a5", "Kb8", "a6", "Ka8", "b7+", "Kb8", "Kd7", "Ka7", "Kc7", "Kxa6", "b8=Q", "Ka5", "Qb3", "Ka6", "Qb6#"], "moveComments": {"2": "Now the white king can help the b-pawn move to its promotion square b8.", "10": "And the white king is ready to help!", "12": "The passed pawn is now protected by the king.", "16": "Just like that, White has a second passed pawn.", "30": "And the king is ready to support the promotion of its b-pawn.", "34": "Forcing the king to [a6]."}, "moveNags": {"31": ["$7"], "35": ["$7"]}, "intro": "In this position, Black has a passed pawn on [g5], while White has a passed pawn on [b5]. Which one do you think is best? Of course, it is the white pawn, since the [a4]-pawn protects it. [b5] is what we call a protected passed pawn. In other words, the white king can easily collect the [g5]-pawn, but the black king cannot capture [b5]."}, {"type": "puzzle", "source": "strategy", "num": 4, "chapter": "1) Maximize Your Pawns", "title": "Creating a Passed Pawn", "fen": "6k1/1p3p1p/2np2p1/4p3/8/3P1B2/PP3PPP/6K1 w - - 0 1", "moves": ["Bxc6", "bxc6", "a4", "d5", "a5", "e4", "dxe4", "dxe4", "a6", "c5", "a7", "c4", "a8=Q+", "Kg7", "Qxe4"], "moveComments": {"0": "Of course! If Black captures our bishop, then the [a2]-pawn is passed and ready to be pushed. If Black doesn't capture, well, we are up a piece.", "2": "The black king cannot stop us in time.", "5": "Black wants to create their own passed pawn.", "8": "But our pawn is faster on the way to promotion.", "14": "And the rest should be easy for White."}, "moveNags": {}, "intro": "Do you see any passed pawns in this position? Your answer should be no. However, it's White's turn, and they can easily create one. Notice how the [a2]-pawn can only be intercepted by the [b7]-pawn. Now, the [b7]-pawn also has the task of protecting the black knight. So, if the [b7]-pawn is overloaded, how can we take advantage of it?"}, {"type": "puzzle", "source": "strategy", "num": 5, "chapter": "1) Maximize Your Pawns", "title": "Creating a Passed Pawn by Advancing", "fen": "2rq1rk1/5ppp/1p3p2/p1p5/2PP4/8/PP3PPP/R2Q1RK1 w - - 0 1", "moves": ["d5", "Re8", "Re1", "Rxe1+", "Qxe1", "Qe8", "Qxe8+", "Rxe8", "Kf1", "Kf8", "Re1", "Rxe1+", "Kxe1", "Ke7", "Kd2", "Kd6", "Kc3", "Ke5", "Kb3", "Kd6", "Ka4", "Kc7", "Kb5", "h5", "d6+", "Kxd6", "Kxb6", "a4", "Kb5", "g5", "Kxa4", "Kc6", "b4", "cxb4", "Kxb4", "Kb6", "c5+", "Kc6", "a4", "f5", "a5", "f4", "f3", "g4", "h3", "f5", "a6", "h4", "Kc4", "Kc7", "Kd5", "gxf3", "gxf3", "Kb8", "Kd6", "Ka7", "Kd7", "Kxa6", "c6", "Kb6", "c7", "Kb7", "c8=Q+"], "moveComments": {"0": "We moved past the [c5]-pawn, and Black doesn't have an e-pawn. Yes, we officially have a passed pawn on [d5]. More specifically, it's a protected passed pawn! The important thing to remember is the fewer pieces on the board, the more powerful our passed pawn will be. We want to advance it when there aren't many pieces to attack it. So, the plan for White is to trade down the queens and rooks.", "2": "Let's simplify the game.", "8": "Whenever you are in an endgame, an active king should come to mind. In this case, White is also trying to offer the trade of rooks.", "11": "Black should have kept their rook on the board. It’s the best way for them to try to complicate the game.", "12": "This is an easy win now. Here is the plan: 1 the white king will go after the weak [b6]-pawn; 2 when the black king tries to defend it... 3 ...we push our passed pawn. ➢ This distraction will help us promote another pawn. It's very important not to push a passed pawn prematurely because you might just lose it for nothing.", "24": "Say hello to the passed pawn. It will not promote, but deflecting the black king is all we need.", "26": "And the [a5]-pawn will fall next.", "30": "I hope you noticed how the [a2]-pawn automatically became a passed pawn.", "33": "And now the [c4]-pawn is passed as well.", "42": "At first glance, it looks like Black can create a passed pawn on the kingside. However, they have two pawns in front of each other, making it a three vs three instead of four vs three. Nevertheless, we must be careful.", "46": "With the kingside under control, we continue to push our passed pawns.", "50": "The white king is ready to support the c-pawn, but it can always go to the kingside to collect the black pawns.", "56": "And now the c-pawn will be guarded by the king all the way to promotion.", "62": "And that’s how it’s done!"}, "moveNags": {}, "intro": "Black just moved their pawn to [c5]. Now White has a few options: a capture dxc5; b advance d5; c keep the tension. What would you play?"}, {"type": "puzzle", "source": "strategy", "num": 6, "chapter": "1) Maximize Your Pawns", "title": "From Pawn Majority To Passed Pawn", "fen": "6k1/pp3p1p/6p1/8/8/7P/PPP2PP1/6K1 w - - 0 1", "moves": ["Kf1", "Kf8", "Ke2", "Ke7", "Kd3", "Kd6", "Kd4", "Kc6", "c4", "f6", "b4", "a6", "a4", "h5", "b5+", "axb5", "axb5+", "Kd6", "c5+", "Ke6", "Ke4", "h4", "f3", "g5", "Kd4", "f5", "c6", "bxc6", "bxc6", "Kd6", "c7", "Kxc7", "Ke5", "f4", "Kf5", "Kd6", "Kxg5", "Ke5", "Kxh4", "Kf5", "g3", "fxg3", "Kxg3", "Kg5", "h4+", "Kh5", "f4", "Kh6", "Kg4", "Kg6", "f5+", "Kf6", "h5", "Kg7", "Kg5", "Kh7", "f6", "Kh8", "Kg6", "Kg8", "f7+", "Kf8", "h6", "Ke7", "Kg7", "Ke6", "f8=Q", "Kd5", "Qe7", "Kd4", "h7", "Kd5", "h8=Q", "Kd4", "Qhd8+", "Kc4", "Qec7+", "Kb4", "Qdb8+", "Ka4", "Qca7#"], "moveComments": {"0": "Putting the pawn majority in motion without activating the king could be a huge mistake.", "1": "Black also understands that endgame means active king.", "6": "Now that the white king is active, the pawn majority is safe to advance. Otherwise, the black king would collect whatever passed pawn White gets.", "8": "Important rule: \" When we advance a pawn majority to create a passed pawn, we want to start with the pawn that doesn't have an enemy pawn in front. \" Both the white a- and b-pawns have an enemy pawn in front. So, White pushed the c-pawn instead.", "12": "White is ready to strike on [b5].", "14": "Forcing the trade of pawns.", "16": "Just like that! We went from three vs two to two vs one.", "20": "White is not ready to play [c6] yet. At the end of the day, there is no rush.", "22": "Just waiting for the black king to back up so that our king can enter their territory.", "26": "White finally creates a passed pawn. And yes, we do it now because once the black king goes after our passed pawn, the white king will go to [e5] ready to capture every black pawn from the kingside. Can you see the follow-up? Which side are we going to promote on?", "30": "Deflection!", "31": "The black king captured the passed pawn, but now it is too far from the rest of the pawns.", "38": "And the h-pawn just became a passed pawn.", "42": "The rest should be easy with two passed pawns and an active king. White only needs to be careful with stalemate. Anyway, let's take a look at a possible continuation."}, "moveNags": {}, "intro": "Do you see any passed pawn? Of course not! However, White has three pawns vs two on the queenside. This is known as a pawn majority. If White trades two of their queenside pawns for two of the black queenside pawns, they would end up with a passed pawn. With that said, what should White play now?"}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "Emanuel Lasker – Siegbert Tarrasch, Düsseldorf 1908 (World Ch. Match)", "intro": "This is one of the first games I memorized. I was fascinated by how easily Lasker used his pawn majority to create a passed pawn and defeat Tarrasch. Keep in mind, Lasker was the second world champion, and this game was played in 1908."}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "FM Corey Acor – NM Robert Ramirez, 2014", "intro": ""}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "Blocking a Passed Pawn", "intro": "By now, you should understand the dynamics of playing with a passed pawn. However, it's time to learn to play against one. Yes, there is a science behind blocking and dealing with our opponent's passed pawns. — What’s up in this position? — White has a passed pawn on [d4], but the knight on [d5] is blocking its advance. Key Points: 1 The piece we use to block an enemy passed pawn with (the [d5]-knight in this position) is important because: a As a defensive piece, it stops the passed pawn. b As an active piece, it is protected from any frontal attack thanks to the same passed pawn it is blocking. For example, the white queen cannot hit the black knight due to the [d4]-pawn being in the way. 2 The best pieces to block a passed pawn with are knights, bishops, and the king in the endgame. 3 The worst pieces to block a passed pawn with are rooks and queens because their main responsibility is to attack. 4 A passed pawn that is effectively being blocked has less value than a mobile pawn majority with the support of the blocking piece. In this case, we can see how the [d4]-pawn is not going anywhere, while the black pawns on the queenside are very powerful."}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "Kai Taibor – Robert Ramirez, Estero 2016", "intro": ""}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "When Your Passed Pawn is Blocked", "intro": "How to deal with the blockade of a passed pawn? Well, these are the ones I know: a By attacking the blocker. In this position, White could play Bf3 -- to attack the [c6]-knight, followed by, for example, Na5 (. b By developing an attack on the other side of the board. That way, the blocker has to abandon its position. c By preventing the blockade before it actually happens obviously.)"}, {"type": "puzzle", "source": "strategy", "num": 7, "chapter": "1) Maximize Your Pawns", "title": "What Is an Isolated Pawn?", "fen": "r2kr3/pp3p1p/4p3/3pP3/2pP4/2P2PP1/PP1KR3/2R5 w - - 0 1", "moves": ["Rh1", "Rh8", "Reh2", "Rg8", "g4"], "moveComments": {"0": "Well, I hope you considered using one of your rooks to attack the isolated pawn.", "1": "It looks like Black has no problem since their rook was able to help. However, that's the first problem with isolated pawns. They require powerful pieces like the rook, in this case, to protect them. Such powerful pieces should be attacking instead of passively babysitting their own pawns.", "2": "And the [h7]-pawn will fall.", "3": "In contrast, now the [g3]-pawn seems to be under attack, but this is not an isolated pawn. White can easily ask their [f3]-pawn for help!", "4": "Whatever Black plays, the [h2]-rook will take the pawn, and White has a significant advantage."}, "moveNags": {}, "intro": "An isolated pawn is a pawn that has no friendly pawn on the files next to it. A good example in this position is the black pawn on [h7]. Notice how no other black pawn can support or protect it. So, yes, isolated pawns are usually a weakness to have. Believe it or not, it's already time to see if you've learned anything. What should White play next?"}, {"type": "puzzle", "source": "strategy", "num": 8, "chapter": "1) Maximize Your Pawns", "title": "Creating an Isolated Pawn", "fen": "r4rk1/p4pp1/2p2p1p/1b1p4/8/N1P1P2P/PP3PP1/R4RK1 w - - 0 1", "moves": ["Nxb5", "cxb5", "Rfd1", "Rfd8", "Rd4", "Rd6", "Rad1", "Rad8", "e4"], "moveComments": {"1": "Magic! The [c6]-pawn was forced to move to the b-file. Now the [a7]-pawn is no longer isolated. On the other hand, the [d5]-pawn became isolated since there is no black pawn on the c- or e-files.", "2": "Of course! All White has to do now is put pressure on the weak pawn.", "4": "Making room to bring the [a1]-rook as well. Also known as doubling the rooks.", "7": "Just like that! The powerful black rooks are tied down to the weak [d5]-pawn.", "8": "The final touch! White brings a third attacker, and Black runs out of defenders."}, "moveNags": {}, "intro": "Do you see any isolated pawns in this position? I hope you said yes! The [a7]-pawn is isolated, but it’s not easy to attack, right? So, what if White could create another isolated pawn for the opponent? Visualize the follow-up – which maneuver would help you attack this newly created isolated pawn? You’ll need to play five moves. Take your time!"}, {"type": "puzzle", "source": "strategy", "num": 9, "chapter": "1) Maximize Your Pawns", "title": "Benefits of Having an Isolated Pawn", "fen": "1br1r1k1/pb3ppp/1p1q4/3p4/4n3/1P2P3/PB1NBPPP/R2Q1RK1 w - - 0 1", "moves": ["Nf3", "Re6"], "moveComments": {"0": "White stops the checkmate threat on [h2].", "1": "Yes! Black benefits from not having a pawn on the e-file. Now the rook is ready to roll over to [g6] or [h6] with a promising attack."}, "moveNags": {}, "intro": "Isolated pawns also have benefits. For example, in this position, Black doesn't mind their weak pawn on [d5] because it is well protected and provides: a Open files for their rooks to attack and eventually penetrate c and e. In other words, the lack of friendly pawns means open roads for the major pieces. b Support for their knights on the central squares of [e4] and [c4]. c Space advantage. The [d5]-pawn also prevents enemy pieces from occupying key central squares such as [c4] and [e4]. While isolated pawns can be a liability as we reach the endgame, their dynamic potential in the middlegame can offer more than enough compensation. As a general plan in this position, Black should use their active pieces and space advantage to continue playing energetically and attacking the white king."}, {"type": "puzzle", "source": "strategy", "num": 10, "chapter": "1) Maximize Your Pawns", "title": "Playing Against the Isolated Central Pawn", "fen": "rnbq1rk1/pp2bpp1/4pn1p/2p5/2BP3B/2N1PN2/PP3PPP/2RQK2R b K - 0 9", "moves": ["cxd4", "exd4", "Nc6", "O-O", "Nh5", "Bxe7", "Nxe7", "Bb3", "Nf6", "Ne5", "Bd7", "Qe2", "Rc8", "Ne4", "Nxe4", "Qxe4", "Bc6", "Nxc6", "Rxc6", "Rc3", "Qd6", "g3", "Rd8", "Rd1", "Rb6", "Qe1", "Qd7", "Rcd3", "Rd6", "Qe4", "Qc6", "Qf4", "Nd5", "Qd2", "Qb6", "Bxd5", "Rxd5"], "moveComments": {"0": "In this game from 1981, Karpov takes on [d4], and he would be happy to see Korchnoi recapture with his pawn.", "1": "Indeed! Korchnoi could have captured with his knight to avoid getting the isolated queen's pawn IQP. However, many players enjoy the benefits we discussed earlier dynamic play and attacking chances. Now, let's pay attention to how Karpov handles the IQP. In general, when playing against the isolated queen's pawn, we want to do the following: 1 Control the square right in front of the isolated pawn. In front of every isolated pawn, there is a weak square; and we would love to place a piece there — ideally, a knight. Also, we must try to prevent the isolated pawn from advancing further. 2 Put pressure on the isolated pawn, of course. Believe it or not, this is not so much about capturing the pawn. We are more interested in forcing the enemy pieces to be passive by babysitting their weak pawn. 3 Simplify the game. The closer we get to the endgame, the more of a liability the isolated pawn becomes. Also, the fewer pieces our opponent has, the fewer chances they have to attack us through the open lines their isolated pawn provides. 4 When it comes to simplification, I prefer to focus on trading minor pieces knights and bishops. Our major pieces queens and rooks could be stacked to pressure the isolated pawn.", "2": "Karpov develops his knight by putting pressure on the weak [d4]-pawn.", "3": "White puts his king in safety before starting to attack.", "4": "Karpov plays by the book. This move begins the simplification process.", "6": "The knight captures and keeps an eye over the critical [d5] square. Remember, we want to prevent White's IQP from advancing, and we also would love to block it with a knight.", "8": "Yes, more control over the [d5]-square.", "9": "Immediately, White puts their knight in Black's territory. Consistent with the IQP strategy.", "13": "Korchnoi continues to advance, but Karpov is ready to simplify. Once more, the closer we get to the endgame, the more of a liability the [d4]-pawn will be for White.", "18": "Simplification is music to our ears!", "19": "White invites Black to take on [c3]. In that case, the b-pawn would recapture and [d4] would not be isolated anymore.", "22": "Karpov wants to have his major pieces lined up to attack the IQP.", "26": "Making room for the [b6]-rook to transfer to the d-file.", "28": "This lineup of the major pieces, my friend, is known as Alekhine's gun.", "30": "Come on, Korchnoi! Let's trade queens and walk into an endgame.", "36": "And Karpov went on to win this game. It's worth noting that Black only has a small advantage at this moment, but I hope you appreciated how Karpov kept it simple by following the three ideas listed earlier. From the game Viktor Korchnoi – Anatoly Karpov, Merano, 1981 World Championship match."}, "moveNags": {}, "intro": "When the isolated pawn is in the center, things are more delicate. The main reason is that all the attention is not only on the isolated pawn itself, but also on the center of the board, which happens to be the most important part of the battlefield. I think it's time to bring Karpov on!"}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "What Are Doubled Pawns?", "intro": "Doubled pawns are two pawns of the same color on the same file, one behind the other. This happens when a pawn captures an enemy piece and ends up in front of or behind a friendly pawn. In this position, we can see how the [c7]- and [c6]-pawns are on the same file doubled pawns."}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "The Problem With Doubled Pawns", "intro": ""}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "Benefits of Having Doubled Pawns", "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 11, "chapter": "1) Maximize Your Pawns", "title": "What Is a Backward Pawn?", "fen": "rq3rk1/pp1bbppp/2nppn2/1N6/4P3/2N5/PPP2PPP/R1BQRBK1 w - - 0 1", "moves": ["Bf4", "e5", "Bg5", "a6", "Bxf6", "Bxf6", "Nxd6", "Nd4", "Nc4"], "moveComments": {"0": "I develop my bishop by adding more pressure to the [d6]-pawn.", "1": "Exactly what I wanted! Now the [d6]-pawn is left behind, and it has no friendly pawn to support its advancement, making [d5] a weak square and an excellent outpost for my knight. We will have a chapter on outposts later in the course. a So, we can say that a backward or left-behind pawn is a base pawn that is fixed in a specific square and cannot be helped by a friendly pawn. Yes, it sounds a lot like the isolated pawn. b The closer we get to the endgame, the more of a liability backward pawns become. c When playing against backward pawns, we must block them so that they remain fixed in place. At the same time, we want to find ways to attack them. d A backward pawn is a decisive strategic factor because even though attacking them directly may lead to nothing, it forces the opponent's pieces to remain in a passive position with limited space to maneuver. In the meantime, the blocking/attacking pieces enjoy greater freedom of action and can dictate the course of play initiative.", "2": "White needs to eliminate the only black piece controlling the [d5]-square. That way, the backward [d6]-pawn cannot advance to [d5], and our knight can land safely in the center instead.", "5": "Even if favored by the engine, 13...gxf6 would expose the black king and ruin their kingside pawns.", "6": "And just like that, the left-behind pawn fell.", "8": "I was able to convert this game easily a few moves later, but I hope you could appreciate the problem with backward pawns. To explore the concept of a backward pawn from a different perspective, click here."}, "moveNags": {}, "intro": "It's time to talk about backward pawns also known as left behind pawns. However, before we do so, I would like to direct your attention to the black pawn on [d6]. — Is that an isolated pawn? — Of course not! It has a friendly pawn on an adjacent file, the [e6]-file. This friendly pawn on [e6] was particularly annoying to me during the game because it kept my [c3]-knight from moving to [d5]. I was White, of course."}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "When Backward Pawns Are Not a Problem", "intro": "Wolfgang Unzicker – David Bronstein, Gothenburg 1955"}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "What Are Hanging Pawns?", "intro": "It's time to talk about hanging pawns. Books define them as pawns on adjacent files that are away or separated from the rest of their friendly pawns. I personally tell my students that hanging pawns are two isolated pawns next to each other. They have almost the same characteristics as isolated pawns. ( Pros: 1 They provide open files or semi-open files to their major pieces b and e in this case. 2 They offer support to knights in the center. 3 They provide a space advantage in the center, making it difficult for enemy pieces to maneuver. 4 Two hanging pawns offer more dynamic play than one isolated pawn since they have the potential to create a passed pawn. Playing ) c5 in this position creates a passed pawn for White, for example. 5 Two hanging pawns are more difficult to attack than one isolated pawn. Cons: 1 Just like isolated pawns, hanging pawns are separated from the rest of their friendly pawns. This means that when attacked, all their pieces might be tied down to their defense, giving the opponent a key strategic advantage. 2 If any of the hanging pawns is advanced, the other pawn automatically becomes a left-behind pawn. 3 If one of the hanging pawns is traded, the remaining pawn will become an isolated pawn. -- Chess term: hanging pawn."}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "Playing With Hanging Pawns", "intro": "Gedeon Barcza – Harry Golombek, Saltsjobaden 1952, 1-0."}, {"type": "puzzle", "source": "strategy", "num": 12, "chapter": "1) Maximize Your Pawns", "title": "Playing Against Hanging Pawns", "fen": "rn3rk1/p3qpp1/1p2b2p/2pp4/Q2P4/4PN2/PP3PPP/2R1KB1R w K - 0 13", "moves": ["Qa3", "Rc8", "Bb5", "a6", "dxc5", "bxc5", "O-O", "Ra7", "Be2", "Nd7", "Nd4", "Qf8", "Nxe6", "fxe6", "e4", "d4", "f4", "Qe7", "e5", "Rb8", "Bc4", "Kh8", "Qh3", "Nf8", "b3", "a5", "f5", "exf5", "Rxf5", "Nh7", "Rcf1", "Qd8", "Qg3", "Re7", "h4", "Rbb7", "e6", "Rbc7", "Qe5", "Qe8", "a4", "Qd8", "R1f2", "Qe8", "R2f3", "Qd8", "Bd3", "Qe8", "Qe4", "Nf6", "Rxf6", "gxf6", "Rxf6", "Kg8", "Bc4", "Kh8", "Qf4"], "moveComments": {"4": "It happened!", "5": "Say hello to the hanging pawns and their isolated friend from [a6]. When playing against hanging pawns, we keep the following ideas in mind: a Keep them from advancing effectively. b If they advance, be ready to block them, especially the one that is passed. c Put pressure on them so that our opponent's pieces are tied down to their defense. d Try to strike with pawns; in this position [e4] or [b4]. That way, we force them to create weaknesses.", "7": "Now the rook is protected by the queen.", "10": "Fancy, I know!", "14": "The thematic break to weaken the hanging pawns.", "15": "Notice how the [c4]-square becomes available for the white pieces right away.", "20": "Great square for the bishop!", "22": "The powerful queen transfers to the kingside with a tempo on the weak [e6]-pawn. Now Fischer is ready to attack the black king.", "27": "The [e5]-pawn automatically becomes a passed pawn. You could argue that it also became an isolated pawn.", "36": "Go! Passed pawn, go!", "56": "And Spassky resigned. What a game!"}, "moveNags": {}, "intro": "I dare to say you are familiar with the great Bobby Fischer, and in this game from the 1972 World Championship, we see how he neutralized the hanging pawns. What makes it even more impressive is that he was playing the legendary Boris Spassky. Enjoy!"}, {"type": "puzzle", "source": "strategy", "num": 13, "chapter": "1) Maximize Your Pawns", "title": "The Protected Passed Pawn (Practice)", "fen": "8/8/4K3/pPk5/P7/8/8/8 b - - 0 1", "moves": ["Kb6", "Kd6", "Kb7", "Kc5", "Kc7", "b6+", "Kb7", "Kb5", "Kb8", "Kxa5", "Kb7", "Kb5", "Kb8", "Kc6"], "moveComments": {"0": "A protected passed pawn is a passed pawn that is defended by at least one other pawn. Which pawn is the passer in this position? The [b5]-pawn? Correct! Now, can you visualize the next three moves for White that will lead the b-pawn to promotion?", "3": "And the white king is ready to help!", "5": "The king now protects the passed pawn.", "9": "Just like that, White has a second passed pawn.", "13": "And nothing except stalemate...🤔 can stop White from promoting now. 11.a5 is fine, but slower. 11...Kb7 12.a6+ Kc8 13.Kc6 . Chess terms: protected passed pawn, passed pawn."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 14, "chapter": "1) Maximize Your Pawns", "title": "From Pawn Majority To Passed Pawn (Practice 1)", "fen": "8/pp2kp1p/6p1/8/8/3K3P/PPP2PP1/8 b - - 0 3", "moves": ["Kd6", "Kd4", "Kc6", "c4", "f6", "b4", "a6", "a4", "h5", "b5+"], "moveComments": {"0": "This endgame is a battle between the two kings. Now they are in the center. But on which side of the board must White seek victory? Now that the white king is active, the pawn majority is safe to advance. Otherwise, the black king would collect whatever passed pawn White gets.", "1": "The opposition is wise. Now that the white king is active, the pawn majority is safe to advance. Otherwise, the black king would collect whatever passed pawn White gets. Other moves are winning, like ✅ 1.c4 or ✅ 1.b4 .", "3": "Important rule: \" When we advance a pawn majority to create a passed pawn, we want to start with the pawn that doesn't have an enemy pawn in front. \" Both the white a- and b-pawns have an enemy pawn in front. So, White pushed the c-pawn instead.", "7": "White is ready to strike on [b5].", "9": "Forcing the trade of pawns."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 15, "chapter": "1) Maximize Your Pawns", "title": "From Pawn Majority To Passed Pawn (Practice 2)", "fen": "8/1p6/4kp2/1PP3p1/3K3p/5P1P/6P1/8 b - - 0 13", "moves": ["f5", "c6", "bxc6", "bxc6", "Kd6", "c7", "Kxc7", "Ke5"], "moveComments": {"0": "Which pawn should you push to create a passed pawn?", "1": "White finally creates a passed pawn. And yes, we do it now because once the black king goes after our passed pawn, the white king will go to [e5] ready to capture every black pawn from the kingside. Let’s stop here for training. Can you see the follow-up? Which side are we going to promote on?", "5": "Deflection!", "6": "The black king captured the passed pawn, but now it is too far from the rest of the pawns.", "7": "And the king is about to go full Pac-Man on the black pawns. Yum… After the banquet, promotion to a queen awaits. If you’re unsure what they are, please check these concepts: opposition and deflection."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 16, "chapter": "1) Maximize Your Pawns", "title": "Acor – Ramirez, 2014 (Practice)", "fen": "8/pp4k1/7p/3p1bp1/6K1/2P1r2P/PP3R2/8 w - - 0 43", "moves": ["Rxf5", "Kg6", "Rf3", "h5+", "Kg3", "Rxf3+", "Kxf3", "Kf5", "a3", "g4+", "hxg4+", "hxg4+", "Kg3", "Ke4"], "moveComments": {"0": "Study the position carefully. Your plan is twofold: create a mating threat; if White parries it, simplify and convert to a winning endgame. Count the opponent's king’s flight squares and look for forcing moves.", "1": "That's it! You're threatening ...[h5], mate.", "2": "Creating a safe square on [g3]. This stops the checkmate, but Black has the opportunity to trade into an easy king and pawns endgame.", "3": "Check.", "6": "Simplification achieved!", "7": "Opposition and now it's a matter of turning our pawn majority into an outside passed pawn.", "13": "Leaving the outside passed pawn as a distraction."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 17, "chapter": "1) Maximize Your Pawns", "title": "Passed Pawn (Puzzle)", "fen": "8/1p6/1Pn3k1/5bp1/8/6P1/5K1P/2R5 w - - 0 1", "moves": ["Rxc6+", "bxc6", "b7", "c5", "b8=Q"], "moveComments": {"0": "Now, White is up an exchange and a pawn.", "1": "And the [b6]-pawn is officially a passed pawn!"}, "moveNags": {}, "intro": "Pretend you are playing this game as White. It's the last game of your match for the world championship. You win and you become the new Chess World Champion. What's your next move?"}, {"type": "puzzle", "source": "strategy", "num": 18, "chapter": "1) Maximize Your Pawns", "title": "Benefits of an Isolated Pawn (Puzzle)", "fen": "1br1r1k1/pb3ppp/1p6/3p4/4n2q/1P2P1N1/PB2BPPP/R2Q1RK1 b - - 0 1", "moves": ["Re6", "Bg4", "Rh6"], "moveComments": {"0": "Yes! Black benefits from not having a pawn on the e-file. Now the rook is ready to roll over to [g6] or [h6] with a promising attack.", "2": "And White has to be careful."}, "moveNags": {}, "intro": "Isolated pawns also have benefits. For example, in this position, Black doesn't mind their weak pawn on [d5] because it is well protected and provides: a Open files for their rooks to attack and eventually penetrate c and e. In other words, the lack of friendly pawns means open roads for the major pieces. b Support for their knights on the central squares of [e4] and [c4]. c Space advantage. The [d5]-pawn also prevents enemy pieces from occupying key central squares such as [c4] and [e4]. While isolated pawns can be a liability as we reach the endgame, their dynamic potential in the middlegame can offer more than enough compensation. As a general plan in this position, Black should utilize their active pieces and space advantage to continue playing energetically and attacking the white king."}, {"type": "puzzle", "source": "strategy", "num": 19, "chapter": "1) Maximize Your Pawns", "title": "Handle the IQP Like Karpov (Practice 1)", "fen": "rnbq1rk1/pp2bpp1/4pn1p/2p5/2BP3B/2N1PN2/PP3PPP/2RQK2R b K - 0 9", "moves": ["cxd4", "exd4", "Nc6"], "moveComments": {"0": "In this game from 1981, Karpov takes on [d4], and he would be happy to see Korchnoi recapture with his pawn.", "1": "Indeed! Korchnoi could have captured with his knight to avoid getting the isolated queen's pawn IQP. However, many players enjoy the benefits we discussed earlier dynamic play and attacking chances. Now, let's pay attention to how Karpov handles the IQP. In general, when playing against the isolated queen's pawn, we want to do the following: 1 Control the square right in front of the isolated pawn. In front of every isolated pawn, there is a weak square; and we would love to place a piece there — ideally, a knight. Also, we must try to prevent the isolated pawn from advancing further. 2 Put pressure on the isolated pawn, of course. Believe it or not, this is not so much about capturing the pawn. We are more interested in forcing the enemy pieces to be passive by babysitting their weak pawn. 3 Simplify the game. The closer we get to the endgame, the more of a liability the isolated pawn becomes. Also, the fewer pieces our opponent has, the fewer chances they have to attack us through the open lines their isolated pawn provides. 4 When it comes to simplification, I prefer to focus on trading minor pieces knights and bishops. Our major pieces queens and rooks could be stacked to pressure the isolated pawn.", "2": "Karpov develops his knight by putting pressure on the weak [d4]-pawn."}, "moveNags": {}, "intro": "When the isolated pawn is in the center, things are more delicate. The main reason is that all the attention is not only on the isolated pawn itself, but also on the center of the board, which happens to be the most important part of the battlefield. In this position, cxd4 , 9...Nc6 or even 9...Qb6 are interesting candidate moves. What did Karpov play in this legendary game?"}, {"type": "puzzle", "source": "strategy", "num": 20, "chapter": "1) Maximize Your Pawns", "title": "Handle the IQP Like Karpov (Practice 2)", "fen": "r1bq1rk1/pp2bpp1/2n1pn1p/8/2BP3B/2N2N2/PP3PPP/2RQK2R w K - 0 11", "moves": ["O-O", "Nh5", "Bxe7", "Nxe7", "Bb3", "Nf6"], "moveComments": {"0": "White puts his king in safety before starting to attack. How to simplify and restrain White’s isolated pawn?", "1": "Karpov plays by the book. This move begins the simplification process.", "3": "The knight captures and keeps an eye over the critical [d5]-square. Remember, we want to prevent White's IQP from advancing, and we also would love to block it with a knight.", "5": "Yes, more control over the [d5]-square."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 21, "chapter": "1) Maximize Your Pawns", "title": "Handle the IQP Like Karpov (Practice 3)", "fen": "5rk1/pp2npp1/2rqp2p/8/3PQ3/1BR5/PP3PPP/5RK1 w - - 0 20", "moves": ["g3", "Rd8", "Rd1", "Rb6", "Qe1", "Qd7", "Rcd3", "Rd6", "Qe4", "Qc6"], "moveComments": {"0": "How to attack the IQP? Note that this one is set as trainable, as the maneuver can be difficult to find.", "1": "Karpov wants to have his major pieces lined up to attack the IQP.", "3": "The continuation of the maneuver.", "5": "Making room for the [b6]-rook to transfer to the d-file. Engines today may not call this move the best, but who cares? It’s practical, and we stick to the plan.", "7": "This lineup of the major pieces, my friend, is known as Alekhine's gun.", "9": "Come on, Korchnoi! Let's trade queens and walk into an endgame. Takeaway: Generally, an isolated queen’s pawn becomes a liability in the endgame if it cannot advance to become a passed pawn."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 22, "chapter": "1) Maximize Your Pawns", "title": "Isolated Pawns in the Endgame (Puzzle)", "fen": "8/1pppkppp/p1n5/8/1NKP4/2P5/PP3PPP/8 w - - 0 1", "moves": ["Nxc6+", "bxc6", "Kb4", "Kd8", "Ka5", "Kc8", "Kxa6"], "moveComments": {"0": "Black has to recapture on [c6]. What pawn would you use?", "1": "Black made a decisive mistake. Without the b-pawn, [a6] becomes isolated – a weakness! And since this is the endgame, Black has no pieces knights, bishops, queens, rooks to protect their weak pawn. All White has to do is go after it.", "2": "The white shark gets closer to the seal.", "6": "Just like that! White is up a pawn, and their a-pawn became a passed pawn. Passed pawns are meant to be pushed. Remember?"}, "moveNags": {}, "intro": "Before we go any further, let’s look at a practical example. Your goal is to create an isolated pawn for the opponent. How would you proceed?"}, {"type": "puzzle", "source": "strategy", "num": 23, "chapter": "1) Maximize Your Pawns", "title": "Isolated Pawn (Puzzle)", "fen": "4r2r/kpp4p/p2p2p1/5n2/3P4/1PPB2P1/P2K3P/4R2R w - - 0 1", "moves": ["Bxf5", "gxf5", "Rxe8", "Rxe8", "Rf1", "Rf8", "Rf4", "Kb6", "g4"], "moveComments": {"0": "Forcing Black to get an isolated pawn.", "1": "Just like that! Both the f and h pawns are isolated for Black.", "4": "Yes, we put pressure on the weak pawn right away. Notice how the [f5]-pawn is the first one to get targeted because it is on an open file. So, the white rook has it easier to get to it.", "5": "Again, weak pawns cannot be defended by friendly pawns. That's why the poor black rook has to come to the rescue.", "6": "Multipurpose move! Now the white rook can transfer to [h4], from where it hits the other isolated pawn: [h7].", "8": "Here you can see it better. Now the [f5]-pawn cannot advance."}, "moveNags": {}, "intro": "Let's use this position as an exercise. What should White play in order to ruin Black's pawn structure?"}, {"type": "text", "source": "strategy", "chapter": "1) Maximize Your Pawns", "title": "Doubled Pawns (Puzzle 1)", "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 24, "chapter": "1) Maximize Your Pawns", "title": "Doubled Pawns (Puzzle 2)", "fen": "r1b1r3/1pp2kpp/4pn2/p2p4/P7/1PP2N1P/1BP2PP1/3R1RK1 w - - 0 1", "moves": ["c4", "dxc4", "Ne5+", "Kg8", "Nxc4"], "moveComments": {"4": "White now enjoys a healthier pawn structure."}, "moveNags": {}, "intro": "What would you play as White?"}, {"type": "puzzle", "source": "strategy", "num": 25, "chapter": "1) Maximize Your Pawns", "title": "Backward Pawns (Puzzle)", "fen": "2rq1rk1/pp2bppp/2npbn2/4p3/4P3/1P4P1/PBP1NPBP/RN1Q1RK1 w - - 0 1", "moves": ["c4"], "moveComments": {"0": "Easy! Black already has a backward [d6]-pawn, and we have to fix it in place."}, "moveNags": {}, "intro": "What would you play here as White?"}, {"type": "puzzle", "source": "strategy", "num": 26, "chapter": "1) Maximize Your Pawns", "title": "Playing With Hanging Pawns (Practice)", "fen": "2rqr1k1/pb2bppp/1pn1pn2/3p4/2PP4/1PNB1N2/PB2QPPP/2RR2K1 b - - 0 13", "moves": ["dxc4", "bxc4", "Qc7", "d5", "exd5", "Nxd5"], "moveComments": {"0": "Now White has to pick between an isolated pawn on d4 after Bxc4 and hanging pawns after 14.bxc4 . What would you choose?", "1": "Say hello to the hanging pawns! What should White aim for?a position their pieces in a way that threatens to create and support a passed pawn;b place a knight on [e5] and prepare an attack with [f4]-[f5];c push the a-pawn to provoke weaknesses — after all, [a2] is isolated and White should be happy to trade it;d avoid pushing the hanging pawns without good reason;e if one of the pawns advances, try to bring the other alongside it promptly to avoid leaving a backward pawn and the weaknesses associated with it.", "3": "With the black queen on the same file as our [c1]-rook, it only makes sense to open up lines by striking the center. This move fights for the initiative and could create a passed pawn for White.", "4": "That was not the way to handle the position.", "5": "Knights love to be in the center, and it's best when a pawn protects them."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 27, "chapter": "1) Maximize Your Pawns", "title": "Hanging Pawns (Puzzle)", "fen": "b2qr2k/p2r1ppp/1p2p3/8/2PP3n/3B1P2/PB3QPP/R3R1K1 w - - 0 1", "moves": ["d5", "exd5", "Rxe8+"], "moveComments": {"0": "Indeed! White opens up lines to attack with their active pieces.", "2": "Deflecting the black queen from protecting their knight."}, "moveNags": {}, "intro": "Should White stick to the rule ‘avoid pushing the hanging pawns without good reason'? Or is it now the right moment to advance the d-pawn? Try to visualize the continuations after: 1 1.d5 e5 2 1.d5 exd5 Hint: consider the whole board. Which pieces are attacking, which are defending, and is there any loose piece?"}, {"type": "puzzle", "source": "strategy", "num": 28, "chapter": "1) Maximize Your Pawns", "title": "Playing Against Hanging Pawns: (Practice 1)", "fen": "rnr3k1/p3qpp1/1p2b2p/1Bpp4/3P4/Q3PN2/PP3PPP/2R1K2R b K - 0 14", "moves": ["a6", "dxc5", "bxc5", "O-O"], "moveComments": {"0": "Black Spassky is not truly threatening our bishop with his last move. Besides the alignment on the a-file, we can also notice one on the c-file, with potential checks and back rank issues, and, last but not least, another on the [a3]-[f8] diagonal. What should you Fischer play?", "1": "It happened!", "2": "Say hello to the hanging pawns and their isolated friend from [a6]. When playing against hanging pawns, we keep the following ideas in mind: a Keep them from advancing effectively. b If they advance, be ready to block them, especially the one that is passed. c Put pressure on them so that our opponent's pieces are tied down to their defense. d Try to strike with pawns; in this position [e4] or [b4]. That way, we force them to create weaknesses.", "3": "Securing the king before returning to battle."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 29, "chapter": "1) Maximize Your Pawns", "title": "Playing Against Hanging Pawns: (Practice 2)", "fen": "1nr3k1/r3qpp1/p3b2p/2pp4/8/Q3PN2/PP2BPPP/2R2RK1 b - - 0 17", "moves": ["Nd7", "Nd4", "Qf8", "Nxe6", "fxe6", "e4", "d4", "f4"], "moveComments": {"0": "How can we take advantage of Black's hanging pawns in this position?", "1": "Fancy, I know!", "3": "Best by test is to capture here.", "5": "The thematic break to weaken the hanging pawns.", "6": "Notice how the [c4]-square becomes available for the white pieces right away.", "7": "Allowing [e5] and [Qh3]."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 30, "chapter": "2) Maximize Your Knights", "title": "Identifying An Outpost", "fen": "r2r2k1/pp2bppp/3pq3/4p3/4P3/P3NP2/1P1Q2PP/1K1R3R w - - 0 1", "moves": ["Nd5"], "moveComments": {"0": "Once the knight lands on its outpost, we have to make sure it is protected. In this case, the [e4]-pawn takes care of that. Now it's safe to say no enemy piece can ever make our knight go away. Of course, the black rooks and queen could attack our knight, but we wouldn't mind that. Why do knights like to be in the center? 🔹From the center, knights exert pressure on key areas and could easily transfer to the kingside or queenside as needed. 🔹Also, remember that knights control more squares when placed in the center compared to when they are on the edge. 🔹Finally, it's important to mention that a knight that is protected and centralized could be more valuable than a rook. ➢ Look for weak squares in the opponent’s camp most often between the fourth and seventh ranks as these make the best outposts for your pieces. Revisit the concept of an outpost."}, "moveNags": {}, "intro": "In general, knights are best when: 🔹they are on an outpost; 🔹they are protected ideally by a pawn; 🔹they are in the center. — So, what is an outpost? — Well, an outpost is a weak square. — Okay. And what is a weak square? — A weak square is a square that pawns cannot protect. For example, notice how none of the black pawns can protect the [d5]-square in this position. Black's e-pawn is advanced while their c-pawn is gone. That's why the white knight would love to land on [d5]: it could settle there permanently. — Now, what about [f5]? Is it a weak square, too? — Not really! The moment our knight moves to [f5], the [g7]-pawn can move to [g6] and threaten it. That's why we don't consider [f5] an outpost."}, {"type": "puzzle", "source": "strategy", "num": 31, "chapter": "2) Maximize Your Knights", "title": "Securing An Outpost (Practice)", "fen": "r4rk1/pp2bppp/3p1n2/4pPB1/2q1P3/2N5/PPP3PP/R3QRK1 b - - 0 15", "moves": ["Rfe8", "Bxf6", "Bxf6", "Nd5"], "moveComments": {"0": "A knight belongs on an outpost if it can stay there long-term without being driven away. Before occupying the square, make sure to eliminate or neutralize the opponent’s pieces knight, bishop, or pawn that could challenge it. How can you secure an outpost in this position?", "2": "And the [d5] outpost is finally ready for the knight to land on and stay.", "3": "Here it is: the dominating knight. In the center, it controls eight squares. It also prevents the ...[d6]-[d5] push. Chess term: outpost."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 32, "chapter": "2) Maximize Your Knights", "title": "Securing An Outpost", "fen": "r4rk1/ppq1bppp/3p1n2/4pP2/2b1P3/2N1B3/PPP1B1PP/R3QRK1 w - - 0 14", "moves": ["Bxc4", "Qxc4", "Bg5", "Rfe8", "Bxf6", "Bxf6", "Nd5"], "moveComments": {"5": "And the [d5] outpost is finally ready for the knight to land on and stay.", "6": "Please, notice how it's not about what we captured. Instead, it is about what's left on the board. White ended up with a powerful minor piece while Black's bishop isn't nearly as powerful."}, "moveNags": {}, "intro": "As mentioned earlier, our knights want to land on the outpost when it's safe to stay long term. In this position, Black's light-squared bishop on [c4] and [f6]-knight are controlling our beloved [d5]-square. For that reason, White will try to eliminate them first to secure the outpost."}, {"type": "puzzle", "source": "strategy", "num": 33, "chapter": "2) Maximize Your Knights", "title": "Using the Outpost to Support an Attack", "fen": "r3r1k1/pp3ppp/3p1b2/3NpP2/2q1P3/8/PPP3PP/R3QRK1 b - - 0 17", "moves": ["Bd8", "c3", "b5", "b3", "Qc5+", "Kh1", "Rc8", "Rf3", "Kh8", "f6", "gxf6", "Qh4", "Rg8", "Nxf6", "Bxf6", "Qxf6+", "Rg7", "Rg3", "Rg8", "Rd1", "d5", "Rxg7", "Rxg7", "Rxd5", "Qf8", "Rd8"], "moveComments": {"4": "Check.", "7": "After this rook lift, White will coordinate their pieces to build a mating net, because having a powerful knight on an outpost is not enough to win by itself. Here is the plan to launch the attack: 🔹 the queen will move to the h-file;🔹 the [f3]-rook will go to [g3] or [h3];🔹 and, before these maneuvers, using the knight’s support, the f-pawn will be pushed to [f6] to expose the black king Please note that move 8.f6 would have been stronger here, but in this game, White played it in the next turn.", "8": "A mistake. However, Black was already in bad shape here regardless.", "9": "Thank you, Mr. Knight, for the support!", "11": "Threatening [Rf3] and [Qxh7]#", "17": "The [g7]-rook is pinned. It needs support, or mate will follow.", "19": "Attacking Black's backward pawn.", "23": "The rook is threatening mate.", "25": "And Black is lost. Again, this position is so essential that you will see it once more in future chapters. In the game Vasily Smyslov – Iosif Rudakovsky, Moscow, USSR Championship 1945, that you can profit from studying, the move 24...Rg7 was played."}, "moveNags": {"16": ["$7"]}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 34, "chapter": "2) Maximize Your Knights", "title": "Using the Outpost to Support an Attack (Practice)", "fen": "2rbr1k1/p4ppp/3p4/1pqNpP2/4P3/1PP2R2/P5PP/R3Q2K b - - 0 21", "moves": ["Kh8", "f6", "gxf6", "Qh4", "Rg8", "Nxf6", "Bxf6", "Qxf6+", "Rg7", "Rg3"], "moveComments": {"0": "Our pieces are well-developed and coordinated, and the knight on its powerful outpost tips the balance. This is the right moment to launch a deadly attack on the enemy king. What would you play to bring down Black's house of cards?", "1": "Thank you, Mr. Knight, for the support!", "3": "Threatening [Rf3] and [Qxh7]#.", "8": "The only legal move.", "9": "The [g7]-rook is pinned. It needs support, or mate will follow."}, "moveNags": {"8": ["$7"]}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 35, "chapter": "2) Maximize Your Knights", "title": "Knight Outpost (Puzzle)", "fen": "1r3b2/3q2k1/R2p1p2/1p1Qp1pp/1P2P3/3P2PP/3N1PK1/8 w - - 0 1", "moves": ["Nf1"], "moveComments": {"0": "And even though it looks slow, Black cannot stop the knight from getting to [f5]."}, "moveNags": {}, "intro": "You are in charge of the white pieces, and your job is to identify an outpost for your knight as well as the fastest way to occupy it."}, {"type": "puzzle", "source": "strategy", "num": 36, "chapter": "3) Maximize Your Bishops", "title": "Maximize Your Bishops Power", "fen": "r2qrb1k/1b4p1/p2p1n1p/3P1p2/Pnp1P3/4R2P/3N1PPN/1BBQR1K1 w - - 0 1", "moves": ["Bb2"], "moveComments": {"0": "From the game Garry Kasparov – Anatoly Karpov, Lyon/New York, World Championship Match 1990."}, "moveNags": {}, "intro": "Bishops are long-range pieces. They can attack the enemy from the safety of our own territory. Some of my students call them 'snipers' because, again, they work well from a long distance, but they are not so good in close combat. Some ideas to make bishops better are: 🔹 Open the position or at least avoid positions where pawns are too locked knights are better in closed positions. 🔹 Move your pawns to opposite-colored squares your own soldiers shouldn't be blocking your snipers. 🔹 Put the bishops in long diagonal
