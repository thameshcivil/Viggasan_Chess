s so they have more scope like the long diagonals [a1]-[h8] and [h1]-[a8]. 🔹 Coordinate bishops with rooks, as they're great together. Also, a bishop and a queen can create a powerful battery, with the queen in front supported by the bishop."}, {"type": "text", "source": "strategy", "chapter": "3) Maximize Your Bishops", "title": "Anatoly Karpov – Joël Lautier, Biel 1992", "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 37, "chapter": "3) Maximize Your Bishops", "title": "Karpov – Lautier, 1992 (Practice 1)", "fen": "3rr1k1/pb3ppp/1ppqp3/4P3/2P1Q3/7P/PP2BPP1/R2R2K1 b - - 0 17", "moves": ["Qc7", "Bf3"], "moveComments": {"0": "Karpov has a fixed pawn on [e5], a dark square, while Black has a fixed pawn on [e6], a light square; and that's not good for Black's bishop. What threat can you create?", "1": "Very important move! The idea is to prevent Black from playing ...[c5] since that would turn their bishop into a beast."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 38, "chapter": "3) Maximize Your Bishops", "title": "Karpov – Lautier, 1992 (Practice 2)", "fen": "b5k1/p4ppp/qpp1p3/4P3/1PPQ4/5B1P/5PPK/8 b - - 0 26", "moves": ["Qc8", "c5", "bxc5", "Qxc5"], "moveComments": {"0": "White was threatening a back-rank mate, so Lautier had to reposition his queen to [c8]. This, to say the least, makes the poor piece incredibly passive. What comes next? How do we bury the [a8]-bishop and offer better prospects for our light-squared bishop?", "1": "This was Karpov's idea! White is following the same strategy of fixing the black pawns on light squares, making their bishop sad. In contrast, because the white pawns are on dark squares, the white bishop is extremely powerful."}, "moveNags": {"1": ["$1"]}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 39, "chapter": "3) Maximize Your Bishops", "title": "Karpov – Lautier, 1992 (Practice 3)", "fen": "b5k1/1Q3p2/p1p1p1p1/4P2p/1P5P/5BK1/5PP1/8 b - - 0 32", "moves": ["Bxb7", "Kf4", "Kf8", "Kg5", "Ke7", "Be4"], "moveComments": {"0": "How do you coordinate an attack here?", "1": "It's the endgame, and kings must be activated!", "4": "Black forgets to control [h7].", "5": "So, what's going on? 🔹 White is a pawn down, but their king and bishop are more active. 🔹 White also has a better pawn structure. Black's pawn majority on the queenside can't really move. 🔹 Finally, White might be able to get a passed pawn on the kingside."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 40, "chapter": "3) Maximize Your Bishops", "title": "The Bishop Pair", "fen": "8/6p1/b4p2/p2pkP2/3b2P1/3P3N/P1B3K1/8 b - - 0 1", "moves": ["Be3"], "moveComments": {"0": "From the game Siegbert Tarrasch – Akiba Rubinstein, San Sebastian 1912."}, "moveNags": {"0": ["$1"]}, "intro": "The bishop pair is not just one bishop and then another bishop. When they are able to work as a team, their power increases significantly. We want to control as many squares as possible with them and target enemy pieces. Even down a pawn, the bishop pair can offer compensation as they are considered to be worth 7 points in open positions."}, {"type": "text", "source": "strategy", "chapter": "3) Maximize Your Bishops", "title": "Sergei Tiviakov – Garry Kasparov, Wijk aan Zee 2001", "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 41, "chapter": "3) Maximize Your Bishops", "title": "Tiviakov – Kasparov, 2001 (Practice)", "fen": "4rr1k/pb1q2bp/1pnpp3/2p2p2/5P1B/1PNP1NQ1/1PP1R1PP/4R1K1 w - - 0 19", "moves": ["Qh3", "Nd4", "Nxd4", "Bxd4+"], "moveComments": {"0": "How can you demonstrate the full power of the bishop pair on the board?", "1": "A multi-threat move: it can win the exchange or weaken White's castle.", "2": "This is the best response.", "3": "These bishops look amazing, aiming at the enemy king."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 42, "chapter": "3) Maximize Your Bishops", "title": "Opposite-Colored Bishops", "fen": "2B5/1Pk5/6Kp/6PP/8/8/8/2b5 b - - 0 1", "moves": ["Bxg5"], "moveComments": {"0": "If you like, see the definition of a fortress."}, "moveNags": {}, "intro": "In my mind, opposite-colored bishops + endgame = draw. The main reason behind it is that such bishops never meet, which means the defensive side can create fortresses blocking the passed pawns, and there is not much the strong side can do about it. Most positions with a pawn down are easy to defend. With two pawns down, positions are still defendable. Even three pawns might not be enough sometimes. One of the most important factors when evaluating the endgame is the distance between the passed pawns. The greater the distance between passed pawns, the stronger the winning chances for the dominant side."}, {"type": "puzzle", "source": "strategy", "num": 43, "chapter": "3) Maximize Your Bishops", "title": "Vladimir Malakhov – Alexey Dreev, New Delhi/Teheran FIDE-Wch k.o.", "fen": "8/4k2p/1b4p1/8/5P2/1P3K1P/8/5B2 w - - 0 52", "moves": ["Ke4", "Kd6", "Bc4", "h6", "Bf7", "g5", "f5", "Ke7", "Bh5", "Ba5", "Kd5", "Kf6", "Bg6", "h5", "Ke4", "g4", "hxg4", "hxg4", "Kf4", "Bb4", "Kxg4", "Bd6", "Be8", "Ke7", "Bb5", "Kf6", "Bc4"], "moveComments": {"0": "An active king is important in every endgame.", "3": "Moving pawns to safer squares. However, now White will create another passed pawn on the f-file", "6": "White has created a second passed pawn, and they are pretty far apart. Black can still defend, but they need to play very accurately.", "12": "Black has a fortress, and controlling both passed pawns b and f doesn't seem to be a problem for now. However, they were not able to deal with the pressure and made important mistakes from now on.", "17": "Decisive mistake.", "26": "Black resigns. White’s plan is to bring the king to the queenside to support the b-pawn. Black cannot effectively stop both passed pawns. If they were closer together, the Black king would have an easier time dealing with them. Take a look at the complete game here."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 44, "chapter": "3) Maximize Your Bishops", "title": "Malakhov – Dreev, 2000 (Practice 1)", "fen": "8/4k2p/1b4p1/8/4KP2/1P5P/8/5B2 b - - 0 52", "moves": ["Kd6", "Bc4", "h6", "Bf7", "g5", "f5"], "moveComments": {"0": "How to show that opposite-colored bishops don’t always lead to a draw in the endgame? Which weakness do you go after, and how should you maneuver?", "1": "That’s it! We are going to threaten Black’s pawns on the kingside.", "5": "White has created a second passed pawn, and they are pretty far apart. Black can still defend, but they need to play very accurately."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 45, "chapter": "3) Maximize Your Bishops", "title": "Malakhov – Dreev, 2000 (Practice 2)", "fen": "8/4k3/7p/b2K1PpB/8/1P5P/8/8 b - - 0 57", "moves": ["Kf6", "Bg6"], "moveComments": {"0": "The opponent’s king is attacking the [f5]-pawn. How should you react?", "1": "That’s it! Note that there are other equally good plans to handle this position. But these scenarios leave less chance for the opponent to make a mistake..."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 46, "chapter": "3) Maximize Your Bishops", "title": "Magnus Carlsen – Ernesto Inarkiev, Baku FIDE GP", "fen": "3r1rk1/2q2pb1/p6p/1pp3p1/4Pp2/2P2B1P/PP1N1PP1/RQ2R1K1 b - - 0 25", "moves": ["Rxd2", "e5", "Bxe5", "Qf5", "f6", "Rad1", "Rfd8", "Qe6+", "Kg7", "Qxa6", "b4", "Rxd2", "Rxd2", "Rd1", "bxc3", "bxc3", "Rxd1+", "Bxd1", "c4", "Be2", "Bxc3", "Bxc4", "Be5", "Qe6", "Qd8", "Qf7+", "Kh8", "f3", "Bd6", "a4", "Bb4", "Kh2", "Qf8", "Qg6", "Be1", "Bd3", "f5", "a5", "Bg3+", "Kh1", "Qg7", "Qe8+", "Qg8", "Qe5+", "Qg7", "Qb8+", "Qg8", "Qb6", "Qd5", "Qxh6+", "Kg8", "Qxg5+", "Kf7", "Qxf5+", "Qxf5", "Bxf5", "Bf2", "g4", "fxg3", "f4", "Kf6", "Be4", "Be3", "a6"], "moveComments": {"0": "With opposite-colored bishops in the middlegame, the player who takes the initiative has great chances to win, as the defending bishop can't stop threats created by the enemy bishop. Since these bishops operate on different color complexes, they can't counter each other. Opposite-colored bishops can amplify attacking chances, especially when queens or other major pieces are on the board. The attacking side can focus on exploiting weaknesses on the squares of their bishop’s color. This often leads to powerful attacks.", "1": "Beautiful move! Carlsen loses a pawn, but he also opens his bishop and queen to play on the light squares.", "4": "This creates new weaknesses on the light squares.", "9": "Time to collect some treats!", "25": "Just like that! The white queen is in, and the black bishop can't do anything to defend the light squares.", "29": "Passed pawn! You should be familiar with this element by now.", "33": "White is not interested in trading queens since the opposite-colored bishops' endgame would be a draw.", "43": "White won't be able to mate, but they can collect a few pawns to make the endgame a win.", "47": "The a-pawn is advancing now very quickly and supported by the white queen.", "48": "Black tries to create chaos, but it is too late.", "55": "Three pawns are too much.", "58": "Black gets a passed pawn, but it is very easy to control.", "63": "Three passed pawns, and they’re well separated. Black cannot stop all of them in the Endgame/King Session, we dive deeper into this kind of position. Check out the full game here."}, "moveNags": {"1": ["$1"], "4": ["$6"]}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 47, "chapter": "3) Maximize Your Bishops", "title": "Carlsen – Inarkiev, 2008 (Practice 1)", "fen": "3r1rk1/2q2pb1/p6p/1pp3p1/4Pp2/2P2B1P/PP1N1PP1/RQ2R1K1 b - - 0 1", "moves": ["Rxd2", "e5", "Bxe5", "Qf5"], "moveComments": {"0": "An opponent's rook on your 2nd rank is usually a synonym for danger, but the capture on [d2] doesn’t faze Magnus. What short-term plan does he have in mind?", "1": "Beautiful move! Carlsen loses a pawn, but he also opens his bishop and queen to play on the light squares.", "3": "Threatening the opponent's bishop. In the game, it led to the inaccuracy 27...f6 , creating new weaknesses on the light squares, when the retreat 27...Bg7 could have maintained an equal position."}, "moveNags": {"1": ["$1"]}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 48, "chapter": "3) Maximize Your Bishops", "title": "Carlsen – Inarkiev, 2008 (Practice 2)", "fen": "8/2q3k1/Q4p1p/4b1p1/2p2p2/2P4P/P3BPP1/6K1 b - - 0 35", "moves": ["Bxc3", "Bxc4", "Be5", "Qe6", "Qd8", "Qf7+"], "moveComments": {"0": "The next move is quite obvious, but can you visualize a few moves ahead how we can coordinate our two remaining pieces on the light squares?", "3": "Threatening [Qg8]#.", "5": "Just like that! The white queen is in, and the black bishop can't do anything to defend the light squares."}, "moveNags": {}, "intro": ""}, {"type": "text", "source": "strategy", "chapter": "3) Maximize Your Bishops", "title": "Knight vs Bishop", "intro": "Knights and bishops are worth about the same 3 points, although some books say the bishop is worth slightly more than 3 points. The truth is that they are very different pieces, and depending on the position, one can be significantly better. Let's analyze some key points. Advantages of the bishops: 🔹 They can control long diagonals and cover great distances in one move, making them ideal for open positions. 🔹 The bishop pair can be particularly overwhelming as they complement each other by controlling squares of both colors. The main limitation of a lone bishop is that it can only influence squares of one color. 🔹 Bishops tend to be stronger in endgames with pawns on both sides of the board because they can move quickly across large distances, protecting their own pawns and controlling enemy pawns. Advantages of the knights: 🔹 They can jump over other pieces, allowing them to navigate crowded positions easily this is the reason they are good in blocked positions. 🔹 Unlike bishops, knights can access any square on the board regardless of its color, giving them an edge in closed positions. 🔹 Knights are better in endgames with pawns concentrated on one side of the board, where their ability to dominate key squares and fork pieces is more effective."}, {"type": "puzzle", "source": "strategy", "num": 49, "chapter": "3) Maximize Your Bishops", "title": "Alexander Alekhine – Hans Johner, Zürich 1934", "fen": "6k1/2p3qn/1p1p1p2/3P1P1Q/2P1P1p1/5p2/PPB2P2/5K2 b - - 0 43", "moves": ["Nf8", "e5", "dxe5", "d6", "c5", "Be4", "Qd7", "Qh6"], "moveComments": {"1": "What's closed can be opened. Great move! There is compensation for losing the pawn: 🔹 the bishop gets improved; 🔹 the outpost on [e5] for the black knight disappears.", "3": "Similar idea in place. We should add the fact that the safety of the black king also plays an important role, since it is a little exposed, and now, with the white bishop and queen working together through long open lines, there will be many threats.", "7": "White is winning as Black cannot stop [Bd5]. You can see the full game here."}, "moveNags": {"3": ["$1"]}, "intro": "This position is almost closed, and the white bishop doesn't look good. White has an extra pawn, but the one on [e4] is useless. Black's knight should be better here, especially because of the [e5] outpost. However, Alekhine found a way!"}, {"type": "puzzle", "source": "strategy", "num": 50, "chapter": "3) Maximize Your Bishops", "title": "Vasily Smyslov – Iosif Rudakovsky, Moscow 1945", "fen": "r4rk1/pp2bppp/3p1n2/4pP2/2q1P3/2N1B3/PPP3PP/R3QRK1 w - - 0 15", "moves": ["Bg5", "Rfe8", "Bxf6", "Bxf6", "Nd5"], "moveComments": {"3": "This is the idea. The white knight is just better than the black bishop. Not only do some black pawns block the bishop, but there’s also a beautiful outpost on [d5]. This is the classical scenario of good knight vs bad bishop.", "4": "And we already know what happens in this game as we covered it when learning about outposts. Examine the full game."}, "moveNags": {}, "intro": "I hope you remember this position from earlier in the course. This position is not completely blocked. However, some key black pawns, like [d6] and [e5], are fixed on the same color as their bishop. Smyslov understands this and simplifies the game accordingly. And I'm sure you will find the correct moves."}, {"type": "puzzle", "source": "strategy", "num": 51, "chapter": "4) Maximize Your Rooks", "title": "Maximize Rooks' Power", "fen": "r1q2rk1/pp2npbp/2p3p1/4p3/P3P3/1B3NP1/1PP1QPKP/R3R3 w - - 0 1", "moves": ["Rad1"], "moveComments": {}, "moveNags": {}, "intro": "Rooks are the most powerful pieces on the board after the queen. Like bishops, they are long-range pieces. Here are a few principles to help you make the most of them: 🔹 Place your rooks on open files (files without pawns) where they have unrestricted movement and can put pressure on the other side of the board. 🔹 Rooks are very strong on certain ranks, like the 6th, the 8th back rank, and especially the 7th rank, from where they can attack pawns and cut off the enemy king. The main reason we want to control open files is to infiltrate important strategic ranks. 🔹 Rooks work better when they coordinate with each other also sometimes with the queen. Doubling your rooks on a file or rank creates immense and sometimes decisive pressure. 🔹 Aim to connect your rooks early in the game by completing development and castling."}, {"type": "puzzle", "source": "strategy", "num": 52, "chapter": "4) Maximize Your Rooks", "title": "Aron Nimzowitsch – José Raúl Capablanca, New York 1927", "fen": "2rr1bk1/p4ppp/1p2p3/8/1P1B4/Pq2P1P1/4QP1P/R3R1K1 b - - 0 25", "moves": ["Rc2", "Qa6", "e5", "Bxe5", "Rdd2", "Qb7", "Rxf2", "g4", "Qe6", "Bg3", "Rxh2", "Qf3", "Rhg2+", "Qxg2", "Rxg2+", "Kxg2", "Qxg4", "Rad1", "h5", "Rd4", "Qg5", "Kh2", "a5", "Re2", "axb4", "axb4", "Be7", "Re4", "Bf6", "Rf2", "Qd5", "Re8+", "Kh7"], "moveComments": {"0": "Our rooks' first mission: getting to the 7th rank. I understand [c2] is on the 2nd rank, but from Black's perspective, it is the 7th enemy's territory.", "2": "What's better than a rook on the 7th rank? Two rooks on the seventh rank. That's why Black is happy to give up their e-pawn.", "4": "White's pressure is decisive now.", "8": "Bringing the queen from the queenside to the kingside. Checkmate must be in the air!", "16": "The rest is too easy for a genius like Capablanca.", "32": "And White resigns. Go through the complete game."}, "moveNags": {"10": ["$1"]}, "intro": "Black's rooks are controlling the only two open files on the board, but if we don't use them, it's like we don't have them."}, {"type": "puzzle", "source": "strategy", "num": 53, "chapter": "4) Maximize Your Rooks", "title": "Nimzowitsch – Capablanca, 1927 (Practice 1)", "fen": "2rr1bk1/p4ppp/1p2p3/8/1P1B4/Pq2P1P1/4QP1P/R3R1K1 b - - 0 25", "moves": ["Rc2", "Qa6", "e5", "Bxe5", "Rdd2"], "moveComments": {"0": "Our rooks' first mission: getting to the 7th rank. I understand [c2] is on the 2nd rank, but from Black's perspective, it is the 7th enemy's territory.", "1": "This escape from the queen allows us to put our plan into action.", "2": "What's better than a rook on the 7th rank? Two rooks on the seventh rank. That's why Black is happy to give up their e-pawn.", "4": "White's pressure is decisive now."}, "moveNags": {}, "intro": "Black's rooks are controlling the only two open files on the board, but if we don't use them, it's like we don't have them. Try to visualize: first, your move on the c-file; then White’s reply; and finally, our chance to invade the d-file."}, {"type": "puzzle", "source": "strategy", "num": 54, "chapter": "4) Maximize Your Rooks", "title": "Nimzowitsch – Capablanca, 1927 (Practice 2)", "fen": "5bk1/pQ3ppp/1p2q3/4B3/1P4P1/P3P3/2r2r1P/R3R1K1 w - - 0 30", "moves": ["Bg3", "Rxh2", "Qf3", "Rhg2+", "Qxg2", "Rxg2+", "Kxg2", "Qxg4"], "moveComments": {"0": "Nimzowitsch decided that the best was to control the g2-square and played 28.Qb7 . Capablanca did not need to be asked twice, he took: 28...Rxf2 29.g4 Qe6 , bringing the queen from the queenside to the kingside. Checkmate must be in the air! 30.Bg3 . With his last move, Nimzowitsch built a kind of fortress. Can you find Capablanca's killer move?", "1": "Yes! The most forcing.", "7": "The rest is too easy for a genius like Capablanca."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 55, "chapter": "4) Maximize Your Rooks", "title": "Alexander Alekhine – Supico, Lisbon (blindfold simul) 1941", "fen": "rnbq1r1k/p2pNppp/1ppQ4/4P3/2BN4/P7/5PPP/2R2RK1 w - - 0 18", "moves": ["Rc3", "c5", "Ndf5", "Ba6", "Qg6", "fxg6", "Nxg6+", "hxg6", "Rh3+", "Qh4", "Rxh4#"], "moveComments": {"4": "Beautiful move! Of course, this wouldn't be possible without the previous rook lift. It was in this position that the amateur player resigned against the World Champion. Can you see why?", "8": "That's it!", "10": "What a brilliant mating combination! See the miniature."}, "moveNags": {"4": ["$3"]}, "intro": "The famous rook lift is an important maneuver to get rooks involved in some attack or pressure on a side of the board. Typically, the 3rd rank is the most suitable for this maneuver since it is closer and safer for our rook. In this example, White's advantage is overwhelming, but the rook lift over the 3rd rank is a small but crucial piece in this puzzle."}, {"type": "puzzle", "source": "strategy", "num": 56, "chapter": "4) Maximize Your Rooks", "title": "Kramnik – Andreikin, 2013 (Practice)", "fen": "8/2R2pk1/6p1/3q3p/8/6P1/5PP1/2R3K1 w - - 0 43", "moves": ["Re1", "Kh6", "Ree7"], "moveComments": {"0": "In this position, the rooks can work together and target pawns such as the one on [f7]. Likewise, the white king is safe from the queen. There's more to this puzzle than meets the eye. If we try to double the rooks along the 7th rank in another way, say with 1.Ra1 , this would allow Black counterplay by allowing the queen access to the e-file after 1...Qe4 when after 2.Raa7 Black has the saving 2...Qe1+ 3.Kh2 Qxf2 picking up a pawn and guarding [f7] at the same time. 1.Re7 is another possible solution because it prepares doubling along the 7th while also guarding the e-file.", "2": "Double rooks on the 7th rank and target weaknesses."}, "moveNags": {}, "intro": "Two rooks against one queen. To win this endgame, figure out which square the rook on [c1] should occupy to attack the black king. Before it gets there, through which square must it move?"}, {"type": "puzzle", "source": "strategy", "num": 57, "chapter": "4) Maximize Your Rooks", "title": "Vladimir Kramnik – Dmitry Andreikin, Tromsø", "fen": "8/2R2pk1/6p1/3q3p/8/6P1/5PP1/2R3K1 w - - 0 43", "moves": ["Re1", "Kh6", "Ree7", "f6", "Red7", "Qa5", "f4", "g5", "Kh2", "Kg6", "fxg5", "Kxg5", "Rh7", "f5", "Rcg7+", "Kf6", "Ra7", "Qb4", "Ra6+", "Ke5", "Rxh5", "Qb1", "Ra5+", "Kf6", "Raxf5+", "Kg6", "Rfg5+", "Kf6", "Rb5", "Qc2", "Rh6+", "Kg7", "Rbb6", "Qc5", "Rbg6+", "Kf8", "Rh7", "Qf5", "Rgg7", "Qe6", "Re7", "Qg4", "Ra7", "Kg8", "Rhg7+", "Qxg7", "Rxg7+", "Kxg7", "Kh3"], "moveComments": {"2": "Double rooks on the 7th rank and target weaknesses", "4": "This moment shows us the perfect example of when two well-coordinated rooks are stronger than a queen.", "6": "Threatening checkmate.", "20": "First target: eliminated.", "24": "Second target: eliminated. Now let's go for the king.", "25": "Needless to say that trading queen for the rooks would walk into an easy pawn endgame to win for White.", "42": "And there is nothing Black can do.", "48": "White simply needs to advance the pawns, coordinating with the king, to secure the win, paying attention to basic endgame principles, such as the opposition. You can see the full game here."}, "moveNags": {}, "intro": "Rooks vs Queen: Round 1 When it comes to point value, two rooks are better than the queen 10 vs 9. However, life is not so simple. To keep it simple, we'll say that sometimes the rooks are better, and other times the queen is better. Let me show you the only guidelines I follow. Rooks are better when: 🔹 They are well-coordinated and control open files or ranks. 🔹 They can target weaknesses: one rook captures the target as the other defends. That's something the queen cannot do.🔹 Even in closed positions, if they can dominate a key file or rank. In this position, the rooks can work together and target pawns such as the one on [f7]. Likewise, the white king is safe from the queen."}, {"type": "text", "source": "strategy", "chapter": "5) Maximize Your Queen", "title": "Maximize Queen's Power", "intro": "The queen is the most powerful piece in chess, and knowing how to use it is a must. Here are a few ideas to help you maximize the queen's power: 🔹 Centralize the queen to control more squares. This clearly improves the queen, but it's something we should only do when it is not going to be bothered in the center by enemy pieces. 🔹 Coordinate it with other pieces. The queen is so powerful that even if a little pawn aids it, it can create numerous threats. 🔹 Control open files and diagonals. Like other long-range pieces such as bishop and rook, the queen is at its best where it controls more squares open files and long diagonals. 🔹 Avoid premature development of your queen and keep it safe and undeveloped during the opening. Usually, it's in the middlegame when we start improving this piece. 🔹 If there is a passed pawn in the endgame, the queen is going to offer great support to it; sometimes helping it advance up to its promotion square."}, {"type": "puzzle", "source": "strategy", "num": 58, "chapter": "5) Maximize Your Queen", "title": "When to Trade Queens", "fen": "8/5k2/5p2/4q3/6PP/4Q2K/8/8 w - - 0 1", "moves": ["Qxe5"], "moveComments": {}, "moveNags": {}, "intro": "Trading queens is a big decision in chess, and it usually depends on your position and goals. In general: 🔹 If you're ahead in material, trading queens can help you simplify the game and move closer to a win. With fewer pieces on the board, your extra material becomes more important. 🔹 If your king is exposed, exchanging queens can make your king safer by removing dangerous attacking possibilities. 🔹 If you're behind or attacking, you usually want to keep queens on the board to create threats and keep up the pressure. So, before trading queens, ask yourself: Does this help me or my opponent?"}, {"type": "puzzle", "source": "strategy", "num": 59, "chapter": "5) Maximize Your Queen", "title": "Fabiano Caruana – Viswanathan Anand, Saint Louis (Blitz) 2018", "fen": "6k1/6p1/8/2p2q1p/2P5/2P1Q3/5PP1/6K1 w - - 0 44", "moves": ["Qd2", "Kh7", "Qd5", "Qg4", "Qxc5", "h4", "Qd4", "Qg5", "c5", "h3", "Qd3+", "Kg8", "Qxh3", "Qxc5", "Qe6+", "Kh7", "Qe4+", "g6", "c4", "Qd6", "g3"], "moveComments": {"3": "The trade of queens would improve White's pawn structure. The resulting pawn endgame should be an easy win for you at this point in the course.", "4": "White now has a passed pawn. At this point, it's just a matter of controlling the threats and checks on our kingside. With the black queen under control, White only needs to push their passed pawn.", "6": "No queens means no counterplay for Black.", "10": "Double attack.", "16": "Great technique!", "18": "Ready to play [Qd5]. This is the main takeaway for you: the queen can both protect its passed pawn and attack the black queen at the same time.", "20": "Making sure our king has a safe square. Black's only hope is to bother our king with checks. Black resigned here as there is nothing they can do to stop the passed pawn supported by the white queen. From the game Fabiano Caruana – Viswanathan Anand, Saint Louis Blitz 2018."}, "moveNags": {}, "intro": "In this game, Caruana teaches us how to maneuver with the queen in an endgame and, more specifically, how great it is when coordinated with a passed pawn. White has an extra pawn, but it's doubled. They need to maneuver to attack the [c5]-pawn and eventually create a passed pawn on the queenside. Only then can White easily win."}, {"type": "puzzle", "source": "strategy", "num": 60, "chapter": "5) Maximize Your Queen", "title": "Caruana – Anand, 2018 (Practice 1)", "fen": "6k1/6p1/8/2p2q1p/2P5/2P1Q3/5PP1/6K1 w - - 0 44", "moves": ["Qd2", "Kh7", "Qd5", "Qg4", "Qxc5"], "moveComments": {"0": "Yes, this is the way!", "2": "Proposing the exchange of the queens.", "3": "The trade of queens would improve White's pawn structure. The resulting pawn endgame should be an easy win for you at this point in the course.", "4": "White now has a passed pawn. At this point, it's just a matter of controlling the threats and checks on our kingside. With the black queen under control, White only needs to push their passed pawn."}, "moveNags": {}, "intro": "In this game, Caruana teaches us how to maneuver with the queen in an endgame and, more specifically, how great it is when coordinated with a passed pawn. White has an extra pawn, but it's doubled. They need to maneuver to attack the [c5]-pawn and eventually create a passed pawn on the queenside. Only then can White easily win. How can you get to the [d5]-square with your queen?"}, {"type": "puzzle", "source": "strategy", "num": 61, "chapter": "5) Maximize Your Queen", "title": "Caruana – Anand, 2018 (Practice 2)", "fen": "8/6pk/8/2q5/4Q3/2P5/5PP1/6K1 b - - 0 52", "moves": ["g6", "c4", "Qd6", "g3"], "moveComments": {"0": "Several moves are equally strong. Try advancing as Caruana would.", "1": "Ready to play [Qd5]. This is the main takeaway for you: the queen can both protect its passed pawn and attack the black queen at the same time.", "3": "Making sure our king has a safe square. Black's only hope is to bother our king with checks. Black resigned here, as there is nothing they can do to stop the passed pawn supported by the white queen. ✅ 35.Qd5 is a good move too."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 62, "chapter": "5) Maximize Your Queen", "title": "Hikaru Nakamura – Boris Gelfand, Paris FIDE GP 2013", "fen": "8/3Rpp1k/7p/p4P2/2P3pP/6q1/2P1K1P1/6R1 b - - 0 41", "moves": ["Qe5+", "Kf2", "Qxf5+", "Ke2", "Qxd7"], "moveComments": {"0": "White resigned, since the queen will get one of the rooks no matter what.", "4": "With a queen against a rook, Black should win this endgame easily. Check out the whole game here."}, "moveNags": {}, "intro": "Queen vs Rooks: Round 2 Queen is better than two rooks when: 🔹 The position is open, allowing the queen to move a long distance quickly.🔹 The rooks are not able to connect and work together. As you can see, the rooks are not connected. In fact, they are not protected by anything, and the white king is exposed. What else can the black queen ask for? Also, White has weak pawns all over the board. Black is clearly better."}, {"type": "text", "source": "strategy", "chapter": "6) Maximize Your King", "title": "Maximize King's Power", "intro": "As a general rule, we only activate our king in the endgame. During the opening and middlegame, many pieces are still on the board, so bringing the king out early can be very risky and may lead to checkmate. There are exceptions, of course, such as a beautiful game played by Short, which we’ll briefly explore in this chapter. In the endgame, however, we need our king actively involved. With fewer pieces on the board, the chances of getting mated are significantly reduced. So, the endgame is the right moment to centralize our king. We use our monarch to control key squares, shoulder the enemy king away, and more. Finally, it helps us either attack enemy pawns or defend our own."}, {"type": "puzzle", "source": "strategy", "num": 63, "chapter": "6) Maximize Your King", "title": "Nigel Short – Jan Timman, Tilburg 1991", "fen": "4rrk1/1bpR1p2/1pq1pQp1/p3P2p/P1PR3P/5N2/2P2PP1/6K1 w - - 0 31", "moves": ["Kh2", "Rc8", "Kg3", "Rce8", "Kf4", "Bc8", "Kg5"], "moveComments": {"0": "For some reason, the dark squares are totally safe for the white king. So Short uses it to support his queen. It helps that Black doesn't have their dark-squared bishop and that the center is somewhat closed."}, "moveNags": {}, "intro": "Every rule in chess is flexible and here we have a beautiful example. It's so rare, but I could not resist."}, {"type": "puzzle", "source": "strategy", "num": 64, "chapter": "6) Maximize Your King", "title": "Tigran Petrosian – Robert Wade, Leipzig 1960", "fen": "8/p3k1n1/1p1p4/7p/4PN2/4K3/PP4P1/8 w - - 0 41", "moves": ["Kd4", "Kf6", "Kd5", "Kg5", "Ne2", "Ne8", "Kc6", "Nf6", "Kb7", "Nxe4", "Kxa7", "Kf5", "Kxb6", "Ke5", "a4", "d5", "a5", "d4", "Nxd4", "Kxd4", "Kc6", "Nc5", "b4", "Nd3", "Kb5", "Ke5", "a6", "Nxb4", "Kxb4"], "moveComments": {"4": "The white knight and pawns create a wall to keep the enemy king away.", "12": "Automatically, White gets two connected passed pawns on the queenside. To make things even better, the white king is ready to help them promote while the enemy king is on the other side of the board.", "18": "Happy to sacrifice the knight, knowing that the two passed pawns on the queenside are unstoppable.", "28": "Black resigns. By now, I hope this endgame is easy for you to convert as White. Go through the complete game."}, "moveNags": {}, "intro": "In this endgame, we have equal material and similar pawn structure. The white knight is slightly more active, but what really decides the game is the more centralized position of the white king. Such a small positional detail allowed White to convert."}, {"type": "puzzle", "source": "strategy", "num": 65, "chapter": "6) Maximize Your King", "title": "Saving the Game by Stalemate", "fen": "8/6kp/3b3p/7p/7p/7p/8/7K b - - 0 1", "moves": ["Kg6", "Kg1", "Kg5", "Kh1", "Kg4", "Kg1", "Kg3", "Kh1", "h2"], "moveComments": {"8": "Draw by stalemate. I know this is simple, but we often think of stalemate as something to avoid when ahead in material. However, it can also be a powerful defensive resource."}, "moveNags": {}, "intro": "As basic as it may sound to you, the king also has the power to save the game with a stalemate. In this endgame, Black has an extra bishop and five extra pawns, but there is no win due to stalemate."}, {"type": "text", "source": "strategy", "chapter": "7) Tips for the Middlegame", "title": "The Principle of the Two Weaknesses", "intro": "One weakness in our opponent's territory is often not enough to win the game, since it's generally not difficult to defend. In such cases, we can try to create a second weakness, preferably on the other side of the board. If we do that, then the defense will be a lot more difficult. This is what we call the principle of the two weaknesses. A weakness in this case could be things like our opponent having a weak pawn or an exposed king. It could also be in the form of our own assets. For example, when we control an open file or have a passed pawn, it becomes a liability for our opponent."}, {"type": "puzzle", "source": "strategy", "num": 66, "chapter": "7) Tips for the Middlegame", "title": "Mikhail Botvinnik – Evgeny Zagoriansky, Sverdlovsk 1943", "fen": "3r2k1/3r1pp1/1p2b2p/p1qpQ3/3R4/1P2PB1P/P4PP1/3R2K1 w - - 0 25", "moves": ["g4", "Qc6", "g5", "hxg5", "Qxg5", "f6", "Qg6", "Bf7", "Qg3", "f5", "Qg5", "Qe6", "Kh1", "Qe5", "Rg1", "Rf8", "Qh6", "Rb8", "Rh4", "Kf8", "Qh8+", "Bg8", "Rf4", "Rbb7", "Rg5", "Rf7", "Qh5", "Qa1+", "Kg2", "g6", "Qxg6", "Bh7", "Qd6+", "Rfe7", "Qd8+"], "moveComments": {"0": "The second weakness will be the black king. If exposed, Black will have to defend both the [d5]-pawn 1st weakness and their king 2nd weakness.", "4": "With all of Black's pieces babysitting the [d5]-pawn, it won't be easy to defend their king.", "12": "Clears [g1] for the rook. White can alternate attacking weaknesses the [d5]-pawn and the black king.", "34": "Black resigns. It's too much for Black since their king is in trouble and both their f- and d-pawns are weak. Replay the entire game."}, "moveNags": {"0": ["$1"]}, "intro": "Black's pawn on [d5] is clearly a weakness since it is isolated, right? However, it is attacked four times and defended four times as well. For that reason, Botvinnik decided to apply the principle of the two weaknesses."}, {"type": "puzzle", "source": "strategy", "num": 67, "chapter": "7) Tips for the Middlegame", "title": "Botvinnik – Zagoriansky, 1943 (Practice)", "fen": "3r2k1/3r1pp1/1p2b2p/p1qpQ3/3R4/1P2PB1P/P4PP1/3R2K1 w - - 0 25", "moves": ["g4", "Qc6", "g5", "hxg5", "Qxg5"], "moveComments": {"0": "The second weakness will be the black king. If exposed, Black will have to defend both the [d5]-pawn 1st weakness and their king 2nd weakness.", "4": "With all of Black's pieces babysitting the [d5]-pawn, it won't be easy to defend their king."}, "moveNags": {}, "intro": "Black's pawn on [d5] is clearly a weakness since it is isolated, right? However, it is attacked four times and defended four times as well. For that reason, Botvinnik decided to apply the principle of the two weaknesses."}, {"type": "text", "source": "strategy", "chapter": "7) Tips for the Middlegame", "title": "Listening to Your Pawn Chain", "intro": "To me, pawn structures are the infrastructure of the chessboard. Pawns can open or close roads. They also dictate which pieces are good and which ones are bad, how to activate our pieces, where to put pressure, and more. Let's review some key points. 🔹 Direction of the pawn chain: In general, when there is a chain of pawns, you should play on the side where it is aiming at. That's the side where you have more space. 🔹 Attack weak pawns in your opponent's structure like backward or isolated pawns. 🔹 Where to strike: you can challenge enemy pawns and get additional activity for your pieces by breaking making contact. 🔹 Advance your pawns wisely: the more they advance, the weaker and more powerful they become at the same time. This means that you clearly want to push them so they are closer to promotion powerful. However, you also don't want to advance them prematurely because then they are more difficult to defend."}, {"type": "text", "source": "strategy", "chapter": "7) Tips for the Middlegame", "title": "Mobile Center Position", "intro": "In this position, notice how White has two connected pawns in the center while Black doesn't. White has what is known as a mobile center. These pawns control many squares in the center while staying dynamic and flexible. This means they can advance at any point, creating attacking chances and passed pawns. The player with a mobile center should: 🔹 prepare an advance at the right time; 🔹 activate pieces as they have more space in the center of the board; 🔹 not rush to advance if their pieces are not well placed. The player fighting a mobile center, on the other hand, should: 🔹 put pressure on the mobile center; 🔹 provoke the premature advancement of the mobile center; 🔹 challenge the mobile center with flank pawns like the bishop pawns. This could make them isolated or weaken key central squares."}, {"type": "puzzle", "source": "strategy", "num": 68, "chapter": "7) Tips for the Middlegame", "title": "How to Convert an Advantage", "fen": "2r5/4ppbk/p3q1pp/8/1p1P3B/2n1PN1P/PQ3PP1/2R4K w - - 0 28", "moves": ["Ra1", "a5", "Qb3", "Qxb3", "axb3", "g5", "Bg3", "a4", "Nd2", "a3", "Rc1", "e5", "d5", "a2", "Ra1", "e4", "d6", "Ra8", "Nc4", "Nb5", "Be5", "Nxd6", "Rxa2", "Rxa2", "Bxd6", "Rxf2", "Bxb4", "Rf1+", "Kh2", "Rb1"], "moveComments": {"1": "Protecting the [b4]-pawn and getting closer to promotion.", "3": "The closer we get to an endgame, the stronger the pawn majority becomes.", "7": "Sacrificing the a-pawn in order to get the b-pawn passed and closer to promotion, supported by the black knight.", "9": "Black officially has a protected passed pawn on [a3].", "11": "Another strong pawn sacrifice. This time, it aims to open the d-file for the black rook to put pressure and penetrate.", "15": "Now the bishop is helping on the great diagonal. The black pieces are perfectly placed.", "21": "Beautiful! The knight can't take since it has to defend the bishop, and the bishop can't take since White would lose the rook.", "22": "At that point, it is best to take the pawn.", "29": "White resigns since more pawns are about to fall. From the game Lajos Portisch – Vladimir Kramnik, Biel 1993."}, "moveNags": {}, "intro": "Converting an advantage can be tough! Here are a few things that help me make it: 🔹 we need to activate our pieces; 🔹 simplify at the right moment; 🔹 improve our position gradually; 🔹 avoid enemy counterplay. Let's see an example, where the legendary Kramnik has a strong knight on [c3] and a pawn majority on the queenside. The question is how to convert this into a win? Kramnik gives a masterclass about it."}, {"type": "puzzle", "source": "strategy", "num": 69, "chapter": "7) Tips for the Middlegame", "title": "How to Convert an Advantage (Practice 1)", "fen": "2r5/4ppbk/7p/p5p1/1p1P3B/1Pn1PN1P/5PP1/R6K w - - 0 31", "moves": ["Bg3", "a4", "Nd2", "a3"], "moveComments": {"0": "The [b4]-pawn’s guardian is being attacked. Should we defend it?", "1": "Sacrificing the a-pawn in order to get the b-pawn passed and closer to promotion, supported by the black knight.", "3": "Black officially has a protected passed pawn on [a3]."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 70, "chapter": "7) Tips for the Middlegame", "title": "How to Convert an Advantage (Practice 2)", "fen": "r7/5pbk/3P3p/1n4p1/1pN1p3/1P2P1BP/p4PP1/R6K w - - 0 38", "moves": ["Be5", "Nxd6", "Rxa2", "Rxa2"], "moveComments": {"0": "Find the tactics that arise from Kramnik’s plan.", "1": "Beautiful! The knight can't take since it has to defend the bishop, and the bishop can't take since White would lose the rook.", "2": "At that point, it is best to take the pawn.", "3": "Black is a full rook ahead."}, "moveNags": {}, "intro": ""}, {"type": "text", "source": "strategy", "chapter": "7) Tips for the Middlegame", "title": "Evaluating Position", "intro": "How to evaluate positions in chess? Let's talk about the most important factors to consider: 🔹 Material balance: Who has more pieces more soldiers in their army? 🔹 King safety: Whose king is better protected? 🔹 Pawn structure: Isolated, doubled, backward pawns. Also, the number of pawn groups. 🔹 Piece activity: Whose pieces are better positioned?"}, {"type": "puzzle", "source": "strategy", "num": 71, "chapter": "7) Tips for the Middlegame", "title": "Formulate a Plan", "fen": "r4rk1/ppp2p2/3b3p/2p1p1p1/4P3/3P1PBP/PPP2P2/R4RK1 b - - 0 15", "moves": ["f6", "Kg2", "a5", "a4", "Kf7", "Rh1", "Ke6", "h4", "Rfb8", "hxg5", "hxg5", "b3", "c6", "Ra2", "b5", "Rha1", "c4", "axb5", "cxb3", "cxb3", "Rxb5", "Ra4", "Rxb3", "d4", "Rb5", "Rc4", "Rb4", "Rxc6", "Rxd4"], "moveComments": {"6": "King activation is complete!", "7": "White tries to free their bishop, but Black doesn't have to give in. With that said, it's important to be aware of the enemy's plans.", "8": "Capablanca focuses on the opposite side instead because he has more pieces there.", "11": "Step 2.", "15": "If you split the board in half right now left side vs right side, it's easy to see how Black has three attackers vs two defenders on the queenside. This represents a huge advantage, of course.", "16": "The final step is in motion. Time to attack!", "28": "White, being practically a bishop down, resigns in view of Black’s passed pawn. From the game William Winter – José Raúl Capablanca, Hastings 1919."}, "moveNags": {}, "intro": "How to formulate a plan in chess? First step is to evaluate the position properly: 🔹 identify strengths and weaknesses for you and your opponent; 🔹 be prophylactic about your opponent's plans and possible reactions or counterattacks. The best way to understand this is with an example. In this position, White's bishop is trapped. Obviously, Capablanca notices this and devises a plan to take advantage of it. 1 He will optimize his position by activating his king and rooks while keeping the enemy bishop trapped by his [e5] and [g5]-pawns. 2 He will start a pawn storm on the queenside to open up lines since he basically has an extra piece his bishop."}, {"type": "puzzle", "source": "strategy", "num": 72, "chapter": "7) Tips for the Middlegame", "title": "Formulate a Plan (Practice)", "fen": "rr6/1pp5/3bkp2/p1p1p1p1/P3P3/3P1PB1/1PP2PK1/R6R w - - 0 21", "moves": ["b3", "c6", "Ra2", "b5", "Rha1", "c4", "axb5", "cxb3", "cxb3", "Rxb5"], "moveComments": {"0": "Capablanca has more active pieces on one side of the board than the other. How did he take advantage of this imbalance?", "1": "Yes, that’s the way! The idea is to prepare the ...[b5] push.", "3": "Intending ...[c4].", "4": "If you split the board in half right now, left side vs right side, it's easy to see how Black has three attackers vs two defenders on the queenside. This represents a huge advantage, of course.", "5": "The final step is in motion. Time to attack!", "9": "Black can proceed with exchanges on the queenside and take advantage of their more active pieces note White’s doubled pawns and restricted bishop."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 73, "chapter": "7) Tips for the Middlegame", "title": "Quiet Positions", "fen": "6k1/1pr2pp1/p3bn1p/2rp4/3R4/2N3P1/PP2PPBP/3R2K1 w - - 0 27", "moves": ["h3", "h5", "a3", "g6", "e3", "Kg7", "Kh2", "Rc4", "Bf3", "b5", "Kg2", "R7c5", "Rxc4", "Rxc4", "Rd4", "Kf8", "Be2", "Rxd4", "exd4", "Ke7", "Na2", "Bc8", "Nb4", "Kd6", "f3", "Ng8", "h4", "Nh6", "Kf2", "Nf5", "Nc2", "f6", "Bd3", "g5", "Bxf5", "Bxf5", "Ne3", "Bb1", "b4", "gxh4", "Ng2", "hxg3+", "Kxg3", "Ke6", "Nf4+", "Kf5", "Nxh5", "Ke6", "Nf4+", "Kd6", "Kg4", "Bc2", "Kh5", "Bd1", "Kg6", "Ke7", "Nxd5+", "Ke6", "Nc7+", "Kd7", "Nxa6", "Bxf3", "Kxf6", "Kd6", "Kf5", "Kd5", "Kf4", "Bh1", "Ke3", "Kc4", "Nc5", "Bc6", "Nd3", "Bg2", "Ne5+", "Kc3", "Ng6", "Kc4", "Ne7", "Bb7", "Nf5", "Bg2", "Nd6+", "Kb3", "Nxb5", "Ka4", "Nd6"], "moveComments": {"6": "No rush!", "10": "Karpov has been improving slowly.", "18": "Finally, the game transitions into an endgame where Black has a bad bishop. Small details that can convert into something a bit bigger.", "19": "Kasparov centralizes his king.", "28": "At this point in the course, you should have thought of this move by yourself.", "30": "This one should be pretty obvious to you too.", "32": "How about this one? What's Karpov trying to do?", "34": "Exactly, It's not about what we capture. It's about what we leave on the board. Now Black is left with their bad bishop and White has their knight while most of their pawns are on dark squares.", "38": "White continues to fix Black's pawns on the same color as their bishop. That means the white knight can target the black pawns, but the black bishop cannot attack the white pawns.", "40": "Beautiful! With this retreating move, Karpov sacrifices a pawn temporarily.", "42": "The [h5]-pawn cannot be defended from the white king and knight working together.", "44": "Yes, the black pawns don't like that knight.", "58": "The knight is having a blast!", "82": "Another one!", "86": "It's too much, and Black resigns. From the game Anatoly Karpov – Garry Kasparov, Moscow, 1984 World Championship match."}, "moveNags": {"40": ["$3"]}, "intro": "Here are some key points to play and win quiet positions: 🔹 be patient; 🔹 improve your position slowly; 🔹 restrict your opponent's plans and counterplay;🔹 transition into favorable endgames. That's how Karpov wins this masterpiece against Kasparov. Black has an isolated queen pawn and a bad bishop. Please, notice how the fixed pawn blocks it on [d5]."}, {"type": "puzzle", "source": "strategy", "num": 74, "chapter": "7) Tips for the Middlegame", "title": "Quiet Positions (Practice 1)", "fen": "2b5/4kp2/p4np1/1p1p3p/1N1P4/P5PP/1P2BPK1/8 b - - 0 38", "moves": ["Kd6", "f3", "Ng8", "h4", "Nh6", "Kf2"], "moveComments": {"0": "Black has a bad bishop in this endgame. How can you improve your kingside?", "1": "Yes! Preventing the knight from getting a mighty outpost on [e4].", "5": "At this point in the course, you should have thought of this move by yourself."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 75, "chapter": "7) Tips for the Middlegame", "title": "Quiet Positions (Practice 2)", "fen": "8/8/p2k1p2/1p1p1bpp/3P3P/P3NPP1/1P3K2/8 b - - 0 45", "moves": ["Bb1", "b4"], "moveComments": {"0": "This bishop is annoying. Think about its color. You know, for sure, how to prevent it from attacking our pawns. Now, answer this question: on which squares should the opponent’s pawns be fixed?", "1": "Correct! White continues to fix Black's pawns on the same color as their bishop. That means the white knight can target the black pawns, but the black bishop cannot attack the white pawns."}, "moveNags": {}, "intro": ""}, {"type": "puzzle", "source": "strategy", "num": 76, "chapter": "7) Tips for the Middlegame", "title": "Quiet Positions (Practice 3)", "fen": "8/8/p2k1p2/1p1p2pp/1P1P3P/P3NPP1/5K2/1b6 b - - 0 46", "moves": ["gxh4", "Ng2"], "moveComments": {"0": "Black is threatening ...[h3] or ...[hxg3]. Now it’s your turn to find one of Karpov’s most famous moves.", "1": "Beautiful! With this retreating move, Karpov sacrifices a pawn temporarily."}, "moveNags": {"1": ["$3"]}, "intro": ""}, {"type": "text", "source": "strategy", "chapter": "7) Tips for the Middlegame", "title": "Tactics and Strategy", "intro": "Tactics is a short-term sequence to get some advantage in material or otherwise. In contrast, strategy is about long-term planning with long-term objectives. Although they are distinct concepts, they are somehow connected. Sometimes, we can use tactics short-term sequences to get a strategic advantage better pawn structure, better bishop, control of an open file, etc.. The following example is simple, but extremely illustrative:"}, {"type": "text", "source": "strategy", "chapter": "Final Test", "title": "How to Approach These Puzzles According to Your Level?", "intro": "If you enjoy challenges, calculation, and are already quite advanced, you can hide the titles by pressing the eye 👁 at the bottom right of the board when you reach the first puzzle – this will also hide the hints. If you’re still at the beginning of your chess journey, we recommend solving the exercises with the hints, as some problems can be tough. Happy solving! The Chessable team"}, {"type": "puzzle", "source": "strategy", "num": 77, "chapter": "Final Test", "title": "Mixed Exercise #1", "fen": "2rq1rk1/3nbppp/1p3n2/p1Pp4/1P1Np3/2P1P3/PB3PPP/RN1Q1RK1 w - - 0 1", "moves": ["c6", "Ne5", "b5"], "moveComments": {"0": "Automatically creating a passed pawn on [c6].", "2": "And now White has a protected passed pawn that can promote in only two steps."}, "moveNags": {}, "intro": "White’s pieces don’t look particularly well-developed, except for the knight on [d4]. But there is a way to secure their advantage. ☆ Hint: How can White 1 create a passed pawn and 2 ensure that it is protected?"}, {"type": "puzzle", "source": "strategy", "num": 78, "chapter": "Final Test", "title": "Mixed Exercise #2", "fen": "6k1/5p2/2p1P1p1/6Pp/7P/P1p2P2/5K2/8 b - - 0 1", "moves": ["f6", "gxf6", "c2", "e7", "Kf7"], "moveComments": {"0": "Now the black king can also use the [f7]-square if needed."}, "moveNags": {}, "intro": "This position is from a game where I was Black. What would you play? ☆ Hint: I had just traded major pieces on f2 with the idea of playing c2 right away. Luckily, I paused and realized White could play e7 and my king couldn't catch it."}, {"type": "puzzle", "source": "strategy", "num": 79, "chapter": "Final Test", "title": "Mixed Exercise #3", "fen": "3r2k1/pp4pp/2n1P3/2p1NpQ1/5P2/1P5P/2q3PK/8 w - - 0 1", "moves": ["Qxd8+", "Nxd8", "e7"], "moveComments": {"1": "The only legal move – even if the best move here is probably to resign...", "2": "Black cannot stop White's passed pawn from promoting on [d8] or [e8]."}, "moveNags": {"1": ["$7"]}, "intro": "What’s White’s best continuation? ☆ Hint: Find a two-move combination that ends with a pawn move."}, {"type": "puzzle", "source": "strategy", "num": 80, "chapter": "Final Test", "title": "Mixed Exercise #4", "fen": "6k1/4p3/3p2p1/1P1P2p1/6P1/1pr2P2/1R3K2/8 b - - 0 1", "moves": ["Rc2+", "Ke3", "Rxb2", "b6", "Re2+", "Kxe2", "b2"], "moveComments": {"2": "We must make room.", "4": "Yes, the only winning move!", "6": "And Black promotes first with an easy win."}, "moveNags": {}, "intro": "Keep an open mind. ☆ Hint: This is unusual – both sides have a passed pawn on the b-file. White’s pawn on [b5] is only three squares from promotion, while Black’s [b3] pawn is contested by the two rooks. In this critical position, every tempo matters. And as you know, one of the best ways to deal with tempi is by giving checks."}, {"type": "puzzle", "source": "strategy", "num": 81, "chapter": "Final Test", "title": "Mixed Exercise #5", "fen": "2q3k1/6p1/p1p2pb1/P1Q1p3/1P2P1P1/4NPK1/8/8 w - - 0 45", "moves": ["b5", "axb5", "Qb6"], "moveComments": {"0": "Indeed! Our b-pawn breaks through!", "2": "And Kramnik is ready to push the passed pawn he just created on the a-file. We only need one pawn to make it. See his full game from 2013 against Nikita Vitiugov."}, "moveNags": {}, "intro": "Can you find Kramnik’s next move as White? ☆ Hint: Your knowledge of pawn endgames will be precious in solving this puzzle."}, {"type": "puzzle", "source": "strategy", "num": 82, "chapter": "Final Test", "title": "Mixed Exercise #6", "fen": "r3r1k1/p2q1pp1/1pn1pn1p/2pp4/2PP4/P1Q1PN2/1PB2PPP/R4RK1 w - - 0 1", "moves": ["dxc5", "bxc5", "cxd5", "Qxd5", "Rfd1"], "moveComments": {"0": "It's all about weakening Black's pawn structure.", "1": "Now you can clearly see how, even though Black replaced their [c5]-pawn, it is not protected by anything.", "2": "Now the [c5]-pawn is isolated weak and the white queen is already putting pressure on it.", "3": "Only way for Black to protect the [c5]-pawn.", "4": "Improving our rook with a tempo on the enemy queen. The [a1]-rook can go to the c-file next."}, "moveNags": {}, "intro": "Find the best positional move for White. ☆ Hint: Look for a way to change the pawn structure and open a file – this might help you target an enemy piece effectively."}, {"type": "puzzle", "source": "strategy", "num": 83, "chapter": "Final Test", "title": "Mixed Exercise #7", "fen": "2r3k1/pq2ppb1/6p1/2p1P2p/5P2/1P3N2/P5PP/2RQ2K1 w - - 0 1", "moves": ["Rc4"], "moveComments": {"0": "Fixes the isolated [c5]-pawn in place. Now White can add more pressure on it with their queen, knight, and b-pawn without Black having the option to play [c4]."}, "moveNags": {}, "intro": "This is another of my games where I missed the most accurate strategic move. What would you play as White? ☆ Hint: Imagine it’s Black’s turn – which move would put you in trouble — ...[e6]? ...[a5]? ...[c4]? ...[Qa6]? Use this insight to play a strong prophylactic move and take control. See the term prophylaxis."}, {"type": "puzzle", "source": "strategy", "num": 84, "chapter": "Final Test", "title": "Mixed Exercise #8", "fen": "8/2p1kp1p/2p1pn2/2r5/8/2NP4/1P4PP/5RK1 w - - 0 1", "moves": ["Rxf6", "Rxc3", "Rxf7+", "Kxf7", "bxc3"], "moveComments": {"0": "We temporarily sacrifice an exchange!", "2": "In-between move that secures a pawn and leaves White with a pawn majority 2 vs 1 on the kingside.", "4": "Even though the material is even, White should win because of their superior pawn structure. Feel free to finish this position against a friend or a bot. See, if you wish, the chess terms exchange sacrifice and zwischenzug."}, "moveNags": {}, "intro": "What should White play? Keep an open mind! ☆ Hint: The key is to simplify and steer the game toward a favorable pawn endgame."}, {"type": "puzzle", "source": "strategy", "num": 85, "chapter": "Final Test", "title": "Mixed Exercise #9", "fen": "r4r1k/1bpnq1pp/pp1b4/P3pp2/2PP4/2B1PN2/2Q1BPPP/R1R3K1 w - - 0 1", "moves": ["c5", "bxc5", "dxe5", "Nxe5", "Bxe5", "Bxe5", "Nxe5", "Qxe5", "Qxc5", "Qxc5", "Rxc5"], "moveComments": {"0": "Forcing the b-pawn to become doubled and isolated along with the [c7]-pawn.", "2": "Hitting the black bishop again. This leaves Black with their weak pawns on the c-file while trading down pieces. The fewer pieces they have, the harder it will be to defend their weak pawns.", "4": "Clearing the c-file for the white queen immediately.", "8": "The first isolated pawn fell, and [c7] is next.", "10": "And White can put pressure on the queenside."}, "moveNags": {}, "intro": "Black has a healthier pawn structure, but it’s White to move. How would you continue? ☆ Hint: Look to change the structure by attacking a piece."}, {"type": "puzzle", "source": "strategy", "num": 86, "chapter": "Final Test", "title": "Mixed Exercise #10", "fen": "2r2rk1/1q3pp1/p2p1n1p/1p2p3/4P3/2N2P2/PPPQ2PP/R4R1K b - - 0 1", "moves": ["b4", "Nd1", "d5"], "moveComments": {"0": "The [d6]-pawn is backward/left-behind. Now the white knight has to back up, allowing Black to play [d5] safely.", "2": "And Black is getting rid of their weak pawn."}, "moveNags": {}, "intro": "Can you find the best move for Black? ☆ Hint: 1 Imagine it’s Black’s turn: what move would they play? 2 Now, spot our weakness: how can we deal with it? 3 Which opponent piece is preventing us from playing our ideal move, and how could we deflect it? See, if you wish, the term deflection."}, {"type": "puzzle", "source": "strategy", "num": 87, "chapter": "Final Test", "title": "Mixed Exercise #11", "fen": "k4r1r/p3np2/Ppn1p1pp/3pP3/3P2P1/2P1BR1Q/2q2P1P/1N3RK1 b - - 0 1", "moves": ["h5", "g5", "Nf5"], "moveComments": {"0": "This move makes sure the [f5]-square becomes available for the [e7]-knight to jump to.", "2": "And the knight has a strong outpost on [f5]."}, "moveNags": {}, "intro": "Take a moment to evaluate the position. ☆ Hint: Look for a way to improve a piece on the kingside"}, {"type": "puzzle", "source": "strategy", "num": 88, "chapter": "Final Test", "title": "Mixed Exercise #12", "fen": "3r1q2/p4r1k/1pnp1p2/2p1pP1p/1nP1P1pP/PP1PB1P1/4BQK1/R4R2 b - - 0 1", "moves": ["Nc2", "Ra2", "Nxe3+", "Qxe3", "Nd4"], "moveComments": {"0": "Beautiful move. Now White loses their rook or their dark-squared bishop. Without White's dark-squared bishop, the [c6]-knight can enjoy the [d4]-outpost.", "4": "Remember: it’s not about what we trade, but what we leave on the board: a strong knight versus a bad bishop."}, "moveNags": {}, "intro": "The material is equal, and many pawn moves have been played. ☆ Hint: Can you find a tactic that will make one of our pieces happy?"}, {"type": "puzzle", "source": "strategy", "num": 89, "chapter": "Final Test", "title": "Mixed Exercise #13", "fen": "1r3r2/p4pbk/3pnqp1/2p1p3/2P1P3/3PB3/P2Q2PP/R3KB1R b KQ - 0 1", "moves": ["Bh6", "Bxh6", "Qh4+", "g3", "Qxh6", "Qxh6+", "Kxh6", "Bh3", "Nd4"], "moveComments": {"2": "Double attack.", "8": "Strong knight and control of the only open file on the board."}, "moveNags": {}, "intro": "The position looks a bit wild here; the kings aren’t very safe. ☆ Hint: It's all about securing the [d4]-outpost for the knight."}, {"type": "puzzle", "source": "strategy", "num": 90, "chapter": "Final Test", "title": "Mixed Exercise #14", "fen": "r1n3k1/1q2ppbp/3p2p1/1PpPn1B1/R3P3/1P3P1N/Q5PP/2N4K b - - 0 1", "moves": ["Rb8"], "moveComments": {}, "moveNags": {}, "intro": "How should Black continue? ☆ Hint: Look for White’s key weakness and plan around it."}, {"type": "puzzle", "source": "strategy", "num": 91, "chapter": "Final Test", "title": "Mixed Exercise #15", "fen": "4rk2/p1pq1r1p/1p2p1p1/n2p4/P1PPQP1P/2PB2P1/6K1/R3R3 w - - 0 24", "moves": ["cxd5", "exd5", "Qxe8+", "Qxe8", "Rxe8+", "Kxe8", "h5", "Rf6", "hxg6", "hxg6", "Rh1", "Kf8", "Rh7"], "moveComments": {"0": "Getting rid of their doubled pawn and opening lines for their major pieces.", "5": "White has the better minor piece and a pawn majority on the kingside. How did Capablanca continue?", "6": "Hoping Black takes. That way, the white rook can go to [h1] and get their pawn back. Also, their [f5]-pawn would become a protected passed pawn.", "8": "Leaving Black with a weak pawn on [g6] and opening up the h-file for the white rook.", "10": "Ready to enter the 7th rank.", "12": "The seventh rank is the dream of every rook. Go through the complete game."}, "moveNags": {}, "intro": "This is a game where Capablanca defeated Tartakower in a very technical way. What did White play here? ☆ Hint 1: White can simplify the position and open files to their advantage. ☆ Hint 2: The puzzle is quite long. After finding a way to exchange pieces, take a moment, then look for a way to open a side of the board for a remaining piece."}, {"type": "puzzle", "source": "strategy", "num": 92, "chapter": "Final Test", "title": "Mixed Exercise #16", "fen": "rnb3k1/ppppbq2/4p2Q/4P3/3P4/2N5/PPP2PP1/2K4R b - - 0 1", "moves": ["Qg7", "Qh5", "Qg5+", "Qxg5+", "Bxg5+"], "moveComments": {"0": "Trying to eliminate the dangerous white queen. At the end of the day, Black is up a piece.", "2": "Now White cannot avoid the trade.", "4": "Without queens on the board, the black king is not at risk. Now, Black only needs to develop their queenside."}, "moveNags": {}, "intro": "Can you spot White's threat? ☆ Hint: There is only one move to survive here. After finding it, pay attention to White's own weaknesses and coordinate your pieces."}, {"type": "puzzle", "source": "strategy", "num": 93, "chapter": "Final Test", "title": "Mixed Exercise #17", "fen": "r1bqr1k1/1p3p1p/p1nppQp1/8/3pP3/3P1NPP/PPP2PB1/R4RK1 w - - 0 1", "moves": ["Qf4"], "moveComments": {"0": "White is clearly the one with more active pieces on the kingside. For that reason, they should keep their queen and try to organize an attack. Trading queens would kill the attacking chances."}, "moveNags": {}, "intro": "The position is fairly equal here. ☆ Hint: Assess the forces on the board and ask yourself: 'To trade or not to trade?'"}, {"type": "puzzle", "source": "strategy", "num": 94, "chapter": "Final Test", "title": "Mixed Exercise #18", "fen": "r2r2k1/p3pp2/R2p2p1/1P5p/2P5/1P5P/5PP1/3R2K1 w - - 0 1", "moves": ["Rda1", "Rd7", "b6", "axb6", "Rxa8+"], "moveComments": {"0": "Doubling rooks on the weak [a7]-pawn", "2": "Adding more pressure to the weak and pinned [a7]-pawn.", "3": "A blunder.", "4": "And White is up a rook."}, "moveNags": {}, "intro": "A rook endgame. ☆ Hint: Identify Black’s main weakness and focus your play on it!"}, {"type": "puzzle", "source": "strategy", "num": 95, "chapter": "Final Test", "title": "Mixed Exercise #19", "fen": "r4rk1/pbq2ppp/1p2pn2/2b3B1/8/3B1N2/PPP1QPPP/3R1RK1 w - - 0 13", "moves": ["Bxf6", "gxf6", "Be4"], "moveComments": {"0": "Ruining Black's pawn structure and exposing their king.", "2": "Now that they have weak pawns, we want to get to an endgame. The fewer pieces they have, the harder it is to defend against such weaknesses. Also, it makes sense to remove Black's bishop pair. See the whole game."}, "moveNags": {}, "intro": "Can you play like Reshevsky? ☆ Hint: Look to create weaknesses in the opponent’s camp."}, {"type": "puzzle", "source": "strategy", "num": 96, "chapter": "Final Test", "title": "Mixed Exercise #20", "fen": "2b3rk/5prp/4pB1p/2NpP3/2pP4/2P2P1K/5P1P/6R1 w - - 0 1", "moves": ["Kh4", "h5", "Kxh5", "h6", "Kxh6"], "moveComments": {"0": "Here comes the backup... Mr. King himself!", "4": "White can continue to exploit the pin on the [g7]-rook."}, "moveNags": {}, "intro": "Don’t worry if you don’t see it – there is a mate in six here. ☆ Hint: In short, try to recall Short’s epic game..."}, {"type": "puzzle", "source": "strategy", "num": 97, "chapter": "Final Test", "title": "Mixed Exercise #21", "fen": "5rk1/p1p2pp1/1p3n1p/8/1P2P3/2P2PP1/2N4P/3R2K1 w - - 0 1", "moves": ["b5", "a5", "bxa6"], "moveComments": {"0": "The one pawn that stops three. None of the black pawns from the queenside can move safely.", "2": "En passant!"}, "moveNags": {}, "intro":  cool, but not a big deal. Years later, I got to use it with success, and it felt good. I recently discussed it with a student of mine and he loved it. So, here it is, all White wants is to push the enemy king to the very edge. — Why? — In an endgame, the king needs to be centralized, and because of this move, the black king will take longer to activate. It might be decisive.", "2": "Simple!"}, "moveNags": {}, "intro": "The material is equal. Our rook dominates the e-file, and our pieces are well coordinated. ☆ Hint: Play with the endgame in mind."}, {"type": "puzzle", "source": "strategy", "num": 101, "chapter": "Final Test", "title": "Mixed Exercise #25", "fen": "r3nrk1/p1qn1ppp/bp1p4/2p1p3/2PPP3/BNP2P2/P3B1PP/2RQ1RK1 w - - 0 1", "moves": ["Na1"], "moveComments": {"0": "The knight had no future on [b3]. From [a1], it can go to [c2] and finally to [e3]. From [e3], it can defend its weak [c4]-pawn and potentially jump to [d5] or [f5]."}, "moveNags": {}, "intro": "☆ Hint: You need to play in true Karpovian style."}, {"type": "puzzle", "source": "strategy", "num": 102, "chapter": "Final Test", "title": "Mixed Exercise #26", "fen": "3r1rk1/pbq2p2/1p1bpnp1/2ppN2p/P2P1P2/2PBP3/1P1BQ1PP/3R1RK1 w - - 0 1", "moves": ["Be1", "Kg7", "Bh4"], "moveComments": {"0": "Improving their worst pieces.", "2": "And White's dark-squared bishop is outside of the pawn chain and creating threats."}, "moveNags": {}, "intro": "How should White continue to maximize the power of their pieces? ☆ Hint: Which piece is our least happy? Find a way to reroute it."}, {"type": "puzzle", "source": "strategy", "num": 103, "chapter": "Final Test", "title": "Mixed Exercise #27", "fen": "2b2k2/5ppp/p3p3/1nN5/4P3/5P2/1P2BKPP/8 w - - 0 1", "moves": ["Bxb5", "axb5", "e5"], "moveComments": {"0": "Leaving the bad bishop vs our strong knight.", "2": "And the black bishop is very limited by its own pawns."}, "moveNags": {}, "intro": "This game is strategically won for White. What’s the best continuation? ☆ Hint: Simplify the position and aim to bury Black’s worst piece."}, {"type": "puzzle", "source": "strategy", "num": 104, "chapter": "Final Test", "title": "Mixed Exercise #28", "fen": "3q1rk1/3r1p1p/1p2p1pQ/2p1P3/2P1b3/4P3/1B3PPP/R2R2K1 w - - 0 1", "moves": ["Rd6", "Bb7", "Rad1", "Rxd6", "exd6"], "moveComments": {"0": "Landing on the outpost and getting ready to double with [Rad1].", "2": "What's better than one rook on an open file? Two rooks doubled on the open file!", "4": "Clearing the long diagonal for the [b2]-bishop."}, "moveNags": {}, "intro": "What would you play next as White? ☆ Hint: Take advantage of our control over the dark squares."}, {"type": "puzzle", "source": "strategy", "num": 105, "chapter": "Final Test", "title": "Mixed Exercise #29", "fen": "r1b1kr2/p2npp1Q/2p3p1/q7/1p5P/3B4/PPP2PP1/R2NK2R b KQq - 0 1", "moves": ["Qe5+", "Kf1", "Rh8"], "moveComments": {"2": "And the white queen is trapped."}, "moveNags": {}, "intro": "In this position, it’s Black to move. What would you play? ☆ Hint: Look for unprotected pieces – and pay attention to the dark squares, something is happening there."}, {"type": "puzzle", "source": "strategy", "num": 106, "chapter": "Final Test", "title": "Mixed Exercise #30", "fen": "8/1p3k2/p4p1p/q1p2Pp1/6P1/P2R3P/1P6/1K1R4 w - - 0 1", "moves": ["Rd8"], "moveComments": {}, "moveNags": {}, "intro": "We already know that two rooks can sometimes be stronger than a queen. What would you play as White in this position? ☆ Hint: Notice how influential our [f5]-pawn is."}, {"type": "puzzle", "source": "strategy", "num": 107, "chapter": "Final Test", "title": "Mixed Exercise #31", "fen": "8/8/8/8/6K1/8/4Q2p/6k1 w - - 0 1", "moves": ["Kg3", "h1=Q", "Qf2#"], "moveComments": {"2": "White only won this endgame because their king was active."}, "moveNags": {}, "intro": "What’s the best move for White? ☆ Hint: The black pawn is close to promotion, but White has a quiet move that changes everything..."}, {"type": "puzzle", "source": "strategy", "num": 108, "chapter": "Final Test", "title": "Mixed Exercise #32", "fen": "rn5k/1p2q1p1/pB1pp2p/4p3/4P1Q1/2P3P1/PP3P1P/3R2K1 w - - 0 1", "moves": ["Qh4", "Qxh4", "gxh4"], "moveComments": {"0": "Once White realizes the [d6]-pawn is weak, it only makes sense to remove the only black piece protecting it and keeping the whole black position together.", "2": "And the [d6]-pawn falls."}, "moveNags": {}, "intro": "Take a moment to evaluate this position and come up with a plan for White. ☆ Hint: Deflection"}, {"type": "text", "source": "strategy", "chapter": "Conclusion", "title": "Closing Remarks", "intro": "That’s it! These are the core principles that helped me become a master. You don't need to know everything: you just need to know what works! If some ideas showed up more than once, that’s intentional. The best chess habits come from seeing key concepts in different contexts until they stick. Keep things simple, trust what you’ve learned, and most importantly, keep playing. Finally, remember that chess is really three games in one. It’s like playing checkers, dominoes, and chess, each with its own rules and rhythm. The opening, middlegame, and endgame each demand different skills, and recognizing when you're moving from one phase to the next is half the battle. Stay alert during those transitions: they’re where strategy comes to life. See you on the board!"}]};
