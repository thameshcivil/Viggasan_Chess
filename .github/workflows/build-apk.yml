name: Build Android APK

# Builds an installable .apk of Vigaasan's Chess Board from this repo's
# GitHub Pages site and attaches it to the run as a downloadable artifact
# (Actions tab -> this run -> Artifacts, near the bottom of the summary).
#
# Requires GitHub Pages to be enabled for this repository
# (Settings -> Pages -> Deploy from a branch -> main -> / (root)), since the
# APK is a Trusted Web Activity that wraps the live site at
# https://<owner>.github.io/<repo>/.
#
# Signing:
#  * If the repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD are set
#    (optionally KEYSTORE_ALIAS, default "vigaasan"), every build is signed
#    with that same stable key. That is what lets Android verify the app
#    against /.well-known/assetlinks.json and hide the browser address bar,
#    and what lets a new APK install over an old one.
#  * If they are NOT set, the build still succeeds using a throwaway key
#    generated for this run only, with a warning. That APK installs fine for
#    testing, but shows the address bar and can't update a previous install.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Give Bubblewrap the SDK layout it expects
        # Bubblewrap only accepts an SDK path containing "<sdk>/tools" or
        # "<sdk>/bin"; GitHub's runner SDK only has cmdline-tools/latest/bin,
        # so link it.
        run: |
          if [ ! -e "$ANDROID_HOME/bin" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            ln -s cmdline-tools/latest/bin "$ANDROID_HOME/bin"
            echo "Linked $ANDROID_HOME/bin -> cmdline-tools/latest/bin"
          fi

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the pre-installed JDK and Android SDK
        # Writing ~/.bubblewrap/config.json up front skips Bubblewrap's
        # interactive first-run wizard, which can't run in CI.
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e '
          const fs = require("fs"), path = require("path");
          const file = path.join(process.env.HOME, ".bubblewrap", "config.json");
          fs.writeFileSync(file, JSON.stringify({ jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.ANDROID_HOME }, null, 2) + "\n");
          console.log(fs.readFileSync(file, "utf8"));
          '
          bubblewrap doctor || true

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          ALIAS="${KEYSTORE_ALIAS:-vigaasan}"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using the stable signing key from repository secrets (alias: $ALIAS)."
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are not set, so this APK is signed with a one-off key. It will install for testing, but will show the browser address bar and cannot update an earlier install. See README.md -> 'Stable signing'."
            PASS="vigaasan-$(openssl rand -hex 12)"
            keytool -genkeypair -v -keystore android.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Vigaasan Chess Board, OU=Trainer, O=Vigaasan, C=IN"
          fi
          echo "::add-mask::$PASS"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Write twa-manifest.json for this repository's Pages site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
          const fs = require("fs");
          const owner = String(process.env.OWNER || "").toLowerCase();
          const repo = String(process.env.REPO || "");
          const runNumber = parseInt(process.env.RUN_NUMBER || "1", 10);
          const host = owner + ".github.io";
          const base = "https://" + host + "/" + repo + "/";
          let pkgSuffix = owner.replace(/[^a-z0-9]/g, "");
          if (/^[0-9]/.test(pkgSuffix)) pkgSuffix = "u" + pkgSuffix;
          if (!pkgSuffix) pkgSuffix = "app";
          // The package id is internal (never shown to users). It keeps its
          // original value so existing installs and any assetlinks.json you
          // already published stay valid.
          const packageId = "io.github." + pkgSuffix + ".ledgerboard";
          const manifest = {
            packageId: packageId,
            host: host,
            name: "Vigaasan’s Chess Board",
            launcherName: "Vigaasan",
            display: "standalone",
            orientation: "default",
            themeColor: "#1D0B12",
            navigationColor: "#1D0B12",
            navigationColorDark: "#1D0B12",
            navigationDividerColor: "#1D0B12",
            navigationDividerColorDark: "#1D0B12",
            backgroundColor: "#1D0B12",
            enableNotifications: false,
            startUrl: "/" + repo + "/index.html",
            iconUrl: base + "icon-512.png",
            maskableIconUrl: base + "icon-512-maskable.png",
            splashScreenFadeOutDuration: 300,
            signingKey: { path: "./android.keystore", alias: process.env.KEY_ALIAS || "vigaasan" },
            appVersionName: "2.0." + runNumber,
            appVersionCode: runNumber,
            shortcuts: [],
            generatorApp: "bubblewrap-cli",
            webManifestUrl: base + "manifest.json",
            fallbackType: "customtabs",
            features: {},
            enableSiteSettingsShortcut: true,
            isChromeOSOnly: false,
            isMetaQuest: false,
            fullScopeUrl: base,
            minSdkVersion: 24
          };
          fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log(fs.readFileSync("twa-manifest.json", "utf8"));
          '

      - name: Generate the Android project from the manifest
        run: yes | bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade

      - name: Build the signed APK
        # On failure, the last lines of output are re-emitted as annotations
        # so the cause is visible on the run's summary page.
        run: |
          set -o pipefail
          if ! (yes | bubblewrap build --skipPwaValidation) 2>&1 | tee build.log; then
            grep -iE "error|what went wrong|exception|failed|cause" build.log | tail -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          fi

      - name: Print the signing fingerprint (for assetlinks.json)
        run: keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -E "SHA256:" || true

      - name: Upload APK as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigaasans-chess-board-apk
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 90
