name: Build Android APK

# Builds Vigaasan's Chess Board as a native Android app (the android/
# folder): a full-screen WebView showing this repo's GitHub Pages site.
# A WebView has no browser toolbar, so unlike the old Trusted Web Activity
# build there is no address bar and nothing to verify with assetlinks.json.
#
# Download: Actions tab -> latest run -> Artifacts -> vigaasans-chess-board-apk
#
# Signing: if the repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD
# (optionally KEYSTORE_ALIAS, default "vigaasan") are set, every build uses
# that stable key, so new APKs install over old ones. Without them, a
# one-off key is generated per run: the APK works, but to install a newer
# build you must uninstall the old one first. As the app loads the live
# site, you rarely need a new APK at all — web changes show up by themselves.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          ALIAS="${KEYSTORE_ALIAS:-vigaasan}"
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Using the stable signing key from repository secrets (alias: $ALIAS)."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::notice::No KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets, so this APK uses a one-off signing key. It works normally; to install a later build, uninstall this one first (export a backup from the app's ELO menu before you do)."
            PASS="vigaasan-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Vigaasan Chess Board, OU=Trainer, O=Vigaasan, C=IN"
          fi
          echo "::add-mask::$PASS"
          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set +o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          tail -n 60 build.log
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|e: |What went wrong|> |FAILURE|Exception" build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk vigaasans-chess-board.apk
          ls -l vigaasans-chess-board.apk

      - name: Upload APK as a downloadable build artifact
        uses: actions/upload-artifact@v5
        with:
          name: vigaasans-chess-board-apk
          path: vigaasans-chess-board.apk
          if-no-files-found: error
          retention-days: 90
